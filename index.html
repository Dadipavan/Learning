els", "sub": "B1. Getting the right data", "kind": "skill"}, {"id": "ds:d362f8c4", "text": "Understand how each source is generated (what events create a row? what's missing by design?)", "sub": "B1. Getting the right data", "kind": "skill"}, {"id": "ds:29d394fe", "text": "Write SQL to build a **training dataset with point-in-time correctness** (features computed only from data before the prediction time)", "sub": "B1. Getting the right data", "kind": "skill"}, {"id": "ds:716e1d57", "text": "Sampling: random, stratified, time-based; know when a sample misrepresents the population", "sub": "B1. Getting the right data", "kind": "skill"}, {"id": "ds:73193012", "text": "Data dictionaries, definitions of metrics, and source-of-truth tables; document assumptions", "sub": "B1. Getting the right data", "kind": "skill"}, {"id": "ds:821e9801", "text": "Join logic pitfalls: duplicate keys fan-out, many-to-many joins, left vs inner changes the population, time-misaligned joins", "sub": "B1. Getting the right data", "kind": "skill"}, {"id": "ds:71cef90d", "text": "Completeness: nulls by column and by segment, and *why* they are null (not applicable vs not recorded vs error)", "sub": "B2. Data quality checks (before any modeling)", "kind": "skill"}, {"id": "ds:68d978e2", "text": "Validity: ranges, formats, categorical levels, units, time zones, currencies", "sub": "B2. Data quality checks (before any modeling)", "kind": "skill"}, {"id": "ds:63689a61", "text": "Uniqueness: duplicate rows/keys; **late-arriving and updated records**", "sub": "B2. Data quality checks (before any modeling)", "kind": "skill"}, {"id": "ds:728ca97d", "text": "Consistency: same metric computed two ways; totals reconcile with finance/BI numbers", "sub": "B2. Data quality checks (before any modeling)", "kind": "skill"}, {"id": "ds:69f566b5", "text": "Timeliness: when is data finalized? Is yesterday's data incomplete?", "sub": "B2. Data quality checks (before any modeling)", "kind": "skill"}, {"id": "ds:8efade1a", "text": "Distribution checks over time to catch silent pipeline changes", "sub": "B2. Data quality checks (before any modeling)", "kind": "skill"}, {"id": "ds:40397ff6", "text": "Automate checks (`pandera`, `great_expectations`, SQL tests)", "sub": "B2. Data quality checks (before any modeling)", "kind": "skill"}, {"id": "ds:c9faa40a", "text": "Label definition, label noise, label delay (censoring), selection bias in labels (you only observe outcomes for people you approved/showed)", "sub": "B3. Labels and ground truth", "kind": "skill"}, {"id": "ds:da7fe4b3", "text": "Human labeling: guidelines, inter-annotator agreement (Cohen's kappa), quality audits, active learning to prioritize labeling", "sub": "B3. Labels and ground truth", "kind": "skill"}, {"id": "ds:7e140dfe", "text": "Weak supervision / heuristic labels (Snorkel idea), proxy labels, and their risks", "sub": "B3. Labels and ground truth", "kind": "skill"}, {"id": "ds:87345e64", "text": "Positive-unlabeled (PU) problems and survivorship/selection bias; reject inference in credit", "sub": "B3. Labels and ground truth", "kind": "skill"}, {"id": "ds:86a129fb", "text": "PII identification, anonymization vs pseudonymization, minimization, retention", "sub": "B4. Privacy and ethics in data use", "kind": "skill"}, {"id": "ds:b849724f", "text": "India's DPDP Act, GDPR basics: consent, purpose limitation, right to erasure", "sub": "B4. Privacy and ethics in data use", "kind": "skill"}, {"id": "ds:337cf37f", "text": "Sensitive attributes (caste, religion, gender, health): when not to use them, and proxy variables that leak them", "sub": "B4. Privacy and ethics in data use", "kind": "skill"}, {"id": "ds:bb6e4044", "text": "Differential privacy and federated learning (awareness)", "sub": "B4. Privacy and ethics in data use", "kind": "skill"}], "notes": {"B1. Getting the right data": ["**Why it matters:** \"Garbage in, garbage out\" is understated. Most model failures trace back to data problems: biased samples, missing populations, inconsistent definitions, or labels that don't mean what you think."], "B2. Data quality checks (before any modeling)": ["**Rule:** never trust a dataset until you have tried to break it. Check row counts against known totals, look for impossible values, and ask \"what would a bug here look like?\""], "B3. Labels and ground truth": ["**Insight:** The label is a proxy for what you really care about. \"Clicked\" ≠ \"liked\". \"Defaulted within 12 months\" has a 12-month delay before you know the truth. Label quality caps model quality."]}}, {"title": "C. EXPLORATORY DATA ANALYSIS (deep)", "items": [{"id": "ds:9de7d9fd", "text": "Profile: shape, dtypes, memory, duplicates, unique counts, cardinality of categoricals", "sub": "", "kind": "skill"}, {"id": "ds:741288fb", "text": "Missingness analysis: heatmap, correlation of missingness with target, MCAR/MAR/MNAR reasoning", "sub": "", "kind": "skill"}, {"id": "ds:6fbd21df", "text": "Univariate: histograms (try log scale), boxplots, skew/kurtosis, mode spikes (e.g. default values like 0, -1, 9999), outliers (error vs real extreme)", "sub": "", "kind": "skill"}, {"id": "ds:ad561c0f", "text": "Target analysis: class balance, distribution, how it changes over time and across segments", "sub": "", "kind": "skill"}, {"id": "ds:891a1793", "text": "Bivariate: feature vs target (binned rates, partial plots), correlation matrix (Pearson/Spearman), Cramér's V for categoricals, mutual information", "sub": "", "kind": "skill"}, {"id": "ds:eae94110", "text": "Segment analysis: who behaves differently (geography, device, cohort, acquisition channel)?", "sub": "", "kind": "skill"}, {"id": "ds:8fdc0e3b", "text": "Time analysis: trends, seasonality, weekday/holiday effects, **data drift between train and recent periods**", "sub": "", "kind": "skill"}, {"id": "ds:7f2b88f1", "text": "Simpson's paradox check: does a trend reverse within segments?", "sub": "", "kind": "skill"}, {"id": "ds:9a66aa6e", "text": "Leakage hunting: any feature suspiciously predictive? Does it exist before the prediction time?", "sub": "", "kind": "skill"}, {"id": "ds:9e8a4ccf", "text": "Write findings as hypotheses + evidence + \"so what\"; keep an EDA notebook that someone else can rerun", "sub": "", "kind": "skill"}, {"id": "ds:c785e0ca", "text": "Tools: `pandas`, `ydata-profiling`, `sweetviz`, `missingno`, `seaborn`, `plotly`, SQL", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** EDA is where most insight and most bug-finding happen. A good analyst forms hypotheses, tests them quickly, and keeps a written trail. The goal isn't pretty charts; it's understanding what generated this data.", "**Method:** Start broad (shape, types, missingness), go univariate, then bivariate against the target, then interactions and segments, then time. Write down every surprise."]}}, {"title": "D. STATISTICAL THINKING FOR DATA SCIENTISTS", "items": [{"id": "ds:f94041a0", "text": "**Correlation vs causation** and confounding; spurious correlations", "sub": "D1. Ways data fools you (know them cold)", "kind": "skill"}, {"id": "ds:7f81bdbe", "text": "**Simpson's paradox** (aggregate trend reverses by group)", "sub": "D1. Ways data fools you (know them cold)", "kind": "skill"}, {"id": "ds:3cd3b52b", "text": "**Selection bias** (the sample isn't the population), **survivorship bias** (only winners observed), **Berkson's paradox**", "sub": "D1. Ways data fools you (know them cold)", "kind": "skill"}, {"id": "ds:c9f394e1", "text": "**Regression to the mean** (extremes drift back; \"improvements\" after picking worst performers)", "sub": "D1. Ways data fools you (know them cold)", "kind": "skill"}, {"id": "ds:a1d3abc2", "text": "**p-hacking / multiple comparisons / garden of forking paths**; false discovery rate control", "sub": "D1. Ways data fools you (know them cold)", "kind": "skill"}, {"id": "ds:c7a5b62c", "text": "**Base-rate neglect** (a 99% accurate test on a rare event gives mostly false positives)", "sub": "D1. Ways data fools you (know them cold)", "kind": "skill"}, {"id": "ds:5555edf0", "text": "**Goodhart's law** (when a metric becomes a target it stops being a good metric) and metric gaming", "sub": "D1. Ways data fools you (know them cold)", "kind": "skill"}, {"id": "ds:4d5d03a2", "text": "**Overfitting to the validation set** by repeated peeking", "sub": "D1. Ways data fools you (know them cold)", "kind": "skill"}, {"id": "ds:c88ab8fc", "text": "Look-ahead bias and leakage in time-based data", "sub": "D1. Ways data fools you (know them cold)", "kind": "skill"}, {"id": "ds:aca1093a", "text": "Standard errors, confidence intervals (analytical and **bootstrap**), prediction intervals vs confidence intervals", "sub": "D2. Uncertainty", "kind": "skill"}, {"id": "ds:aa86fda0", "text": "Effect size and practical significance vs statistical significance", "sub": "D2. Uncertainty", "kind": "skill"}, {"id": "ds:afaeafa1", "text": "Bayesian thinking: priors, updating, credible intervals; when it beats frequentist methods (small data, sequential decisions)", "sub": "D2. Uncertainty", "kind": "skill"}, {"id": "ds:929e6937", "text": "Reporting uncertainty clearly to non-technical audiences", "sub": "D2. Uncertainty", "kind": "skill"}], "notes": {"": ["**Why it matters:** This is what separates a data scientist from someone who runs models. Statistics tells you when a pattern is real, how sure you can be, and what could fool you."], "D2. Uncertainty": ["**Insight:** A number without uncertainty is a guess dressed up as a fact. Always ask: how much could this change with different data?"]}}, {"title": "E. FEATURE ENGINEERING (deep)", "items": [{"id": "ds:5e3889e2", "text": "Numeric: log/sqrt/Box-Cox/Yeo-Johnson for skew, clipping, binning (equal-width, quantile, supervised), scaling (when needed), ratios and differences", "sub": "E1. Core transformations", "kind": "skill"}, {"id": "ds:f7ae9c9b", "text": "Categorical: one-hot, ordinal, frequency/count encoding, **target encoding with out-of-fold computation** (leakage risk!), hashing, learned embeddings; grouping rare categories", "sub": "E1. Core transformations", "kind": "skill"}, {"id": "ds:7ba2e49e", "text": "Dates: year/month/day-of-week/hour, is_weekend/holiday (Indian holiday calendar), days since event, cyclical sin/cos, time-to-next-event", "sub": "E1. Core transformations", "kind": "skill"}, {"id": "ds:fbcfd60d", "text": "Text: length, counts, TF-IDF, embeddings; Geo: distance, clustering, region features, H3/geohash", "sub": "E1. Core transformations", "kind": "skill"}, {"id": "ds:7cd3a81f", "text": "Missing-value indicators as features (missingness is often informative)", "sub": "E1. Core transformations", "kind": "skill"}, {"id": "ds:ba6a18d5", "text": "**RFM**: recency, frequency, monetary", "sub": "E2. Behavioral and aggregate features (the biggest wins)", "kind": "skill"}, {"id": "ds:e575dbd2", "text": "Rolling-window aggregates (7/30/90 days): counts, sums, means, std, min/max, trends (last 7 vs previous 30), ratios between windows", "sub": "E2. Behavioral and aggregate features (the biggest wins)", "kind": "skill"}, {"id": "ds:55d26570", "text": "Lag features, time since last event, streaks, gaps, velocity (rate of change), acceleration", "sub": "E2. Behavioral and aggregate features (the biggest wins)", "kind": "skill"}, {"id": "ds:cf4fb558", "text": "Entity aggregates (per user, per merchant, per device) and **cross-entity** features (user × category)", "sub": "E2. Behavioral and aggregate features (the biggest wins)", "kind": "skill"}, {"id": "ds:40104336", "text": "Interaction features, polynomial features, and domain-specific ratios (debt-to-income, utilization, price per unit)", "sub": "E2. Behavioral and aggregate features (the biggest wins)", "kind": "skill"}, {"id": "ds:3a645a10", "text": "Graph/network features (degree, shared devices/addresses for fraud) — awareness", "sub": "E2. Behavioral and aggregate features (the biggest wins)", "kind": "skill"}, {"id": "ds:ead37381", "text": "Remove leakage features, constant/near-constant features, duplicated information", "sub": "E3. Selection and hygiene", "kind": "skill"}, {"id": "ds:c5e70bcb", "text": "Filter (variance, correlation, mutual information), wrapper (RFE), embedded (L1, tree importance), **permutation importance**, SHAP-based selection, Boruta", "sub": "E3. Selection and hygiene", "kind": "skill"}, {"id": "ds:f5ecc23e", "text": "Stability: does the feature behave the same in train and recent data? (PSI per feature)", "sub": "E3. Selection and hygiene", "kind": "skill"}, {"id": "ds:e048263a", "text": "Build features in **pipelines**; one definition used in training and serving (avoid training-serving skew)", "sub": "E3. Selection and hygiene", "kind": "skill"}, {"id": "ds:68de0a28", "text": "Tools: `scikit-learn` pipelines, `feature-engine`, `category_encoders`, `featuretools`, `tsfresh`, `polars`/`duckdb` for fast aggregations", "sub": "E3. Selection and hygiene", "kind": "skill"}], "notes": {"": ["**Why it matters:** On tabular data, feature quality usually beats algorithm choice. Great features encode domain knowledge in a form models can use. This is the highest-leverage skill in applied DS.", "**Method:** Ask \"what would a human expert look at to make this decision?\" and turn each answer into a number computed only from data available at prediction time."]}}, {"title": "F. EXPERIMENTATION AND CAUSAL INFERENCE (deep)", "items": [{"id": "ds:e719260e", "text": "Define hypothesis, **primary metric**, guardrail metrics, randomization unit (user/session/device), and exposure criteria", "sub": "F1. A/B testing done properly", "kind": "skill"}, {"id": "ds:42617040", "text": "Sample size and power: minimum detectable effect (MDE), baseline rate, variance, alpha/beta; test duration (cover full weekly cycles)", "sub": "F1. A/B testing done properly", "kind": "skill"}, {"id": "ds:43589c72", "text": "Analysis: two-proportion z-test, t-test/Welch, confidence intervals on the lift, relative vs absolute lift", "sub": "F1. A/B testing done properly", "kind": "skill"}, {"id": "ds:0ed8b2e6", "text": "Variance reduction: **CUPED**, stratification, regression adjustment", "sub": "F1. A/B testing done properly", "kind": "skill"}, {"id": "ds:91f9d8a2", "text": "Pitfalls: peeking/optional stopping, sample ratio mismatch (SRM), novelty/primacy effects, interference/network effects, multiple metrics and segments, Simpson's in rollouts, ratio metrics (delta method), heavy-tailed revenue metrics (winsorizing, bootstrap)", "sub": "F1. A/B testing done properly", "kind": "skill"}, {"id": "ds:b11eb456", "text": "Sequential testing, always-valid p-values, Bayesian A/B, **multi-armed bandits** for continuous optimization", "sub": "F1. A/B testing done properly", "kind": "skill"}, {"id": "ds:6e3bda29", "text": "Decision-making: ship / don't ship / iterate; document learnings in an experiment log", "sub": "F1. A/B testing done properly", "kind": "skill"}, {"id": "ds:65097a02", "text": "Book: *Trustworthy Online Controlled Experiments* (Kohavi)", "sub": "F1. A/B testing done properly", "kind": "skill"}, {"id": "ds:31c590aa", "text": "Potential outcomes framework: ATE, ATT, CATE; fundamental problem of causal inference", "sub": "F2. Causal inference when you can't randomize", "kind": "skill"}, {"id": "ds:0c305840", "text": "**DAGs**: confounders, mediators, colliders; backdoor criterion; what to control for (and what not to: colliders/mediators)", "sub": "F2. Causal inference when you can't randomize", "kind": "skill"}, {"id": "ds:8ca2a097", "text": "Regression adjustment, **propensity scores** (matching, weighting/IPW, stratification), overlap/positivity checks, covariate balance (SMD)", "sub": "F2. Causal inference when you can't randomize", "kind": "skill"}, {"id": "ds:ed55860c", "text": "**Doubly robust** estimators (AIPW), double machine learning (DML)", "sub": "F2. Causal inference when you can't randomize", "kind": "skill"}, {"id": "ds:8a60a995", "text": "**Difference-in-differences** (parallel trends, event studies), **synthetic control**, **regression discontinuity**, **instrumental variables**, interrupted time series", "sub": "F2. Causal inference when you can't randomize", "kind": "skill"}, {"id": "ds:dcdfa389", "text": "**Uplift modeling / heterogeneous treatment effects**: meta-learners (S/T/X/R), causal forests; Qini/uplift curves; who to target", "sub": "F2. Causal inference when you can't randomize", "kind": "skill"}, {"id": "ds:7bc53764", "text": "Sensitivity analysis for unobserved confounding", "sub": "F2. Causal inference when you can't randomize", "kind": "skill"}, {"id": "ds:e466fdda", "text": "Libraries: `DoWhy`, `EconML`, `CausalML`, `linearmodels`, `statsmodels`", "sub": "F2. Causal inference when you can't randomize", "kind": "skill"}, {"id": "ds:ef38c5f6", "text": "Resources (free): *Causal Inference for the Brave and True*, *The Effect*, *The Mixtape*", "sub": "F2. Causal inference when you can't randomize", "kind": "skill"}], "notes": {"": ["**Why it matters:** Companies ultimately care about what *causes* outcomes: \"if we do X, will Y improve?\" Predictive models can't answer that. Experiments and causal methods can. This is one of the most valued DS skills, and one of the rarest."], "F1. A/B testing done properly": ["**Insight:** Randomization makes the groups comparable on everything, including things you didn't measure. That's why it's the gold standard. Most mistakes come from the design and analysis, not the math."], "F2. Causal inference when you can't randomize": ["**Insight:** In observational data, people who got the treatment differ from those who didn't (confounding). Causal methods try to recreate the fair comparison. Each method rests on assumptions you must state and check."]}}, {"title": "G. FORECASTING AND TIME SERIES (deep)", "items": [{"id": "ds:63da3e49", "text": "Components: level, trend, seasonality (multiple), holidays/events, noise; decomposition (STL)", "sub": "", "kind": "skill"}, {"id": "ds:ab4909f0", "text": "Stationarity, differencing, ACF/PACF, unit root tests (ADF/KPSS)", "sub": "", "kind": "skill"}, {"id": "ds:41bbfa83", "text": "Baselines: naive, seasonal naive, moving average, drift", "sub": "", "kind": "skill"}, {"id": "ds:5acc504c", "text": "Classical: exponential smoothing (ETS/Holt-Winters), ARIMA/SARIMA/SARIMAX, TBATS, Prophet", "sub": "", "kind": "skill"}, {"id": "ds:8b1c0cea", "text": "ML approach: lag + rolling + calendar features with LightGBM/XGBoost; **global models** trained across many series", "sub": "", "kind": "skill"}, {"id": "ds:e58e4179", "text": "Deep/other: LSTM/GRU, N-BEATS, Temporal Fusion Transformer, PatchTST, foundation models for time series (Chronos, TimesFM — awareness)", "sub": "", "kind": "skill"}, {"id": "ds:fa6fca5d", "text": "**Validation:** rolling-origin / walk-forward backtesting, never random k-fold; horizon-specific errors", "sub": "", "kind": "skill"}, {"id": "ds:1bd90f78", "text": "Metrics: MAE, RMSE, MAPE/sMAPE (and their problems near zero), MASE, WAPE; **prediction intervals and probabilistic forecasts** (quantile loss, CRPS, conformal)", "sub": "", "kind": "skill"}, {"id": "ds:1b7fa6bd", "text": "Hierarchical/grouped forecasting and reconciliation; intermittent demand (Croston/TSB); cold-start series; promotions and price effects; forecast accuracy vs bias", "sub": "", "kind": "skill"}, {"id": "ds:60bada4b", "text": "Forecast to decision: inventory/safety stock, staffing, capacity planning", "sub": "", "kind": "skill"}, {"id": "ds:561e6bda", "text": "Anomaly and change-point detection in series (`ruptures`, STL residuals)", "sub": "", "kind": "skill"}, {"id": "ds:fb1ff4cd", "text": "Libraries: `statsmodels`, `statsforecast`, `sktime`, `darts`, `prophet`, `neuralforecast`, `pmdarima`", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** Demand, revenue, traffic, inventory, staffing and capacity all depend on forecasts. Time series breaks normal ML rules: data points are not independent and the future must never leak into training.", "**Rule 1:** always compare against naive baselines (last value, same period last year). Many fancy models fail to beat them."]}}, {"title": "H. RECOMMENDATION, RANKING, AND SEARCH (deep)", "items": [{"id": "ds:1ecb7d39", "text": "Problem types: top-N recommendation, rating prediction, next-item/sequence, similar items, search ranking, feed ranking", "sub": "", "kind": "skill"}, {"id": "ds:f49297eb", "text": "Data: explicit vs **implicit feedback**, negative sampling, exposure bias, popularity bias, position bias", "sub": "", "kind": "skill"}, {"id": "ds:3455c375", "text": "Baselines: popularity, recently popular, co-occurrence/item-item similarity", "sub": "", "kind": "skill"}, {"id": "ds:5c26f530", "text": "Content-based (TF-IDF/embeddings), collaborative filtering (user/item kNN), **matrix factorization** (SVD, ALS, BPR), factorization machines", "sub": "", "kind": "skill"}, {"id": "ds:ac1fc326", "text": "Two-stage architecture: **candidate generation** (fast, recall-focused, ANN search) → **ranking** (precise, feature-rich) → re-ranking (diversity, business rules)", "sub": "", "kind": "skill"}, {"id": "ds:9fa1a994", "text": "Learning to rank: pointwise/pairwise/listwise, LambdaMART (LightGBM ranker); two-tower neural models; sequence models (GRU4Rec, SASRec/transformers)", "sub": "", "kind": "skill"}, {"id": "ds:b0059e17", "text": "Cold start (new users/items): content features, popularity, exploration/bandits, onboarding questions", "sub": "", "kind": "skill"}, {"id": "ds:cffb46c5", "text": "Metrics: Precision@K, Recall@K, MAP, **NDCG**, MRR, hit rate, coverage, diversity, novelty, serendipity; online: CTR, conversion, retention, long-term value", "sub": "", "kind": "skill"}, {"id": "ds:d77476c6", "text": "Offline evaluation traps: random split vs time split, leakage of future interactions, counterfactual evaluation (inverse propensity scoring), interleaving", "sub": "", "kind": "skill"}, {"id": "ds:6982f4a9", "text": "Search: BM25, query understanding, learning to rank, relevance judgments, vector search + hybrid", "sub": "", "kind": "skill"}, {"id": "ds:2afb7288", "text": "Ethics: filter bubbles, fairness to creators/sellers, manipulation", "sub": "", "kind": "skill"}, {"id": "ds:17398f9d", "text": "Libraries: `implicit`, `LightFM`, `Surprise`, `RecBole`, `lightgbm` (ranker), `faiss`", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** Recommenders drive a large share of revenue at e-commerce, streaming, and social companies. They combine ML, product thinking, and experimentation.", "**Insight:** Offline accuracy often doesn't match online impact. The only reliable test is an online A/B test; offline metrics are for filtering ideas."]}}, {"title": "I. APPLIED DOMAINS (pick one or two to go deep)", "items": [{"id": "ds:b72674ab", "text": "Churn definition (contractual vs non-contractual), prediction window, survival analysis approach, **uplift** to target retention offers", "sub": "I1. Churn and customer analytics", "kind": "skill"}, {"id": "ds:4baa7ab1", "text": "Customer lifetime value (BG/NBD + Gamma-Gamma, cohort-based CLV), segmentation (RFM + clustering), next-best-action", "sub": "I1. Churn and customer analytics", "kind": "skill"}, {"id": "ds:54548ec3", "text": "Credit scoring: PD/LGD/EAD concepts, **scorecards** (WoE binning, Information Value, logistic regression), KS, Gini = 2·AUC − 1, **PSI** for monitoring, reject inference, regulatory expectations (explainability, RBI guidelines awareness)", "sub": "I2. Credit risk and fraud (BFSI)", "kind": "skill"}, {"id": "ds:c86e05e4", "text": "Fraud detection: extreme imbalance, precision at fixed review capacity, cost-based thresholds, graph features, real-time scoring latency, adversarial adaptation, concept drift", "sub": "I2. Credit risk and fraud (BFSI)", "kind": "skill"}, {"id": "ds:c77d2b37", "text": "Anti-money laundering (awareness), insurance pricing/claims (GLMs, frequency × severity)", "sub": "I2. Credit risk and fraud (BFSI)", "kind": "skill"}, {"id": "ds:afcde0fc", "text": "Attribution (last-touch, multi-touch, data-driven), campaign measurement, incrementality testing/geo experiments", "sub": "I3. Marketing and pricing", "kind": "skill"}, {"id": "ds:16e0b6d8", "text": "**Marketing mix modeling** (adstock + saturation; Bayesian MMM: PyMC-Marketing, Robyn)", "sub": "I3. Marketing and pricing", "kind": "skill"}, {"id": "ds:5cb77172", "text": "Pricing: price elasticity, demand curves, dynamic pricing, promotions, markdown optimization", "sub": "I3. Marketing and pricing", "kind": "skill"}, {"id": "ds:608a39f9", "text": "Demand forecasting, inventory optimization (safety stock, newsvendor), routing/scheduling (OR-Tools), capacity planning, logistics ETA prediction", "sub": "I4. Demand, supply chain, and operations", "kind": "skill"}, {"id": "ds:f3e3519a", "text": "Performance/capacity analytics (my JMeter background): response-time modeling, queueing theory basics (Little's law), anomaly detection on system metrics, capacity forecasting — a *niche where I'm already ahead*", "sub": "I4. Demand, supply chain, and operations", "kind": "skill"}, {"id": "ds:a8234226", "text": "Healthcare: survival analysis, imbalanced rare outcomes, strict privacy, calibration and clinical utility", "sub": "I5. Healthcare, telecom, and others (awareness)", "kind": "skill"}, {"id": "ds:f79598ba", "text": "Telecom: churn, network anomaly, usage forecasting; Retail/e-commerce: assortment, search, recommendations, returns; Manufacturing: predictive maintenance, quality (time-to-failure, anomaly)", "sub": "I5. Healthcare, telecom, and others (awareness)", "kind": "skill"}, {"id": "ds:1534ac40", "text": "Geospatial analytics: `geopandas`, `shapely`, `h3`, map visualization, spatial joins, distance/route features", "sub": "I5. Healthcare, telecom, and others (awareness)", "kind": "skill"}, {"id": "ds:ab8ed248", "text": "Classifying support tickets, extracting fields from documents, sentiment/topic mining of reviews, semantic search; basic image classification/inspection (details in `05_Deep_Learning_and_GenAI.md`)", "sub": "I6. NLP and vision in business settings", "kind": "skill"}], "notes": {"": ["**Why it matters:** Employers hire people who understand their business. Domain depth is a career moat, especially in India where BFSI (banking/financial services/insurance), e-commerce, telecom, and healthcare are huge employers."]}}, {"title": "J. FROM PREDICTION TO DECISION (prescriptive analytics)", "items": [{"id": "ds:bac81cfc", "text": "Expected value thinking: cost matrix, expected profit by threshold, choosing operating points", "sub": "", "kind": "skill"}, {"id": "ds:0fa5fce2", "text": "Optimization: linear/integer programming (`PuLP`, `OR-Tools`, `Pyomo`, `cvxpy`), knapsack/assignment/routing problems, budget allocation", "sub": "", "kind": "skill"}, {"id": "ds:35bb5323", "text": "Simulation: Monte Carlo, what-if scenarios, sensitivity analysis, risk quantification", "sub": "", "kind": "skill"}, {"id": "ds:28415478", "text": "Decision under uncertainty: bandits, Bayesian decision theory, A/B test as decision tool", "sub": "", "kind": "skill"}, {"id": "ds:ebe87102", "text": "Feedback loops: your model changes the data you'll see next (position bias, selective labels); design for monitoring and exploration", "sub": "", "kind": "skill"}], "notes": {"": ["**Insight:** A prediction is only useful if it changes an action. \"This customer has a 30% churn risk\" is worthless until you decide who gets an offer, given budget and expected uplift. Decision science combines predictions + costs + constraints."]}}, {"title": "K. COMMUNICATING AND DELIVERING (what gets work adopted)", "items": [{"id": "ds:65dede95", "text": "Start from the decision: answer first, then evidence; one message per slide/chart", "sub": "", "kind": "skill"}, {"id": "ds:41039930", "text": "Explain models to non-technical people with examples and counterfactuals, not formulas", "sub": "", "kind": "skill"}, {"id": "ds:f0643f6c", "text": "Communicate uncertainty and limitations honestly; say what would change my mind", "sub": "", "kind": "skill"}, {"id": "ds:0ce17c13", "text": "Write: project briefs, analysis memos, experiment reports, model cards, README/handover docs", "sub": "", "kind": "skill"}, {"id": "ds:cc7a7b56", "text": "Stakeholder management: clarify the ask, manage expectations, negotiate scope, say \"not yet, here's what we need\"", "sub": "", "kind": "skill"}, {"id": "ds:bf2cd4c6", "text": "Work in small iterations: baseline → improve → ship → measure; avoid 3-month black-box projects", "sub": "", "kind": "skill"}, {"id": "ds:d9b13f4c", "text": "Reproducibility: version-controlled code, pinned environments, seeds, data snapshots, one-command rerun", "sub": "", "kind": "skill"}, {"id": "ds:ab41f132", "text": "Prototype to production: Streamlit/FastAPI demo, handover to ML engineering, monitoring plan", "sub": "", "kind": "skill"}, {"id": "ds:83a1e394", "text": "Ethics checklist: who could be harmed, which groups are underrepresented, what is the failure cost, is an appeal/override process in place?", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** The best analysis is wasted if no one acts on it. Senior data scientists are paid largely for judgment, clarity, and influence."]}}, {"title": "L. TOOLS CHECKLIST", "items": [], "extras": [{"sub": "", "after": 0, "html": "<p><code>pandas<\/code>, <code>polars<\/code>, <code>duckdb<\/code>, <code>numpy<\/code>, <code>scipy<\/code>, <code>statsmodels<\/code>, <code>scikit-learn<\/code>, <code>lightgbm/xgboost/catboost<\/code>, <code>matplotlib/seaborn/plotly<\/code>, <code>streamlit<\/code>, <code>DoWhy/EconML/CausalML<\/code>, <code>statsforecast/sktime/darts/prophet<\/code>, <code>implicit/LightFM<\/code>, <code>lifelines<\/code>, <code>PyMC<\/code>, <code>pandera<\/code>, <code>great_expectations<\/code>, <code>jupyter<\/code>, <code>git<\/code>, <code>SQL<\/code>. Optional: <strong>R<\/strong> (tidyverse, <code>ggplot2<\/code>) is valued in statistics-heavy, pharma, and academic roles.<\/p>"}], "notes": {}}, {"title": "M. PROJECTS (Data Science portfolio)", "items": [{"id": "ds:24b16fb2", "text": "**EDA + business recommendations** on a messy real dataset, with a written memo", "sub": "", "kind": "project"}, {"id": "ds:d46a31f0", "text": "**A/B test analysis** with sample-size planning, CUPED, and a ship/no-ship decision", "sub": "", "kind": "project"}, {"id": "ds:0a8790fd", "text": "**Churn model → retention decision**: classification + calibration + uplift/cost-based targeting", "sub": "", "kind": "project"}, {"id": "ds:350b0656", "text": "**Demand forecasting** with proper backtesting, intervals, and an inventory decision at the end", "sub": "", "kind": "project"}, {"id": "ds:817f6c8a", "text": "**Recommender system** with two-stage design and offline metrics, plus discussion of cold start", "sub": "", "kind": "project"}, {"id": "ds:a7790676", "text": "**Causal analysis** of an observational dataset (propensity/DiD) with sensitivity checks", "sub": "", "kind": "project"}, {"id": "ds:6247d706", "text": "**Credit-risk scorecard** (WoE/IV, logistic, KS/Gini, PSI) with a model card", "sub": "", "kind": "project"}, {"id": "ds:fc3718e1", "text": "**Performance-data analytics project** (my edge): response-time anomaly detection/capacity forecast on real JMeter or monitoring data", "sub": "", "kind": "project"}], "notes": {}}, {"title": "N. MASTERY TESTS", "items": [{"id": "ds:8019fb3b", "text": "Given a vague business ask, produce a one-page brief with framing, metric, baseline, risks, and plan in 30 minutes", "sub": "", "kind": "test"}, {"id": "ds:a66a1dba", "text": "Find the leakage in an unfamiliar notebook; explain how you'd fix the validation design", "sub": "", "kind": "test"}, {"id": "ds:def47660", "text": "Design an A/B test end to end (hypothesis, metrics, sample size, analysis plan, pitfalls)", "sub": "", "kind": "test"}, {"id": "ds:83507605", "text": "Explain Simpson's paradox, confounding, and selection bias with real examples", "sub": "", "kind": "test"}, {"id": "ds:bcc2ef52", "text": "Backtest a forecast against a naive baseline and honestly report when the complex model doesn't win", "sub": "", "kind": "test"}, {"id": "ds:0f11e86f", "text": "Present a result to a non-technical stakeholder in 5 minutes without formulas", "sub": "", "kind": "test"}], "notes": {}}, {"title": "O. COMMON INTERVIEW QUESTIONS (practice answering aloud)", "items": [], "extras": [{"sub": "", "after": 0, "html": "<ul><li>\"How would you measure the success of feature X?\" · \"DAU dropped 10%, what do you do?\" · \"How would you design an experiment for…?\"<\/li><li>\"How do you handle missing data / imbalanced classes / outliers?\" · \"Explain p-value to a manager\" · \"Your model's offline AUC is great but online results are flat, why?\"<\/li><li>\"How would you predict churn / demand / fraud?\" · \"What's data leakage? give an example\" · \"How do you decide between two models?\"<\/li><\/ul>"}], "notes": {}}, {"title": "P. RESOURCES", "items": [], "extras": [{"sub": "", "after": 0, "html": "<p><em>Trustworthy Online Controlled Experiments<\/em>, <em>Causal Inference for the Brave and True<\/em>, <em>The Effect<\/em>, <em>Forecasting: Principles and Practice<\/em> (Hyndman, free), <em>Practical Statistics for Data Scientists<\/em>, <em>Storytelling with Data<\/em>, <em>Designing Machine Learning Systems<\/em> (Chip Huyen), Eugene Yan's blog, Kaggle (Playground + learning notebooks), Stratascratch/DataLemur for product-analytics interviews<\/p>"}], "notes": {}}], "intro": "<p>Companion file: <code>04b_Machine_Learning.md<\/code> (algorithms, evaluation, and ML theory in depth). This file is about <strong>doing data science as a profession<\/strong>: framing problems, getting trustworthy data, finding insight, running experiments, forecasting, recommending, and turning analysis into decisions. Level to target: <strong>Expert<\/strong>. Prerequisites: <code>01<\/code> (Python, SQL), <code>02<\/code> (EDA, pandas), <code>03<\/code> (stats). Lines starting with <strong>&gt;<\/strong> are explanations: why it matters, the intuition, and the mistakes people make. Checklist lines are skills to practice.<\/p>\n<hr/>"}, {"key": "ml", "file": "04b_Machine_Learning.md", "title": "Machine Learning", "icon": "🤖", "sections": [{"title": "A. THE CORE IDEAS OF MACHINE LEARNING", "items": [{"id": "ml:85f0f389", "text": "Supervised vs unsupervised vs self-supervised vs reinforcement learning", "sub": "A1. What learning means", "kind": "skill"}, {"id": "ml:9ba4462b", "text": "**Empirical risk minimization**: choose a model family, a loss, and an optimizer", "sub": "A1. What learning means", "kind": "skill"}, {"id": "ml:1b591e7a", "text": "Parameters vs hyperparameters; model capacity/complexity", "sub": "A1. What learning means", "kind": "skill"}, {"id": "ml:f9e26fb7", "text": "Training / validation / test roles; the i.i.d. assumption and what breaks it (time, groups, drift)", "sub": "A1. What learning means", "kind": "skill"}, {"id": "ml:aa7652e8", "text": "Generalization gap; **overfitting vs underfitting**; learning curves as diagnosis", "sub": "A1. What learning means", "kind": "skill"}, {"id": "ml:544cad57", "text": "**Bias-variance tradeoff**: bias = systematic error (model too simple), variance = sensitivity to the training sample (model too flexible). Know the decomposition for squared error", "sub": "A1. What learning means", "kind": "skill"}, {"id": "ml:aa3edeac", "text": "\"No free lunch\": no algorithm is best on every problem; baselines and experiments decide", "sub": "A1. What learning means", "kind": "skill"}, {"id": "ml:d860728a", "text": "Inductive bias: every model assumes something (linear, smooth, tree-like splits)", "sub": "A1. What learning means", "kind": "skill"}, {"id": "ml:1bf3dfc7", "text": "Curse of dimensionality: distances lose meaning, data gets sparse, more features need more data", "sub": "A1. What learning means", "kind": "skill"}, {"id": "ml:62a2ee48", "text": "Likelihood, **maximum likelihood estimation (MLE)**, MAP estimation, Bayesian posterior", "sub": "A2. The probabilistic view", "kind": "skill"}, {"id": "ml:035f2fe4", "text": "Link: squared loss ↔ Gaussian noise; logistic/cross-entropy loss ↔ Bernoulli/categorical; L2 ↔ Gaussian prior; L1 ↔ Laplace prior", "sub": "A2. The probabilistic view", "kind": "skill"}, {"id": "ml:35bba7d5", "text": "**Generative vs discriminative** models (naive Bayes/GMM vs logistic regression/SVM)", "sub": "A2. The probabilistic view", "kind": "skill"}, {"id": "ml:5b62762f", "text": "Expectation-Maximization (EM) algorithm intuition", "sub": "A2. The probabilistic view", "kind": "skill"}, {"id": "ml:f6e66cd6", "text": "Information theory: entropy, cross-entropy, KL divergence, mutual information", "sub": "A2. The probabilistic view", "kind": "skill"}, {"id": "ml:5b1d87cb", "text": "Regression: MSE (penalizes big errors, sensitive to outliers), MAE (robust, median), Huber (blend), quantile/pinball (predict percentiles), log-cosh, Poisson/Gamma/Tweedie deviance for counts/skewed positives", "sub": "A3. Loss functions (know what each rewards)", "kind": "skill"}, {"id": "ml:6ee43192", "text": "Classification: log loss/cross-entropy, hinge, focal (hard examples/imbalance), ranking losses, label smoothing", "sub": "A3. Loss functions (know what each rewards)", "kind": "skill"}, {"id": "ml:763d3152", "text": "Choose loss to match the business cost; the loss you train on can differ from the metric you report, so know the mismatch", "sub": "A3. Loss functions (know what each rewards)", "kind": "skill"}], "notes": {"A1. What learning means": ["**Intuition:** A model is a function with adjustable knobs (parameters). Training means turning the knobs to make a **loss** (a measure of error) small on the data. The goal isn't low error on training data, it's low error on **new** data. Everything else in ML is about managing that gap.", "**Common mistake:** celebrating a great training score. Training performance only tells you the model can memorize."], "A2. The probabilistic view": ["**Why it matters:** Many \"different\" methods are the same idea in disguise. Least squares = maximum likelihood with Gaussian noise. Cross-entropy loss = maximum likelihood for classification. Regularization = a prior on the parameters (MAP). Seeing this unifies the field."]}}, {"title": "B. LINEAR AND KERNEL MODELS (in depth)", "items": [{"id": "ml:c42525a8", "text": "OLS: derive the normal equation; geometric view (projection); gradient descent version", "sub": "B1. Linear and logistic regression", "kind": "skill"}, {"id": "ml:d2402ffe", "text": "Assumptions and what breaks them: non-linearity, heteroscedasticity, correlated errors, multicollinearity (VIF), outliers/leverage", "sub": "B1. Linear and logistic regression", "kind": "skill"}, {"id": "ml:c36c4746", "text": "Interpreting coefficients, standardized coefficients, confidence intervals, and p-values (inference mode) vs predictive mode", "sub": "B1. Linear and logistic regression", "kind": "skill"}, {"id": "ml:50cf6e92", "text": "**Regularization**: Ridge (shrinks, handles collinearity), Lasso (sparsity/feature selection), Elastic Net; choosing λ by CV; why scaling matters", "sub": "B1. Linear and logistic regression", "kind": "skill"}, {"id": "ml:a09f602b", "text": "Logistic regression: sigmoid, log-odds, odds ratios, cross-entropy loss, decision boundary, regularization, class weights, multi-class (softmax)", "sub": "B1. Linear and logistic regression", "kind": "skill"}, {"id": "ml:634682e8", "text": "Generalized linear models: Poisson, negative binomial, Gamma, Tweedie; offsets and exposure", "sub": "B1. Linear and logistic regression", "kind": "skill"}, {"id": "ml:35143465", "text": "Polynomial and spline features; interactions; GAMs (`pygam`, EBM) as interpretable non-linear models", "sub": "B1. Linear and logistic regression", "kind": "skill"}, {"id": "ml:193a4e90", "text": "REBUILD: linear and logistic regression with gradient descent in NumPy", "sub": "B1. Linear and logistic regression", "kind": "skill"}, {"id": "ml:212b5e90", "text": "Hard vs soft margin, `C`; hinge loss; support vectors", "sub": "B2. Support vector machines and kernels", "kind": "skill"}, {"id": "ml:a26c6b98", "text": "Kernel trick: linear, polynomial, **RBF** (`gamma`); when kernel SVMs are practical (small/medium data)", "sub": "B2. Support vector machines and kernels", "kind": "skill"}, {"id": "ml:95e10680", "text": "SVR; one-class SVM for anomaly detection; scaling requirement", "sub": "B2. Support vector machines and kernels", "kind": "skill"}, {"id": "ml:49af7f1e", "text": "Kernel ridge regression, Gaussian processes as the Bayesian cousin", "sub": "B2. Support vector machines and kernels", "kind": "skill"}, {"id": "ml:35103ba0", "text": "Perceptron algorithm; why a single layer can't solve XOR; multi-layer perceptrons as stacked non-linear regressions (details in `05_Deep_Learning_and_GenAI.md`)", "sub": "B3. Perceptron and the bridge to neural networks", "kind": "skill"}], "notes": {"": ["**Why it matters:** Linear models are fast, stable, interpretable, and shockingly strong with good features. Many production systems (credit scoring, ad CTR, baselines everywhere) still use them. Understanding them makes neural nets easier too."], "B1. Linear and logistic regression": ["**Intuition:** Linear regression draws the best flat surface through the data; logistic regression squashes a linear score through a sigmoid to get a probability. The coefficients tell you how much each feature moves the (log-odds of the) outcome, holding the others fixed."], "B2. Support vector machines and kernels": ["**Intuition:** Find the boundary with the widest margin; kernels let a linear method act in a high-dimensional feature space without computing it. Less common now on big data, but the margin and kernel ideas appear everywhere."]}}, {"title": "C. TREES AND ENSEMBLES (in depth — the workhorses of tabular data)", "items": [{"id": "ml:b0d7eab0", "text": "CART: greedy splitting, impurity (Gini, entropy), variance reduction for regression, how splits are chosen", "sub": "C1. Decision trees", "kind": "skill"}, {"id": "ml:42b317f0", "text": "Depth, min samples, pruning (cost-complexity); handling categoricals and missing values (differs by library)", "sub": "C1. Decision trees", "kind": "skill"}, {"id": "ml:727a7ef9", "text": "Strengths: no scaling needed, captures interactions and non-linearity. Weakness: unstable, step-like, poor extrapolation (important for forecasting!)", "sub": "C1. Decision trees", "kind": "skill"}, {"id": "ml:d60d205f", "text": "REBUILD: a tiny tree from scratch", "sub": "C1. Decision trees", "kind": "skill"}, {"id": "ml:806f5d13", "text": "Bootstrap aggregation, out-of-bag (OOB) error as free validation", "sub": "C2. Bagging and random forests", "kind": "skill"}, {"id": "ml:f0593f57", "text": "Hyperparameters: `n_estimators`, `max_features`, `max_depth`, `min_samples_leaf`", "sub": "C2. Bagging and random forests", "kind": "skill"}, {"id": "ml:ee139df3", "text": "Feature importance pitfalls (impurity importance is biased toward high-cardinality features → use permutation importance/SHAP)", "sub": "C2. Bagging and random forests", "kind": "skill"}, {"id": "ml:66387f90", "text": "Extra Trees; random forests rarely overfit by adding trees, but can be large/slow", "sub": "C2. Bagging and random forests", "kind": "skill"}, {"id": "ml:76ea41fb", "text": "AdaBoost intuition (reweighting hard examples); **gradient boosting** as functional gradient descent; shrinkage (learning rate) vs number of trees tradeoff", "sub": "C3. Boosting and gradient boosting", "kind": "skill"}, {"id": "ml:f29566cf", "text": "**XGBoost**: regularized objective, second-order gradients, histogram/exact split finding, `max_depth`, `min_child_weight`, `subsample`, `colsample_bytree`, `reg_lambda/alpha`, `scale_pos_weight`", "sub": "C3. Boosting and gradient boosting", "kind": "skill"}, {"id": "ml:7601721e", "text": "**LightGBM**: histogram + leaf-wise growth, GOSS, EFB, `num_leaves`, `min_data_in_leaf`, native categorical handling, speed on large data", "sub": "C3. Boosting and gradient boosting", "kind": "skill"}, {"id": "ml:f945fe11", "text": "**CatBoost**: ordered boosting, strong categorical handling with target statistics, symmetric trees, good defaults", "sub": "C3. Boosting and gradient boosting", "kind": "skill"}, {"id": "ml:c44208f4", "text": "Early stopping on a validation set; learning-rate/trees tradeoff; monotonic constraints; custom objectives and eval metrics", "sub": "C3. Boosting and gradient boosting", "kind": "skill"}, {"id": "ml:a046518f", "text": "Diagnostics: learning curves, SHAP, partial dependence; typical tuning order (learning rate fixed → tree complexity → sampling → regularization)", "sub": "C3. Boosting and gradient boosting", "kind": "skill"}, {"id": "ml:bcbf4eb3", "text": "Limits: extrapolation, very high-cardinality text/sparse data, need for feature engineering", "sub": "C3. Boosting and gradient boosting", "kind": "skill"}, {"id": "ml:a9a22aff", "text": "Voting/averaging, stacking with out-of-fold predictions (avoid leakage), blending; diversity of models matters more than count", "sub": "C4. Stacking, blending, and ensembling", "kind": "skill"}, {"id": "ml:270334f4", "text": "When ensembling helps (competitions, high-stakes accuracy) vs when it costs too much (latency, maintenance)", "sub": "C4. Stacking, blending, and ensembling", "kind": "skill"}], "notes": {"": ["**Why it matters:** On structured/tabular data (most business problems), gradient-boosted trees are usually the strongest and most practical models. Master them thoroughly."], "C1. Decision trees": ["**Intuition:** A tree asks a sequence of yes/no questions that split the data into purer and purer groups. Easy to explain, but a single deep tree memorizes noise (high variance)."], "C2. Bagging and random forests": ["**Intuition:** Average many noisy-but-different trees and the noise cancels (variance falls, bias stays). Randomness (bootstrap samples + random feature subsets) makes the trees different."], "C3. Boosting and gradient boosting": ["**Intuition:** Build trees sequentially; each new small tree fixes the mistakes of the ensemble so far, by fitting the **gradient of the loss** (the residual direction). Many weak learners add up to a strong one. Boosting reduces bias, so it can overfit if pushed too far; that's why learning rate and early stopping matter."]}}, {"title": "D. OTHER CLASSIC MODELS", "items": [{"id": "ml:86f5935f", "text": "**k-NN**: distance metrics, scaling, choosing k, curse of dimensionality, KD-tree/ball-tree/ANN for speed; use for baselines, anomaly detection, and recommenders", "sub": "D1. Instance-based and probabilistic", "kind": "skill"}, {"id": "ml:cd1e9249", "text": "**Naive Bayes** (Gaussian, Multinomial, Bernoulli): the independence assumption, why it still works for text; smoothing", "sub": "D1. Instance-based and probabilistic", "kind": "skill"}, {"id": "ml:b1df1a67", "text": "**Gaussian Mixture Models** and the EM algorithm; soft clustering; model selection with BIC/AIC", "sub": "D1. Instance-based and probabilistic", "kind": "skill"}, {"id": "ml:885b19f1", "text": "**Hidden Markov Models** (forward-backward, Viterbi) — awareness; Kalman filters for state estimation — awareness", "sub": "D1. Instance-based and probabilistic", "kind": "skill"}, {"id": "ml:a6279977", "text": "**Gaussian processes**: uncertainty-aware regression, kernels, Bayesian optimization foundation", "sub": "D1. Instance-based and probabilistic", "kind": "skill"}, {"id": "ml:f2a6f49f", "text": "Bayesian networks / probabilistic graphical models — awareness; **Bayesian regression and PyMC** for uncertainty-first modelling", "sub": "D1. Instance-based and probabilistic", "kind": "skill"}, {"id": "ml:4d2291ef", "text": "MLPs with embeddings for categoricals, TabNet, FT-Transformer; why GBMs often still win on tabular data; when NNs help (huge data, multimodal inputs, embeddings, multi-task)", "sub": "D2. Neural networks for tabular data", "kind": "skill"}, {"id": "ml:54babaed", "text": "AutoML tools as baselines: `AutoGluon`, `FLAML`, `H2O`, `auto-sklearn`", "sub": "D2. Neural networks for tabular data", "kind": "skill"}], "notes": {}}, {"title": "E. UNSUPERVISED LEARNING (in depth)", "items": [{"id": "ml:8eac1c0f", "text": "**k-means**: objective, Lloyd's algorithm, k-means++, sensitivity to scale/outliers/initialization, assumes spherical equal-size clusters; choosing k (elbow, silhouette, gap statistic, **stability**, business usefulness)", "sub": "E1. Clustering", "kind": "skill"}, {"id": "ml:82d67fb1", "text": "**Hierarchical** (single/complete/average/Ward linkage, dendrograms); **DBSCAN/HDBSCAN** (density-based, arbitrary shapes, noise points); **GMM** (soft clusters); spectral clustering; mini-batch k-means for scale", "sub": "E1. Clustering", "kind": "skill"}, {"id": "ml:4634459e", "text": "Distance/similarity choices: Euclidean, cosine, Manhattan, Gower (mixed data)", "sub": "E1. Clustering", "kind": "skill"}, {"id": "ml:b7611c97", "text": "Validation: silhouette, Davies-Bouldin, Calinski-Harabasz, ARI/NMI when labels exist; **profile each cluster in business terms** and check stability across samples", "sub": "E1. Clustering", "kind": "skill"}, {"id": "ml:a28c8b77", "text": "Common mistake: treating clusters as \"real\" categories; they depend on features and scaling", "sub": "E1. Clustering", "kind": "skill"}, {"id": "ml:a2222e02", "text": "**PCA**: variance maximization, eigenvectors of covariance, SVD view, explained variance, scaling first, reconstruction error; limits (linear, sensitive to scale)", "sub": "E2. Dimensionality reduction and representation", "kind": "skill"}, {"id": "ml:d1e4f176", "text": "Truncated SVD/LSA for sparse text; NMF for parts-based topics; ICA; factor analysis", "sub": "E2. Dimensionality reduction and representation", "kind": "skill"}, {"id": "ml:1e9276c3", "text": "**t-SNE and UMAP** for visualization: perplexity/neighbors, distances between far clusters are not meaningful, not for feature engineering without care", "sub": "E2. Dimensionality reduction and representation", "kind": "skill"}, {"id": "ml:8ec278f4", "text": "Autoencoders and embeddings as learned compressed representations (see `05`)", "sub": "E2. Dimensionality reduction and representation", "kind": "skill"}, {"id": "ml:f889ea5a", "text": "Manifold learning intuition; random projections", "sub": "E2. Dimensionality reduction and representation", "kind": "skill"}, {"id": "ml:28303d80", "text": "Kernel density estimation; histogram-based density", "sub": "E3. Density, association, and topics", "kind": "skill"}, {"id": "ml:c6bdab93", "text": "Association rules (Apriori, FP-Growth; support, confidence, lift); market-basket analysis and its pitfalls (spurious rules, popularity)", "sub": "E3. Density, association, and topics", "kind": "skill"}, {"id": "ml:92a180ef", "text": "Topic modelling: LDA, BERTopic; evaluating topics (coherence + human judgment)", "sub": "E3. Density, association, and topics", "kind": "skill"}], "notes": {"": ["**Why it matters:** Most data has no labels. Unsupervised methods find structure: segments, anomalies, compact representations. They're also easy to misuse, because there is no ground truth, so interpretation and validation need care."]}}, {"title": "F. EVALUATION AND VALIDATION (deep — where most real-world ML goes wrong)", "items": [{"id": "ml:ec0e1956", "text": "Hold-out; k-fold; stratified; **group k-fold** (same user/device never in both train and validation); **time-series splits / walk-forward**; nested CV for honest tuning + evaluation; repeated CV for variance estimate", "sub": "F1. Validation design", "kind": "skill"}, {"id": "ml:f9807791", "text": "Test set discipline: touch it once, at the end. Repeated peeking turns it into a validation set", "sub": "F1. Validation design", "kind": "skill"}, {"id": "ml:cd3cf209", "text": "**Leakage taxonomy**: target leakage (feature encodes outcome), train-test contamination (preprocessing/imputation/scaling fit on all data, duplicates across splits), temporal leakage, group leakage, label leakage via IDs/timestamps. Learn to hunt each", "sub": "F1. Validation design", "kind": "skill"}, {"id": "ml:3191071c", "text": "Out-of-time validation and out-of-distribution checks; adversarial validation (can a classifier tell train from test?)", "sub": "F1. Validation design", "kind": "skill"}, {"id": "ml:8b9c870f", "text": "**Classification:** accuracy (misleading with imbalance), precision, recall, F1/Fβ, specificity, **ROC-AUC** (ranking quality, insensitive to prevalence), **PR-AUC** (better for rare positives), log loss, Brier score, MCC, Cohen's kappa; confusion matrix; top-K/precision@K when capacity is limited", "sub": "F2. Choosing and reading metrics", "kind": "skill"}, {"id": "ml:0e67e412", "text": "**Regression:** MAE, RMSE, R² (and its pitfalls), MAPE/sMAPE/WAPE, RMSLE, quantile loss, residual analysis by segment", "sub": "F2. Choosing and reading metrics", "kind": "skill"}, {"id": "ml:b710c01d", "text": "**Ranking/recommendation:** NDCG, MAP, MRR, recall@K; **clustering:** silhouette, ARI", "sub": "F2. Choosing and reading metrics", "kind": "skill"}, {"id": "ml:7aa23b6d", "text": "Threshold selection by cost: expected cost curves, precision/recall tradeoff at the operating point", "sub": "F2. Choosing and reading metrics", "kind": "skill"}, {"id": "ml:a69d2b7a", "text": "Always report **uncertainty** on metrics (bootstrap CIs, variance across folds), and compare to a baseline", "sub": "F2. Choosing and reading metrics", "kind": "skill"}, {"id": "ml:03a6d5ff", "text": "Segment-level evaluation: overall metrics hide failures on subgroups (new users, regions, rare classes)", "sub": "F2. Choosing and reading metrics", "kind": "skill"}, {"id": "ml:4c36bfe1", "text": "Reliability diagrams, expected calibration error; Platt scaling, isotonic regression, temperature scaling", "sub": "F3. Calibration and uncertainty", "kind": "skill"}, {"id": "ml:94cf2a42", "text": "Prediction intervals, quantile regression, bootstrap, **conformal prediction** (`MAPIE`) for distribution-free guarantees", "sub": "F3. Calibration and uncertainty", "kind": "skill"}, {"id": "ml:d88ca98c", "text": "Epistemic vs aleatoric uncertainty; ensembles and Bayesian methods for uncertainty", "sub": "F3. Calibration and uncertainty", "kind": "skill"}, {"id": "ml:f3ea116e", "text": "Learning curves (more data helps or not?), validation curves, residual plots, calibration plots", "sub": "F4. Error analysis and debugging models", "kind": "skill"}, {"id": "ml:cf7176a8", "text": "Slice analysis by segment, confusion analysis, hardest examples, label-noise inspection", "sub": "F4. Error analysis and debugging models", "kind": "skill"}, {"id": "ml:04388993", "text": "Sanity tests: shuffle labels (score should collapse), train on a tiny subset (should overfit), compare to a trivial baseline, check feature importance for suspicious features", "sub": "F4. Error analysis and debugging models", "kind": "skill"}, {"id": "ml:a1034e28", "text": "Distribution shift types: covariate shift, label shift, concept drift; detection and response (see `07`)", "sub": "F4. Error analysis and debugging models", "kind": "skill"}, {"id": "ml:17e6e285", "text": "Same folds for all models; paired comparisons; significance of differences (paired t-test over folds with caveats, McNemar, bootstrap); prefer simpler model when differences are within noise", "sub": "F5. Comparing models properly", "kind": "skill"}, {"id": "ml:3d3fa48c", "text": "Offline vs online: an offline win must be confirmed by an A/B test", "sub": "F5. Comparing models properly", "kind": "skill"}], "notes": {"": ["**Why it matters:** An honestly evaluated mediocre model beats a dishonestly evaluated great one. Evaluation design is the most important and most often botched step."], "F1. Validation design": ["**Rule:** your validation must mimic how the model will be used. If it will predict the future, validate on the future. If it will see new customers, split by customer."], "F3. Calibration and uncertainty": ["**Insight:** A model can rank well (high AUC) yet output probabilities that are wrong (says 80% when reality is 50%). If you use probabilities for decisions or expected-value calculations, calibration matters."], "F4. Error analysis and debugging models": ["**Method:** look at the worst mistakes by hand. Cluster them. Fix the biggest cluster first. This beats blind hyperparameter tuning almost every time."]}}, {"title": "G. OPTIMIZATION AND TUNING", "items": [{"id": "ml:e3eb0e66", "text": "Gradient descent family (batch, SGD, mini-batch); learning rate; momentum; Adam/AdamW; convergence and scaling features (details in `03` and `05`)", "sub": "", "kind": "skill"}, {"id": "ml:65121212", "text": "Regularization toolkit: L1/L2, early stopping, dropout, data augmentation, simpler model, more data, ensembling", "sub": "", "kind": "skill"}, {"id": "ml:1f7c5b03", "text": "**Hyperparameter search:** grid (small spaces), random (usually better), **Bayesian/TPE (Optuna)**, successive halving/Hyperband; define search space on sensible scales (log for learning rates); search with proper CV", "sub": "", "kind": "skill"}, {"id": "ml:a24b0d1a", "text": "Tuning order of importance (e.g. for GBMs: learning rate and trees → depth/leaves → sampling → regularization)", "sub": "", "kind": "skill"}, {"id": "ml:94a1cf3c", "text": "Budgeting: tune on a subsample first, then refit; don't over-tune on noisy validation sets", "sub": "", "kind": "skill"}, {"id": "ml:1497cc48", "text": "Reproducibility: seeds, tracked experiments (MLflow/W&B), versioned data and configs", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** Training is optimization; tuning is a search over choices that optimization can't learn. Doing both efficiently and reproducibly saves enormous time."]}}, {"title": "H. HARD DATA SITUATIONS", "items": [{"id": "ml:d40f7990", "text": "Use the right metrics (PR-AUC, recall at fixed precision); stratified splits", "sub": "H1. Imbalanced classes", "kind": "skill"}, {"id": "ml:6f0113aa", "text": "Class weights / cost-sensitive learning; threshold moving; focal loss; resampling (random under/over, SMOTE/ADASYN **only inside CV folds**); anomaly-detection framing for extreme cases", "sub": "H1. Imbalanced classes", "kind": "skill"}, {"id": "ml:d8085874", "text": "Probability calibration after resampling (resampling distorts probabilities)", "sub": "H1. Imbalanced classes", "kind": "skill"}, {"id": "ml:21efc8e0", "text": "Small data: simple/regularized models, strong baselines, cross-validation with repeats, transfer learning, data augmentation, Bayesian methods", "sub": "H2. Small data, noisy labels, high dimensions", "kind": "skill"}, {"id": "ml:6b5ae62d", "text": "Noisy labels: robust losses, label cleaning, confident learning (`cleanlab`), consensus labeling", "sub": "H2. Small data, noisy labels, high dimensions", "kind": "skill"}, {"id": "ml:43dc53c7", "text": "High-dimensional/sparse (p ≫ n): regularization, feature selection, dimensionality reduction, sparse models", "sub": "H2. Small data, noisy labels, high dimensions", "kind": "skill"}, {"id": "ml:1c0dd71c", "text": "Missingness mechanisms (MCAR/MAR/MNAR); imputation (simple, KNN, iterative/MICE), missing indicators, models that handle NaN natively (GBMs); never impute using test data", "sub": "H3. Missing data and messy features", "kind": "skill"}, {"id": "ml:c982addf", "text": "High-cardinality categoricals (target/frequency encoding, embeddings, hashing), rare categories, unseen categories at serving time", "sub": "H3. Missing data and messy features", "kind": "skill"}, {"id": "ml:4e29ffac", "text": "Mixed types (numeric + categorical + text + image) pipelines", "sub": "H3. Missing data and messy features", "kind": "skill"}, {"id": "ml:c6a86642", "text": "Detect (PSI, KS, adversarial validation), retrain schedules, recency weighting, online/incremental learning (`river`), robustness, monitoring (see `07`)", "sub": "H4. Distribution shift and non-stationarity", "kind": "skill"}], "notes": {"": ["**Insight:** Real data is rarely clean, balanced, big, and labeled. A large part of applied ML skill is knowing what to do when it isn't."]}}, {"title": "I. LEARNING WITH LESS LABELS AND OTHER PARADIGMS", "items": [{"id": "ml:6d939ddf", "text": "**Semi-supervised:** pseudo-labeling, self-training, label propagation, consistency regularization", "sub": "", "kind": "skill"}, {"id": "ml:5996e501", "text": "**Self-supervised / contrastive** learning basics (learn representations from structure in unlabeled data; foundation of modern LLMs and vision models)", "sub": "", "kind": "skill"}, {"id": "ml:ca13a937", "text": "**Transfer learning and fine-tuning** (reuse a pretrained model; usually the best option with limited data)", "sub": "", "kind": "skill"}, {"id": "ml:56fde8e3", "text": "**Active learning:** pick the most informative samples to label (uncertainty, diversity sampling) to cut labeling cost", "sub": "", "kind": "skill"}, {"id": "ml:0ca3fe1a", "text": "**Weak supervision** (programmatic labeling functions), data programming", "sub": "", "kind": "skill"}, {"id": "ml:45e45821", "text": "**Multi-task and multi-label** learning; **learning-to-rank**", "sub": "", "kind": "skill"}, {"id": "ml:7d0284d9", "text": "**Online and incremental** learning; concept-drift-aware learners (`river`)", "sub": "", "kind": "skill"}, {"id": "ml:a3460ba1", "text": "**Federated learning** and privacy-preserving ML (awareness)", "sub": "", "kind": "skill"}, {"id": "ml:fb38be5e", "text": "**Metric learning / Siamese networks** (similarity learning) — awareness", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "J. REINFORCEMENT LEARNING AND BANDITS", "items": [{"id": "ml:49352b1f", "text": "**Multi-armed bandits:** exploration vs exploitation, epsilon-greedy, UCB, **Thompson sampling**, contextual bandits (LinUCB), off-policy evaluation", "sub": "", "kind": "skill"}, {"id": "ml:1ec560b6", "text": "MDPs, rewards, policies, value functions, Bellman equations, discount factor", "sub": "", "kind": "skill"}, {"id": "ml:e00966c8", "text": "Dynamic programming (value/policy iteration), Monte Carlo, temporal-difference learning", "sub": "", "kind": "skill"}, {"id": "ml:dbf27a6d", "text": "**Q-learning, SARSA, Deep Q-Networks (DQN)**; policy gradients (REINFORCE), actor-critic (A2C), **PPO**; model-based RL (awareness)", "sub": "", "kind": "skill"}, {"id": "ml:a06632d9", "text": "Practical difficulties: sparse rewards, sample inefficiency, sim-to-real gap, reward hacking; RLHF/RLAIF as RL used in LLM alignment", "sub": "", "kind": "skill"}, {"id": "ml:b9736b9d", "text": "Libraries: `gymnasium`, `stable-baselines3`, `RLlib`; resources: Sutton & Barto (free), David Silver's lectures, Spinning Up", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** RL is about learning to act through feedback, not just predicting. For most business problems the practical entry point is **bandits** (choose between options while learning which is best), which power adaptive experiments, recommendations, and personalization. Full RL is Stage 4 (optional) unless a role needs it."]}}, {"title": "K. ANOMALY AND CHANGE DETECTION", "items": [{"id": "ml:886760ca", "text": "Statistical: z-score/robust z (median/MAD), IQR, control charts, seasonal decomposition residuals", "sub": "", "kind": "skill"}, {"id": "ml:dd192657", "text": "ML: **Isolation Forest**, Local Outlier Factor, One-Class SVM, Elliptic Envelope, **autoencoder reconstruction error**, density models, forecast-residual-based detection", "sub": "", "kind": "skill"}, {"id": "ml:e1b70629", "text": "Change-point detection (`ruptures`, CUSUM); drift detection for streams (ADWIN)", "sub": "", "kind": "skill"}, {"id": "ml:84b512c7", "text": "Evaluation without labels: injected synthetic anomalies, analyst feedback loops, precision at review capacity", "sub": "", "kind": "skill"}, {"id": "ml:d6dec2b9", "text": "Applications: fraud, intrusion, equipment failure, **system-performance monitoring (my background)**", "sub": "", "kind": "skill"}], "notes": {"": ["**Insight:** \"Anomaly\" has no single definition. Decide what you're looking for (point outliers, contextual outliers like \"high for a Monday\", collective anomalies like a slow drift), whether you have labels (almost never), and what a false alarm costs."]}}, {"title": "L. EXPLAINABILITY, FAIRNESS, ROBUSTNESS (responsible ML)", "items": [{"id": "ml:57626660", "text": "Built-in interpretability: linear models, GAMs/EBM, shallow trees, rule lists, monotonic constraints", "sub": "L1. Explainability (XAI)", "kind": "skill"}, {"id": "ml:5cf616dc", "text": "Global: permutation importance, partial dependence (PDP), ICE, ALE, surrogate models", "sub": "L1. Explainability (XAI)", "kind": "skill"}, {"id": "ml:80b1df53", "text": "Local: **SHAP** (TreeSHAP, KernelSHAP; interpret additive contributions and interactions), LIME, counterfactual explanations (\"what minimal change flips the decision?\")", "sub": "L1. Explainability (XAI)", "kind": "skill"}, {"id": "ml:caa9d516", "text": "Pitfalls: correlated features split importance, explanations describe the *model* not causality, PDP hides heterogeneity, importance ≠ effect of intervening", "sub": "L1. Explainability (XAI)", "kind": "skill"}, {"id": "ml:0387cdf0", "text": "Communicating explanations to stakeholders; model cards", "sub": "L1. Explainability (XAI)", "kind": "skill"}, {"id": "ml:c3425d75", "text": "Sources of bias (historical, sampling, measurement, label, aggregation), proxies for protected attributes", "sub": "L2. Fairness and ethics", "kind": "skill"}, {"id": "ml:b64ed0da", "text": "Metrics: demographic parity, equalized odds, equal opportunity, calibration within groups; known trade-offs and impossibility results", "sub": "L2. Fairness and ethics", "kind": "skill"}, {"id": "ml:ed32dc1f", "text": "Mitigation: pre-processing (reweighing), in-processing (constraints), post-processing (thresholds per group); trade-offs and legal context in India/EU", "sub": "L2. Fairness and ethics", "kind": "skill"}, {"id": "ml:40387fa0", "text": "Libraries: `fairlearn`, `aif360`; documentation (datasheets, model cards), impact assessment", "sub": "L2. Fairness and ethics", "kind": "skill"}, {"id": "ml:58bdd9f9", "text": "Sensitivity to input noise and shift, adversarial examples (awareness), data poisoning, model inversion/membership inference (awareness), safe fallbacks and human override", "sub": "L3. Robustness and security", "kind": "skill"}], "notes": {"": ["**Why it matters:** Explanations build trust, help debugging, and are legally required in some settings (credit decisions). Fairness and robustness protect people and the business."]}}, {"title": "M. ML ENGINEERING HYGIENE (daily habits of strong practitioners)", "items": [{"id": "ml:d83d378c", "text": "Always: baseline first → simple model → improve one thing at a time → log every experiment", "sub": "", "kind": "skill"}, {"id": "ml:bbe9edc1", "text": "**sklearn Pipelines/ColumnTransformer** so preprocessing is fit only on training folds and reused at serving time", "sub": "", "kind": "skill"}, {"id": "ml:897d8224", "text": "Reproducible runs: seeds, pinned environments, saved data snapshots, config files, experiment tracking", "sub": "", "kind": "skill"}, {"id": "ml:588f3daf", "text": "Unit tests for data and feature code; schema validation; sanity checks on predictions (ranges, distributions)", "sub": "", "kind": "skill"}, {"id": "ml:3dc1f6f5", "text": "Training-serving skew checks: identical feature code path; log serving features for comparison", "sub": "", "kind": "skill"}, {"id": "ml:2da75218", "text": "Cost awareness: training time, inference latency, memory, maintenance; prefer the simplest model that meets the requirement", "sub": "", "kind": "skill"}, {"id": "ml:c084bd67", "text": "**When not to use ML:** a rule works, data is too small/noisy, no action follows the prediction, or errors are too costly without oversight", "sub": "", "kind": "skill"}, {"id": "ml:a827974a", "text": "Technical debt in ML: entanglement (\"changing anything changes everything\"), hidden feedback loops, undeclared consumers, pipeline jungles", "sub": "", "kind": "skill"}, {"id": "ml:f121993b", "text": "Model documentation: model card, assumptions, intended use, limits, monitoring plan", "sub": "", "kind": "skill"}], "notes": {"": ["**Rule of thumb (from Google's \"Rules of ML\"):** start with a simple model and a solid pipeline; most gains come from better data and features; get the evaluation right before getting the model fancy."]}}, {"title": "N. FROM-SCRATCH IMPLEMENTATIONS (the REBUILD list — the best way to truly understand)", "items": [{"id": "ml:2426de46", "text": "Linear regression: normal equation + gradient descent", "sub": "", "kind": "skill"}, {"id": "ml:72fcc1a7", "text": "Logistic regression with gradient descent and regularization", "sub": "", "kind": "skill"}, {"id": "ml:8a3a6a8f", "text": "k-nearest neighbors", "sub": "", "kind": "skill"}, {"id": "ml:f6a79167", "text": "Naive Bayes (Gaussian or multinomial)", "sub": "", "kind": "skill"}, {"id": "ml:dac696b5", "text": "Decision tree classifier (Gini) and a small random forest", "sub": "", "kind": "skill"}, {"id": "ml:9b688dbb", "text": "Gradient boosting for regression with tiny trees", "sub": "", "kind": "skill"}, {"id": "ml:57987cdb", "text": "k-means (with k-means++ init) and a GMM via EM", "sub": "", "kind": "skill"}, {"id": "ml:e0e16ac1", "text": "PCA via eigendecomposition and via SVD", "sub": "", "kind": "skill"}, {"id": "ml:ab401a54", "text": "SVM (simplified SMO or subgradient on hinge loss)", "sub": "", "kind": "skill"}, {"id": "ml:e4bf3f64", "text": "A 2-layer neural network with backprop (bridge to `05`)", "sub": "", "kind": "skill"}, {"id": "ml:6580b353", "text": "Cross-validation splitter (k-fold, group, time-series) and common metrics (precision, recall, AUC) from scratch", "sub": "", "kind": "skill"}, {"id": "ml:9add4973", "text": "A Thompson-sampling bandit simulation", "sub": "", "kind": "skill"}], "extras": [{"sub": "", "after": 0, "html": "<p>Implement each in NumPy (no ML libraries), compare results with scikit-learn, and write 3 lines on what surprised you.<\/p>"}, {"sub": "Math ↔ algorithm map (learn the math *when* you reach the algorithm)", "after": 12, "html": "<div class=\"tablewrap\"><table class=\"data\"><thead><tr><th>Algorithm<\/th><th>Math you need right then<\/th><\/tr><\/thead><tbody><tr><td>Linear regression<\/td><td>derivatives, vectors/matrices, least squares<\/td><\/tr><tr><td>Logistic regression<\/td><td>probability, sigmoid, log-likelihood, gradient of log-loss<\/td><\/tr><tr><td>Regularization<\/td><td>norms, Lagrange/prior view, bias-variance<\/td><\/tr><tr><td>PCA<\/td><td>covariance, eigenvectors, SVD<\/td><\/tr><tr><td>Trees/boosting<\/td><td>entropy/Gini, functional gradient intuition<\/td><\/tr><tr><td>Naive Bayes, GMM<\/td><td>Bayes' rule, Gaussian, EM<\/td><\/tr><tr><td>SVM<\/td><td>margins, convex optimization, kernels<\/td><\/tr><tr><td>Neural nets<\/td><td>chain rule, matrix calculus<\/td><\/tr><tr><td>Bandits/RL<\/td><td>expectation, Bayesian updating, Markov chains<\/td><\/tr><\/tbody><\/table><\/div>"}], "notes": {}}, {"title": "O. LIBRARIES CHECKLIST", "items": [], "extras": [{"sub": "", "after": 0, "html": "<p><code>scikit-learn<\/code>, <code>xgboost<\/code>, <code>lightgbm<\/code>, <code>catboost<\/code>, <code>statsmodels<\/code>, <code>imbalanced-learn<\/code>, <code>optuna<\/code>, <code>shap<\/code>, <code>lime<\/code>, <code>interpret<\/code> (EBM), <code>category_encoders<\/code>, <code>feature-engine<\/code>, <code>MAPIE<\/code> (conformal), <code>cleanlab<\/code>, <code>fairlearn<\/code>, <code>river<\/code> (online), <code>PyMC<\/code>, <code>pygam<\/code>, <code>hdbscan<\/code>, <code>umap-learn<\/code>, <code>gymnasium/stable-baselines3<\/code>, <code>autogluon/flaml<\/code>, <code>mlflow<\/code>, <code>pandera<\/code><\/p>"}], "notes": {}}, {"title": "P. SUGGESTED STUDY PATH (aligned with README months 13-18+)", "items": [], "extras": [{"sub": "", "after": 0, "html": "<ol><li>Weeks 1-4: linear + logistic regression, loss functions, gradient descent, train/validation/test, metrics (A, B, F)<\/li><li>Weeks 5-8: trees, random forests, gradient boosting, tuning, early stopping, SHAP (C, G, L1)<\/li><li>Weeks 9-12: evaluation design, leakage, calibration, imbalance, error analysis (F, H); unsupervised (E)<\/li><li>Months 16-18: time series, anomaly detection, Kaggle practice (K, <code>04_Data_Science.md<\/code> G)<\/li><li>Months 19+: probabilistic models, semi/self-supervised, bandits/RL, fairness, then deep learning (D, I, J, L)<\/li><\/ol>"}], "notes": {}}, {"title": "Q. PROJECTS (Machine Learning portfolio)", "items": [{"id": "ml:93674c9d", "text": "**From-scratch ML library** (section N list) with tests and a comparison report vs scikit-learn", "sub": "", "kind": "project"}, {"id": "ml:75636783", "text": "**Tabular benchmark:** linear → random forest → LightGBM/XGBoost/CatBoost on one dataset with honest nested CV, calibration, SHAP, and error analysis", "sub": "", "kind": "project"}, {"id": "ml:90804c7c", "text": "**Imbalanced problem** (fraud/rare event): metrics at fixed capacity, cost-based threshold, resampling inside CV", "sub": "", "kind": "project"}, {"id": "ml:12f2010b", "text": "**Leakage case study:** take a flawed notebook, find all leaks, show how scores change when fixed", "sub": "", "kind": "project"}, {"id": "ml:cffbb356", "text": "**Unsupervised segmentation** with stability analysis and business profiles per cluster", "sub": "", "kind": "project"}, {"id": "ml:84697fda", "text": "**Anomaly detection on performance/monitoring data** (my edge), with synthetic-anomaly evaluation", "sub": "", "kind": "project"}, {"id": "ml:6b16845a", "text": "**Bandit simulation vs A/B test** showing regret and when each wins", "sub": "", "kind": "project"}, {"id": "ml:53c579bc", "text": "**Kaggle:** a Playground competition with documented experiments; later a medal target", "sub": "", "kind": "project"}], "notes": {}}, {"title": "R. MASTERY TESTS", "items": [{"id": "ml:902fe108", "text": "Derive the gradient of logistic loss; explain regularization as a prior; explain bias-variance with a plot you generated", "sub": "", "kind": "test"}, {"id": "ml:c3b2a5ae", "text": "Explain how gradient boosting works and why a lower learning rate needs more trees", "sub": "", "kind": "test"}, {"id": "ml:3495fd20", "text": "Design a leak-free validation scheme for a new problem (time, groups, duplicates) in 10 minutes", "sub": "", "kind": "test"}, {"id": "ml:39a64ea2", "text": "Show a model with high AUC but poor calibration, then fix it and explain why it matters for decisions", "sub": "", "kind": "test"}, {"id": "ml:70f4b7ec", "text": "Debug a failing model with a systematic checklist (sanity tests, learning curves, error slices)", "sub": "", "kind": "test"}, {"id": "ml:33240732", "text": "Explain k-means, PCA, and SHAP assumptions and where each misleads", "sub": "", "kind": "test"}], "notes": {}}, {"title": "S. COMMON INTERVIEW QUESTIONS (answer aloud, simply)", "items": [], "extras": [{"sub": "", "after": 0, "html": "<ul><li>Bias vs variance · L1 vs L2 · how a random forest differs from gradient boosting · why boosting overfits less/more than expected<\/li><li>How to handle imbalanced data · precision vs recall tradeoff · ROC-AUC vs PR-AUC · what is calibration<\/li><li>How to choose k in k-means · PCA assumptions · how to detect and prevent data leakage · cross-validation for time series<\/li><li>Explain SHAP · how would you debug a model that works offline but fails online<\/li><\/ul>"}], "notes": {}}, {"title": "T. RESOURCES", "items": [], "extras": [{"sub": "", "after": 0, "html": "<p>Andrew Ng's ML Specialization, <em>An Introduction to Statistical Learning (ISLP)<\/em> (free), <em>Hands-On Machine Learning<\/em> (Géron), <em>Elements of Statistical Learning<\/em> (free, advanced), <em>Pattern Recognition and Machine Learning<\/em> (Bishop), StatQuest (YouTube), scikit-learn user guide (excellent), <em>Interpretable Machine Learning<\/em> (Molnar, free), Google's <em>Rules of Machine Learning<\/em>, <em>Designing Machine Learning Systems<\/em> (Huyen), Kaggle Learn and winning-solution write-ups, Sutton &amp; Barto (RL, free)<\/p>"}], "notes": {}}], "intro": "<p>Companion file: <code>04_Data_Science.md<\/code> (problem framing, features, experiments, forecasting, recommenders, business use). This file is the <strong>engine room<\/strong>: how learning algorithms work, how to evaluate and tune them honestly, and how to debug them. Level to target: <strong>Expert<\/strong>. Prerequisites: <code>01<\/code> (Python), <code>03<\/code> (math/stats, learned just in time), <code>04_Data_Science.md<\/code> (framing, EDA). Lines starting with <strong>&gt;<\/strong> explain why it matters, the intuition, and common mistakes. Checklist lines are skills to practice. <strong>How to study this file:<\/strong> follow the learning loop (README Section 3): BUILD with scikit-learn → ASK why → learn the theory → REBUILD from scratch in NumPy → TEACH it.<\/p>\n<hr/>"}, {"key": "ai", "file": "05_Deep_Learning_and_GenAI.md", "title": "Deep Learning & GenAI", "icon": "🧠", "sections": [{"title": "A. DEEP LEARNING FUNDAMENTALS", "items": [{"id": "ai:b307dc2b", "text": "Perceptron, layers, activations (ReLU, GELU, SiLU, sigmoid, tanh, softmax) and why each exists", "sub": "A1. Neural networks (ANN/MLP)", "kind": "skill"}, {"id": "ai:f83b1bd3", "text": "Forward pass, loss functions (MSE, cross-entropy, focal, contrastive, triplet), **backpropagation by hand**", "sub": "A1. Neural networks (ANN/MLP)", "kind": "skill"}, {"id": "ai:d232a4a8", "text": "Optimizers: SGD+momentum, RMSProp, **Adam/AdamW**; learning-rate schedules (warmup, cosine, one-cycle)", "sub": "A1. Neural networks (ANN/MLP)", "kind": "skill"}, {"id": "ai:6e1bc19b", "text": "Initialization (Xavier/He), normalization (BatchNorm, LayerNorm, GroupNorm, RMSNorm)", "sub": "A1. Neural networks (ANN/MLP)", "kind": "skill"}, {"id": "ai:7c787506", "text": "Regularization: L1/L2/weight decay, dropout, early stopping, data augmentation, label smoothing, mixup/cutmix", "sub": "A1. Neural networks (ANN/MLP)", "kind": "skill"}, {"id": "ai:12a4c20b", "text": "Training problems: vanishing/exploding gradients, gradient clipping, overfitting, dead ReLUs, loss spikes, debugging checklist (overfit one batch first)", "sub": "A1. Neural networks (ANN/MLP)", "kind": "skill"}, {"id": "ai:2fe255cc", "text": "Mixed precision (fp16/bf16), gradient accumulation, checkpointing, reproducibility", "sub": "A1. Neural networks (ANN/MLP)", "kind": "skill"}, {"id": "ai:52f43b56", "text": "**Frameworks**: PyTorch (primary: tensors, autograd, `nn.Module`, `Dataset/DataLoader`, training loops, `torch.compile`), PyTorch Lightning, TensorFlow/Keras (awareness), JAX (awareness), ONNX", "sub": "A1. Neural networks (ANN/MLP)", "kind": "skill"}, {"id": "ai:76657c04", "text": "Hardware: CPU vs GPU, CUDA basics, memory management, multi-GPU (DDP, FSDP, DeepSpeed — awareness → working), Colab/Kaggle/cloud GPUs", "sub": "A1. Neural networks (ANN/MLP)", "kind": "skill"}, {"id": "ai:6c64fcde", "text": "Convolution, kernels, stride, padding, pooling, receptive field, feature maps", "sub": "A2. Convolutional Neural Networks (CNN)", "kind": "skill"}, {"id": "ai:6bb4a002", "text": "Architectures: LeNet → AlexNet → VGG → **ResNet** (skip connections) → Inception → MobileNet/EfficientNet → ConvNeXt", "sub": "A2. Convolutional Neural Networks (CNN)", "kind"

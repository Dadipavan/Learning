: "skill"}, {"id": "ai:0079e8a1", "text": "Transfer learning and fine-tuning pretrained models (`torchvision`, `timm`)", "sub": "A2. Convolutional Neural Networks (CNN)", "kind": "skill"}, {"id": "ai:a4d592b3", "text": "1D CNNs for sequences/time series; 3D CNNs for video", "sub": "A2. Convolutional Neural Networks (CNN)", "kind": "skill"}, {"id": "ai:64a01968", "text": "Sequence modeling, BPTT, vanishing gradients in RNNs", "sub": "A3. Recurrent models (RNN, LSTM, GRU)", "kind": "skill"}, {"id": "ai:12f88f2e", "text": "LSTM gates and cell state; GRU; bidirectional and stacked RNNs", "sub": "A3. Recurrent models (RNN, LSTM, GRU)", "kind": "skill"}, {"id": "ai:3c584432", "text": "Seq2seq, encoder-decoder, teacher forcing, beam search, attention (the bridge to transformers)", "sub": "A3. Recurrent models (RNN, LSTM, GRU)", "kind": "skill"}, {"id": "ai:ee2a71f6", "text": "Uses: time series, speech, older NLP; understand them to appreciate why transformers won", "sub": "A3. Recurrent models (RNN, LSTM, GRU)", "kind": "skill"}, {"id": "ai:1e108d0a", "text": "Self-attention (Q, K, V), scaled dot-product, multi-head attention, positional encodings (sinusoidal, learned, **RoPE**, ALiBi)", "sub": "A4. Transformers (the central architecture — master it)", "kind": "skill"}, {"id": "ai:dc0bcada", "text": "Encoder, decoder, encoder-decoder; residuals, layer norm, feed-forward blocks", "sub": "A4. Transformers (the central architecture — master it)", "kind": "skill"}, {"id": "ai:eca512d3", "text": "Causal masking; KV cache; attention complexity; **FlashAttention**; grouped-query attention; mixture of experts (MoE)", "sub": "A4. Transformers (the central architecture — master it)", "kind": "skill"}, {"id": "ai:5ca2ba4a", "text": "Families: BERT (encoder), GPT (decoder), T5/BART (seq2seq), ViT (vision), Whisper (speech), CLIP (multimodal)", "sub": "A4. Transformers (the central architecture — master it)", "kind": "skill"}, {"id": "ai:0f4f6988", "text": "Implement a mini-GPT from scratch (Karpathy's *Zero to Hero* / nanoGPT)", "sub": "A4. Transformers (the central architecture — master it)", "kind": "skill"}, {"id": "ai:e29a9c29", "text": "Autoencoders, VAEs, GANs, **diffusion models** (DDPM, latent diffusion, classifier-free guidance), normalizing flows (awareness)", "sub": "A5. Other architectures and ideas", "kind": "skill"}, {"id": "ai:df0c6e10", "text": "Graph neural networks (GCN, GAT, GraphSAGE) — awareness", "sub": "A5. Other architectures and ideas", "kind": "skill"}, {"id": "ai:e64ba0de", "text": "Self-supervised/contrastive learning (SimCLR, CLIP-style), knowledge distillation, pruning, quantization", "sub": "A5. Other architectures and ideas", "kind": "skill"}, {"id": "ai:fb67134a", "text": "State space models (Mamba) — awareness", "sub": "A5. Other architectures and ideas", "kind": "skill"}], "notes": {}}, {"title": "B. COMPUTER VISION AND IMAGE PROCESSING", "items": [{"id": "ai:61b806cb", "text": "Image representation (pixels, channels, color spaces RGB/HSV/Lab), resizing, cropping, rotation", "sub": "B1. Classical image processing (OpenCV, scikit-image, PIL)", "kind": "skill"}, {"id": "ai:f9cab980", "text": "Filtering: blur (Gaussian, median), sharpening, convolution kernels", "sub": "B1. Classical image processing (OpenCV, scikit-image, PIL)", "kind": "skill"}, {"id": "ai:e5078bb7", "text": "Edge detection (Sobel, Canny), morphological operations, thresholding (Otsu, adaptive), histogram equalization", "sub": "B1. Classical image processing (OpenCV, scikit-image, PIL)", "kind": "skill"}, {"id": "ai:63d75a7a", "text": "Feature detection: Harris corners, SIFT/ORB, feature matching; homography, image stitching", "sub": "B1. Classical image processing (OpenCV, scikit-image, PIL)", "kind": "skill"}, {"id": "ai:28f9ad15", "text": "Contours, shape analysis, Hough transforms; Fourier transform basics", "sub": "B1. Classical image processing (OpenCV, scikit-image, PIL)", "kind": "skill"}, {"id": "ai:7049d265", "text": "Image classification; transfer learning", "sub": "B2. Deep-learning vision tasks", "kind": "skill"}, {"id": "ai:9002606d", "text": "**Object detection**: R-CNN family, **YOLO** (v8+), SSD, DETR; metrics (IoU, mAP)", "sub": "B2. Deep-learning vision tasks", "kind": "skill"}, {"id": "ai:25f840fd", "text": "**Segmentation**: semantic (U-Net, DeepLab), instance (Mask R-CNN), panoptic, **SAM** (Segment Anything)", "sub": "B2. Deep-learning vision tasks", "kind": "skill"}, {"id": "ai:b0228f19", "text": "Pose estimation, OCR (Tesseract, EasyOCR, TrOCR, PaddleOCR), face detection/recognition (ethics and legality!)", "sub": "B2. Deep-learning vision tasks", "kind": "skill"}, {"id": "ai:9558d516", "text": "Tracking, video understanding, depth estimation, 3D vision (awareness)", "sub": "B2. Deep-learning vision tasks", "kind": "skill"}, {"id": "ai:7eb0e366", "text": "Vision transformers (ViT, DeiT, Swin), self-supervised vision (DINOv2), multimodal (CLIP, LLaVA, vision-language models)", "sub": "B2. Deep-learning vision tasks", "kind": "skill"}, {"id": "ai:c8197914", "text": "Image generation: GANs, **Stable Diffusion**, ControlNet, LoRA for images", "sub": "B2. Deep-learning vision tasks", "kind": "skill"}, {"id": "ai:f622d0d0", "text": "Data: annotation tools (CVAT, Label Studio), augmentation (`albumentations`), dataset curation", "sub": "B2. Deep-learning vision tasks", "kind": "skill"}, {"id": "ai:d13fac5f", "text": "Deployment: ONNX, TensorRT, OpenVINO, mobile/edge (TFLite, CoreML), real-time inference constraints", "sub": "B2. Deep-learning vision tasks", "kind": "skill"}], "notes": {}}, {"title": "C. NATURAL LANGUAGE PROCESSING (NLP)", "items": [{"id": "ai:36e9fee6", "text": "Text cleaning, tokenization, stemming/lemmatization, stop words, regex, n-grams", "sub": "C1. Classical NLP", "kind": "skill"}, {"id": "ai:7f2fe7ee", "text": "Bag-of-words, **TF-IDF**, cosine similarity, BM25 (important for search/RAG)", "sub": "C1. Classical NLP", "kind": "skill"}, {"id": "ai:f26302d9", "text": "Word embeddings: Word2Vec, GloVe, FastText; limitations (no context)", "sub": "C1. Classical NLP", "kind": "skill"}, {"id": "ai:753cce3d", "text": "Classic tasks: text classification, sentiment analysis, NER, POS tagging, topic modeling (LDA, BERTopic), keyword extraction, summarization, machine translation, spell correction", "sub": "C1. Classical NLP", "kind": "skill"}, {"id": "ai:f74bd1df", "text": "Libraries: `NLTK`, `spaCy`, `gensim`, `scikit-learn`, `TextBlob`, `RapidFuzz`", "sub": "C1. Classical NLP", "kind": "skill"}, {"id": "ai:3a02f02b", "text": "Subword tokenization: BPE, WordPiece, SentencePiece, tokenizer pitfalls", "sub": "C2. Modern NLP", "kind": "skill"}, {"id": "ai:941496ce", "text": "Contextual embeddings; **BERT** and variants (RoBERTa, DistilBERT, DeBERTa); sentence-transformers (SBERT)", "sub": "C2. Modern NLP", "kind": "skill"}, {"id": "ai:1d5591cb", "text": "Fine-tuning for classification, NER, QA; **Hugging Face** `transformers`, `datasets`, `tokenizers`, `evaluate`, `peft`, `trl`, `accelerate`", "sub": "C2. Modern NLP", "kind": "skill"}, {"id": "ai:835b5a65", "text": "Evaluation: accuracy/F1, BLEU, ROUGE, BERTScore, perplexity, human evaluation", "sub": "C2. Modern NLP", "kind": "skill"}, {"id": "ai:fe428a6e", "text": "Multilingual NLP — especially **Indian languages** (Hindi, Tamil, Telugu, etc.): IndicBERT, IndicTrans, AI4Bharat resources (a real career edge in India)", "sub": "C2. Modern NLP", "kind": "skill"}, {"id": "ai:01d7dc90", "text": "Speech: ASR (Whisper), TTS, speaker diarization", "sub": "C2. Modern NLP", "kind": "skill"}], "notes": {}}, {"title": "D. LARGE LANGUAGE MODELS (LLMs) AND GENERATIVE AI", "items": [{"id": "ai:1fb3830d", "text": "Pretraining (next-token prediction), scaling laws, data curation, tokenization, context windows", "sub": "D1. How LLMs work", "kind": "skill"}, {"id": "ai:4bda8e9e", "text": "Post-training: **SFT, RLHF, DPO**, constitutional/AI feedback, reasoning models (chain-of-thought, test-time compute)", "sub": "D1. How LLMs work", "kind": "skill"}, {"id": "ai:1a22c648", "text": "Inference: sampling (temperature, top-p, top-k), decoding, KV cache, quantization (int8/int4, GPTQ, AWQ, GGUF), batching, speculative decoding", "sub": "D1. How LLMs work", "kind": "skill"}, {"id": "ai:9b54734d", "text": "Limitations: hallucination, bias, prompt injection, stale knowledge, context length, cost/latency tradeoffs", "sub": "D1. How LLMs work", "kind": "skill"}, {"id": "ai:776419d4", "text": "Model landscape: frontier closed models (Claude, GPT, Gemini) vs open-weight (Llama, Mistral, Qwen, DeepSeek, Gemma); picking models by task/cost/privacy", "sub": "D1. How LLMs work", "kind": "skill"}, {"id": "ai:ccea9eb4", "text": "Clear instructions, role/system prompts, few-shot examples, structured output (JSON schema, XML tags), delimiters", "sub": "D2. Prompt engineering", "kind": "skill"}, {"id": "ai:8672d4b6", "text": "Reasoning techniques: chain-of-thought, self-consistency, decomposition, ReAct, reflection", "sub": "D2. Prompt engineering", "kind": "skill"}, {"id": "ai:d040f902", "text": "Prompt iteration with an evaluation set (never by feel alone); prompt versioning", "sub": "D2. Prompt engineering", "kind": "skill"}, {"id": "ai:89ada565", "text": "Safety: prompt injection defenses, input/output validation", "sub": "D2. Prompt engineering", "kind": "skill"}, {"id": "ai:5cfb732b", "text": "Context engineering: what goes in the window, ordering, compression, caching", "sub": "D2. Prompt engineering", "kind": "skill"}, {"id": "ai:27ddf997", "text": "Text/image/multimodal embeddings, embedding models (OpenAI, Cohere, BGE, E5, Voyage, sentence-transformers), dimensions, similarity metrics (cosine, dot, L2)", "sub": "D3. Embeddings and vector databases", "kind": "skill"}, {"id": "ai:5143847f", "text": "ANN indexes: HNSW, IVF, PQ, flat; recall vs latency tradeoffs", "sub": "D3. Embeddings and vector databases", "kind": "skill"}, {"id": "ai:18e0f8dc", "text": "Vector stores: `FAISS`, `Chroma`, `Qdrant`, `Weaviate`, `Milvus`, `pgvector`, `Pinecone`, Elasticsearch/OpenSearch", "sub": "D3. Embeddings and vector databases", "kind": "skill"}, {"id": "ai:6212bf8d", "text": "Hybrid search (BM25 + vectors), metadata filtering, reranking (cross-encoders, Cohere Rerank)", "sub": "D3. Embeddings and vector databases", "kind": "skill"}, {"id": "ai:9e105420", "text": "Pipeline: ingestion → parsing (PDF/HTML/tables/OCR) → **chunking** (size, overlap, semantic, structure-aware) → embedding → indexing → retrieval → reranking → prompt assembly → generation → citations", "sub": "D4. Retrieval-Augmented Generation (RAG)", "kind": "skill"}, {"id": "ai:a871bde1", "text": "Advanced: query rewriting/expansion, HyDE, multi-query, parent-document retrieval, contextual retrieval, GraphRAG, agentic RAG, multi-hop", "sub": "D4. Retrieval-Augmented Generation (RAG)", "kind": "skill"}, {"id": "ai:90f302df", "text": "Evaluation: retrieval metrics (recall@k, MRR, nDCG), generation metrics (faithfulness/groundedness, answer relevance, context precision/recall) — `RAGAS`, `TruLens`, `DeepEval`, custom LLM-judges", "sub": "D4. Retrieval-Augmented Generation (RAG)", "kind": "skill"}, {"id": "ai:d5c00311", "text": "Failure modes: bad chunking, missing context, conflicting sources, stale data; permissions-aware retrieval", "sub": "D4. Retrieval-Augmented Generation (RAG)", "kind": "skill"}, {"id": "ai:d8fb1d75", "text": "Frameworks: `LangChain`, `LlamaIndex`, `Haystack`, or plain Python (prefer simple code you understand)", "sub": "D4. Retrieval-Augmented Generation (RAG)", "kind": "skill"}, {"id": "ai:52cc2dfa", "text": "When to fine-tune vs prompt vs RAG (decision framework)", "sub": "D5. Fine-tuning", "kind": "skill"}, {"id": "ai:9aa06e66", "text": "Full fine-tuning vs **PEFT**: LoRA, **QLoRA**, adapters, prefix tuning; hyperparameters (rank, alpha, target modules)", "sub": "D5. Fine-tuning", "kind": "skill"}, {"id": "ai:cae3209a", "text": "Data prep: instruction formats, quality over quantity, deduplication, synthetic data", "sub": "D5. Fine-tuning", "kind": "skill"}, {"id": "ai:77d98c97", "text": "Alignment: SFT, DPO, ORPO, GRPO (awareness), reward models", "sub": "D5. Fine-tuning", "kind": "skill"}, {"id": "ai:c54d9e46", "text": "Tooling: Hugging Face `peft/trl/transformers`, `Unsloth`, `Axolotl`, `torchtune`; evaluation before/after; merging adapters; serving (`vLLM`, `TGI`, `Ollama`, `llama.cpp`)", "sub": "D5. Fine-tuning", "kind": "skill"}, {"id": "ai:cc0c51d9", "text": "Compute planning: GPU memory math, quantization, cloud GPU options", "sub": "D5. Fine-tuning", "kind": "skill"}, {"id": "ai:8b921c8a", "text": "Agent loop: observe → reason → act (tools) → observe; stopping conditions", "sub": "D6. AI agents and agentic AI", "kind": "skill"}, {"id": "ai:e6c4d09f", "text": "**Tool/function calling**: schemas, validation, error handling, parallel calls", "sub": "D6. AI agents and agentic AI", "kind": "skill"}, {"id": "ai:d2176f66", "text": "Patterns: ReAct, plan-and-execute, reflection/critique, routing, orchestrator-worker, evaluator-optimizer, multi-agent collaboration", "sub": "D6. AI agents and agentic AI", "kind": "skill"}, {"id": "ai:6626b11c", "text": "Memory: short-term (context), long-term (vector/DB), summaries, working memory", "sub": "D6. AI agents and agentic AI", "kind": "skill"}, {"id": "ai:bd37bc1c", "text": "**MCP (Model Context Protocol)** for connecting tools/data; computer use/browser agents; code-execution sandboxes", "sub": "D6. AI agents and agentic AI", "kind": "skill"}, {"id": "ai:c74f7d17", "text": "Frameworks: Claude Agent SDK, LangGraph, OpenAI Agents SDK, CrewAI, AutoGen — or custom loops", "sub": "D6. AI agents and agentic AI", "kind": "skill"}, {"id": "ai:2f7e66c8", "text": "Reliability: determinism where possible, retries, timeouts, cost/latency budgets, human-in-the-loop approval for risky actions", "sub": "D6. AI agents and agentic AI", "kind": "skill"}, {"id": "ai:f60696da", "text": "Evaluation of agents: task success rate, trajectory evaluation, regression test suites, sandboxed environments", "sub": "D6. AI agents and agentic AI", "kind": "skill"}, {"id": "ai:04285214", "text": "Security: prompt injection through tools, permission scoping/least privilege, secrets, audit logs", "sub": "D6. AI agents and agentic AI", "kind": "skill"}, {"id": "ai:6a36a028", "text": "Build **eval sets** from real use cases; offline metrics + human review + online monitoring", "sub": "D7. LLM evaluation, safety and guardrails", "kind": "skill"}, {"id": "ai:57e5e7a5", "text": "LLM-as-judge (with calibration against human labels), pairwise comparisons, rubric design, bias in judges", "sub": "D7. LLM evaluation, safety and guardrails", "kind": "skill"}, {"id": "ai:19f01058", "text": "Benchmarks (MMLU, GSM8K, HumanEval, SWE-bench, etc.) — and why they don't replace task-specific evals", "sub": "D7. LLM evaluation, safety and guardrails", "kind": "skill"}, {"id": "ai:6b198a38", "text": "Guardrails: input/output filtering, PII redaction, topic restrictions, schema validation, moderation APIs, `NeMo Guardrails`, `Guardrails AI`", "sub": "D7. LLM evaluation, safety and guardrails", "kind": "skill"}, {"id": "ai:3984e13a", "text": "Red-teaming: jailbreaks, prompt injection, data exfiltration, toxicity, bias testing", "sub": "D7. LLM evaluation, safety and guardrails", "kind": "skill"}, {"id": "ai:47801ee0", "text": "Observability: tracing (`LangSmith`, `Langfuse`, `Arize Phoenix`, `OpenTelemetry`), logging prompts/outputs/costs/latency, feedback loops", "sub": "D7. LLM evaluation, safety and guardrails", "kind": "skill"}, {"id": "ai:c7770667", "text": "Cost and performance engineering: caching, batching, smaller models for easy tasks, routing, prompt caching, streaming", "sub": "D7. LLM evaluation, safety and guardrails", "kind": "skill"}, {"id": "ai:6b546d03", "text": "Responsible AI: privacy, fairness, transparency, copyright/licensing awareness, regulations (EU AI Act, India's DPDP Act)", "sub": "D7. LLM evaluation, safety and guardrails", "kind": "skill"}, {"id": "ai:6ee59d5e", "text": "Vision-language models, document understanding (OCR-free), speech-to-text/text-to-speech, image/video generation, structured extraction from documents", "sub": "D8. Multimodal and generative media", "kind": "skill"}, {"id": "ai:832f272d", "text": "Applications: document processing, copilots, search, customer support, code assistants, analytics assistants (text-to-SQL)", "sub": "D8. Multimodal and generative media", "kind": "skill"}], "notes": {}}, {"title": "E. LEARNING SEQUENCE", "items": [], "extras": [{"sub": "", "after": 0, "html": "<div class=\"tablewrap\"><table class=\"data\"><thead><tr><th>Months<\/th><th>Topic<\/th><th>Resource<\/th><\/tr><\/thead><tbody><tr><td>19-20<\/td><td>NN fundamentals, backprop from scratch, PyTorch<\/td><td>Karpathy <em>Zero to Hero<\/em>; <em>Dive into Deep Learning<\/em> (free); fast.ai<\/td><\/tr><tr><td>21<\/td><td>CNNs, transfer learning, CV project<\/td><td>fast.ai, CS231n (Stanford, free)<\/td><\/tr><tr><td>22<\/td><td>RNN/LSTM, sequence modeling, attention<\/td><td>CS224n (Stanford, free)<\/td><\/tr><tr><td>23-24<\/td><td>Transformers from scratch, Hugging Face, fine-tune BERT<\/td><td>HF course, nanoGPT<\/td><\/tr><tr><td>25-26<\/td><td>Prompting, embeddings, vector DBs, RAG with proper evals<\/td><td>DeepLearning.AI short courses; LLM Zoomcamp<\/td><\/tr><tr><td>27-28<\/td><td>Agents, tool use, MCP, orchestration<\/td><td>Provider docs; Anthropic and OpenAI cookbooks<\/td><\/tr><tr><td>29-30<\/td><td>Fine-tuning (LoRA/QLoRA), serving, guardrails, observability<\/td><td>HF <code>peft/trl<\/code>, vLLM docs<\/td><\/tr><tr><td>31+<\/td><td>Paper reading, advanced topics, specialization<\/td><td>arXiv, Papers with Code<\/td><\/tr><\/tbody><\/table><\/div>"}], "notes": {}}, {"title": "F. PROJECTS", "items": [{"id": "ai:2fb2e856", "text": "Neural net + backprop from scratch in NumPy; then the same in PyTorch", "sub": "", "kind": "project"}, {"id": "ai:6aec178f", "text": "Image classifier using transfer learning; deploy as a web demo", "sub": "", "kind": "project"}, {"id": "ai:14b2e0b6", "text": "Object detection with YOLO on a custom dataset", "sub": "", "kind": "project"}, {"id": "ai:b5c2a05a", "text": "Text classifier by fine-tuning BERT; compare with TF-IDF baseline", "sub": "", "kind": "project"}, {"id": "ai:5cfc19a8", "text": "Mini-GPT trained on a small corpus", "sub": "", "kind": "project"}, {"id": "ai:f2908177", "text": "**RAG assistant** with evaluation harness (retrieval + faithfulness metrics), citations, and a failure analysis", "sub": "", "kind": "project"}, {"id": "ai:5203167b", "text": "**Text-to-SQL analytics assistant** over a real database with guardrails", "sub": "", "kind": "project"}, {"id": "ai:b44872c1", "text": "**Agent** that automates a real workflow from work (e.g. analyzing performance test reports and writing findings), with tracing and evals", "sub": "", "kind": "project"}, {"id": "ai:ce0477f4", "text": "Fine-tune a small open model with QLoRA; compare vs prompting", "sub": "", "kind": "project"}, {"id": "ai:730bac88", "text": "Multilingual project with Indian-language data", "sub": "", "kind": "project"}], "notes": {}}, {"title": "G. MASTERY TESTS", "items": [{"id": "ai:3d798ee3", "text": "Derive and code self-attention from scratch; explain every tensor shape", "sub": "", "kind": "test"}, {"id": "ai:ba6ec263", "text": "Debug a training run that doesn't converge in a systematic way", "sub": "", "kind": "test"}, {"id": "ai:85efded8", "text": "Show a RAG system with measured improvement from each change (chunking, reranking, etc.)", "sub": "", "kind": "test"}, {"id": "ai:e1647fce", "text": "Build an agent with eval suite showing task success rate and cost per task", "sub": "", "kind": "test"}, {"id": "ai:e39de06b", "text": "Read a recent paper and reproduce a key result at small scale", "sub": "", "kind": "test"}], "notes": {}}, {"title": "H. RESOURCES", "items": [], "extras": [{"sub": "", "after": 0, "html": "<p>Karpathy <em>Zero to Hero<\/em>, fast.ai, <em>Dive into Deep Learning<\/em>, Stanford CS231n / CS224n / CS336, DeepLearning.AI specializations and short courses, Hugging Face courses, <em>Hands-On LLMs<\/em>, Sebastian Raschka's <em>Build a LLM from Scratch<\/em>, LLM Zoomcamp, Anthropic and OpenAI cookbooks and docs, arXiv + Papers with Code, Lilian Weng's blog<\/p>"}], "notes": {}}], "intro": "<p>Role: AI Engineer / ML Engineer (modeling side) / Applied Scientist. Level to target: <strong>Advanced → Expert<\/strong> (Generative AI/LLMs). Prerequisites: <code>01<\/code>, <code>03<\/code> (linear algebra, calculus, probability), <code>04<\/code> (ML basics).<\/p>\n<hr/>"}, {"key": "de", "file": "06_Data_Engineering_and_Big_Data.md", "title": "Data Engineering", "icon": "🏗️", "sections": [{"title": "A. CORE CONCEPTS", "items": [{"id": "de:f05d93b2", "text": "Data lifecycle: generation → ingestion → storage → transformation → serving → governance (the \"data engineering lifecycle\")", "sub": "", "kind": "skill"}, {"id": "de:57dfdb83", "text": "OLTP vs OLAP; row vs columnar storage; batch vs micro-batch vs streaming", "sub": "", "kind": "skill"}, {"id": "de:025a1f4c", "text": "ETL vs ELT; why ELT won (cheap storage + warehouse compute)", "sub": "", "kind": "skill"}, {"id": "de:db56d2e1", "text": "Data architecture styles: warehouse, data lake, **lakehouse**, data mesh, lambda vs kappa architecture, medallion (bronze/silver/gold)", "sub": "", "kind": "skill"}, {"id": "de:54172594", "text": "Data contracts, schemas, schema evolution, idempotency, exactly-once vs at-least-once, backfills, late-arriving data, CDC", "sub": "", "kind": "skill"}, {"id": "de:1ee9194b", "text": "Reliability concepts: SLAs/SLOs/SLIs, retries, dead-letter queues, alerting, observability, cost management (FinOps)", "sub": "", "kind": "skill"}, {"id": "de:97dec7cc", "text": "CAP theorem, consistency models, partitioning, replication, sharding, consensus basics (distributed systems fundamentals)", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "B. DATA MODELING AND WAREHOUSING", "items": [{"id": "de:fc6861df", "text": "Dimensional modeling (Kimball): facts (transaction, periodic snapshot, accumulating), dimensions, grain, conformed dimensions, bus matrix", "sub": "", "kind": "skill"}, {"id": "de:7a51b8ff", "text": "Star vs snowflake; **slowly changing dimensions** (Types 1, 2, 3, 6); surrogate keys; junk/degenerate dimensions", "sub": "", "kind": "skill"}, {"id": "de:e994eb2f", "text": "Inmon (3NF warehouse) and **Data Vault** (hubs, links, satellites) — awareness → working", "sub": "", "kind": "skill"}, {"id": "de:8a179fe6", "text": "One Big Table (OBT) tradeoffs; wide vs narrow tables", "sub": "", "kind": "skill"}, {"id": "de:f924bcde", "text": "Normalization/denormalization; partitioning, clustering, and sort keys for performance", "sub": "", "kind": "skill"}, {"id": "de:1530c984", "text": "Warehouses: **Snowflake** (virtual warehouses, micro-partitions, time travel, streams/tasks, Snowpark), **BigQuery** (slots, partitioning/clustering, nested/repeated fields), **Redshift**, **Azure Synapse/Fabric**, **Databricks SQL**", "sub": "", "kind": "skill"}, {"id": "de:dd66fe2d", "text": "Query performance tuning, cost control (scan pruning, materialized views, caching)", "sub": "", "kind": "skill"}, {"id": "de:57871d65", "text": "Semantic layers/metrics layers", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "C. FILE FORMATS, LAKES AND LAKEHOUSES", "items": [{"id": "de:049fd693", "text": "Formats: CSV/JSON (pitfalls), **Parquet** (columnar, row groups, predicate pushdown), ORC, **Avro** (row, schema registry), Arrow", "sub": "", "kind": "skill"}, {"id": "de:b449e5c4", "text": "Compression (snappy, zstd, gzip), partitioning strategies (Hive-style), small-file problem, compaction", "sub": "", "kind": "skill"}, {"id": "de:40e83ffa", "text": "Object storage: S3, ADLS, GCS — layout, lifecycle policies, permissions", "sub": "", "kind": "skill"}, {"id": "de:0f30d101", "text": "**Table formats**: Delta Lake, Apache Iceberg, Apache Hudi — ACID on lakes, time travel, schema evolution, upserts/merge, compaction, catalog (Hive Metastore, Unity, Glue, Nessie)", "sub": "", "kind": "skill"}, {"id": "de:1a508aec", "text": "Query engines: Trino/Presto, Athena, Spark SQL, **DuckDB** (great for learning), ClickHouse (OLAP), Druid/Pinot (real-time OLAP)", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "D. ETL/ELT AND TRANSFORMATION", "items": [{"id": "de:39c25ef4", "text": "Ingestion patterns: full load, incremental (watermark), CDC (Debezium), API pagination/rate limits, file drops, webhooks, change feeds", "sub": "", "kind": "skill"}, {"id": "de:9add456b", "text": "Tools: Airbyte, Fivetran (managed), Meltano, Singer, custom Python; Azure Data Factory, AWS Glue", "sub": "", "kind": "skill"}, {"id": "de:c67c8c70", "text": "Data quality: constraints, tests, anomaly checks, freshness/volume/schema checks — `Great Expectations`, `Soda`, `pandera`, dbt tests; data observability (Monte Carlo concepts)", "sub": "", "kind": "skill"}, {"id": "de:6830072d", "text": "**dbt**: models, sources, ref(), materializations (view/table/incremental/ephemeral), tests, snapshots (SCD2), seeds, macros (Jinja), packages, docs/lineage, exposures, CI with slim builds, dbt-core vs dbt Cloud, semantic layer", "sub": "", "kind": "skill"}, {"id": "de:53f6ac46", "text": "SQL-first transformation: modular CTE style, layered models (staging → intermediate → marts)", "sub": "", "kind": "skill"}, {"id": "de:7cd2e710", "text": "Python transformation: pandas/Polars/DuckDB for small-mid data; Spark for large data", "sub": "", "kind": "skill"}, {"id": "de:757ba56d", "text": "Idempotent, re-runnable, testable pipelines; unit testing transformations", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "E. ORCHESTRATION AND WORKFLOW", "items": [{"id": "de:216df486", "text": "**Apache Airflow**: DAGs, operators, sensors, hooks, XComs, TaskFlow API, scheduling and catch-up/backfill, dynamic task mapping, pools, retries/SLAs, connections/variables, executors (Celery/Kubernetes), deployment, testing DAGs, best practices (idempotent tasks, no heavy work in scheduler)", "sub": "", "kind": "skill"}, {"id": "de:eac38a71", "text": "Alternatives: Dagster (asset-based), Prefect, Mage, Azure Data Factory, AWS Step Functions, Argo Workflows, cron for simple cases", "sub": "", "kind": "skill"}, {"id": "de:b95aa926", "text": "Event-driven triggers; dependency management between pipelines; lineage and metadata (OpenLineage, DataHub, Amundsen)", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "F. APACHE SPARK / PYSPARK (distributed computing)", "items": [{"id": "de:78945f0c", "text": "Architecture: driver, executors, cluster managers (YARN, Kubernetes, standalone), jobs → stages → tasks, DAG", "sub": "", "kind": "skill"}, {"id": "de:d901a825", "text": "APIs: RDD (understand), **DataFrame/Spark SQL** (use), Datasets; lazy evaluation, transformations vs actions", "sub": "", "kind": "skill"}, {"id": "de:1973a393", "text": "Operations: select/filter/withColumn, joins, aggregations, window functions, UDFs vs pandas UDFs vs built-ins, higher-order functions, explode/struct/array/map types", "sub": "", "kind": "skill"}, {"id": "de:df2962a3", "text": "**Performance tuning**: partitioning, shuffles, skew handling (salting, AQE), broadcast joins, caching/persist, file sizes, predicate/column pruning, `explain()`, Spark UI reading, memory configuration (executor memory, cores, `spark.sql.shuffle.partitions`)", "sub": "", "kind": "skill"}, {"id": "de:ae4bf640", "text": "I/O: Parquet/Delta/Iceberg, JDBC, cloud storage, schema inference vs explicit schemas", "sub": "", "kind": "skill"}, {"id": "de:d388465c", "text": "**Structured Streaming**: triggers, watermarks, windows, stateful operations, checkpoints, exactly-once sinks", "sub": "", "kind": "skill"}, {"id": "de:7731a0d7", "text": "Platforms: Databricks (notebooks, jobs, Delta Live Tables/Lakeflow, Unity Catalog, workflows), EMR, Dataproc, Synapse Spark, Fabric", "sub": "", "kind": "skill"}, {"id": "de:921c588c", "text": "MLlib (awareness); Spark Connect; testing PySpark code", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "G. STREAMING AND REAL-TIME", "items": [{"id": "de:50eae00d", "text": "Concepts: event time vs processing time, windows (tumbling/sliding/session), watermarks, state, ordering, exactly-once semantics, backpressure, late data", "sub": "", "kind": "skill"}, {"id": "de:0e0b524c", "text": "**Apache Kafka**: topics, partitions, offsets, consumer groups, producers (acks, idempotence), retention, compaction, replication/ISR, Schema Registry (Avro/Protobuf), Kafka Connect, Kafka Streams/ksqlDB, KRaft, monitoring (lag), security", "sub": "", "kind": "skill"}, {"id": "de:998d1e31", "text": "Alternatives/managed: Confluent Cloud, AWS Kinesis, Azure Event Hubs, Google Pub/Sub, Redpanda, Pulsar, RabbitMQ (queue vs log)", "sub": "", "kind": "skill"}, {"id": "de:47b56107", "text": "Processing engines: Spark Structured Streaming, **Apache Flink** (awareness → working), Kafka Streams", "sub": "", "kind": "skill"}, {"id": "de:8bdf9971", "text": "CDC pipelines: DB → Debezium → Kafka → lake/warehouse; real-time dashboards; feature pipelines for ML; real-time OLAP (Pinot/Druid/ClickHouse)", "sub": "", "kind": "skill"}, {"id": "de:da270011", "text": "Testing and performance of streaming systems (my JMeter/performance background is a **direct advantage**: load testing Kafka consumers, capacity planning)", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "H. INFRASTRUCTURE, DEVOPS, AND DATAOPS", "items": [{"id": "de:a5e357de", "text": "**Docker** (images, Dockerfile best practices, volumes, networks, compose), **Kubernetes** basics (pods, deployments, services, ConfigMaps/Secrets, Helm, jobs/cronjobs)", "sub": "", "kind": "skill"}, {"id": "de:8e873e8c", "text": "**Infrastructure as Code**: Terraform (providers, state, modules), CloudFormation/Bicep/Pulumi (awareness)", "sub": "", "kind": "skill"}, {"id": "de:992d7ffb", "text": "CI/CD: GitHub Actions/GitLab CI/Jenkins; test → lint → build → deploy; environments (dev/stage/prod), branching, versioned releases", "sub": "", "kind": "skill"}, {"id": "de:effcf250", "text": "Secrets management (Vault, cloud secret managers), IAM/least privilege, networking basics (VPC, subnets, security groups, private endpoints)", "sub": "", "kind": "skill"}, {"id": "de:4cffa1d2", "text": "Monitoring and alerting: Prometheus, Grafana, CloudWatch/Azure Monitor/Cloud Monitoring, logging (ELK/OpenSearch), tracing; data-pipeline-specific alerts (freshness, volume)", "sub": "", "kind": "skill"}, {"id": "de:73ecab89", "text": "Cost optimization; DataOps culture; documentation and runbooks; on-call basics", "sub": "", "kind": "skill"}, {"id": "de:f04b9ca7", "text": "Governance and security: PII handling, encryption (at rest/in transit), masking, row/column-level security, data catalogs, lineage, retention, GDPR/DPDP compliance, access reviews", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "I. PYTHON FOR DATA ENGINEERING", "items": [], "extras": [{"sub": "", "after": 0, "html": "<p><code>pandas<\/code>, <code>polars<\/code>, <code>duckdb<\/code>, <code>pyarrow<\/code>, <code>sqlalchemy<\/code>, <code>psycopg<\/code>, <code>requests/httpx<\/code>, <code>pydantic<\/code>, <code>boto3<\/code> (AWS) / <code>azure-*<\/code> SDKs / <code>google-cloud-*<\/code>, <code>pyspark<\/code>, <code>airflow<\/code>, <code>dbt-core<\/code>, <code>great_expectations<\/code>, <code>kafka-python<\/code>/<code>confluent-kafka<\/code>, <code>pytest<\/code>, <code>click/typer<\/code>, <code>tenacity<\/code> (retries), <code>structlog/logging<\/code><\/p>"}], "notes": {}}, {"title": "J. SYSTEM DESIGN FOR DATA", "items": [{"id": "de:e0df6df7", "text": "Practice designing: clickstream analytics platform, real-time fraud pipeline, CDC from OLTP to warehouse, ML feature pipeline, log analytics platform, recommendation data platform, IoT ingestion", "sub": "", "kind": "skill"}, {"id": "de:5b028961", "text": "Framework: requirements (volume, velocity, latency, freshness, consistency, SLAs, cost) → data model → ingestion → storage → processing → serving → quality/monitoring → failure modes → scaling/cost", "sub": "", "kind": "skill"}, {"id": "de:801e1f08", "text": "Capacity estimation (events/sec, GB/day, partitions needed) — **use performance-testing skills here**", "sub": "", "kind": "skill"}], "extras": [{"sub": "", "after": 3, "html": "<ul><li>Book: <em>Designing Data-Intensive Applications<\/em> (Kleppmann) — read cover to cover; <em>Fundamentals of Data Engineering<\/em> (Reis &amp; Housley); <em>The Data Warehouse Toolkit<\/em> (Kimball)<\/li><\/ul>"}], "notes": {}}, {"title": "K. CLOUD DATA SERVICES (pick one cloud first; see `07`)", "items": [], "extras": [{"sub": "", "after": 0, "html": "<div class=\"tablewrap\"><table class=\"data\"><thead><tr><th>Capability<\/th><th>AWS<\/th><th>Azure<\/th><th>GCP<\/th><\/tr><\/thead><tbody><tr><td>Object storage<\/td><td>S3<\/td><td>ADLS Gen2/Blob<\/td><td>GCS<\/td><\/tr><tr><td>Warehouse<\/td><td>Redshift<\/td><td>Synapse / Fabric<\/td><td>BigQuery<\/td><\/tr><tr><td>Serverless ETL<\/td><td>Glue<\/td><td>Data Factory<\/td><td>Dataflow / Dataform<\/td><\/tr><tr><td>Spark<\/td><td>EMR / Glue<\/td><td>Synapse / Databricks<\/td><td>Dataproc / Databricks<\/td><\/tr><tr><td>Streaming<\/td><td>Kinesis / MSK<\/td><td>Event Hubs<\/td><td>Pub/Sub<\/td><\/tr><tr><td>Orchestration<\/td><td>MWAA / Step Functions<\/td><td>ADF<\/td><td>Cloud Composer<\/td><\/tr><tr><td>Query lake<\/td><td>Athena<\/td><td>Synapse serverless<\/td><td>BigQuery external<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Certifications: AWS Data Engineer – Associate, Azure Data Engineer (DP-700 Fabric Data Engineer, or current equivalent), Google Professional Data Engineer, Databricks Data Engineer Associate/Professional, SnowPro Core.<\/p>"}], "notes": {}}, {"title": "L. LEARNING SEQUENCE", "items": [], "extras": [{"sub": "", "after": 0, "html": "<ol><li>Months 9-10: Linux/shell, data modeling, ETL concepts, Airflow, Docker, API ingestion<\/li><li>Months 11-12: One cloud + one warehouse (Snowflake or BigQuery), dbt, certification<\/li><li>Months 16-18: PySpark + Spark tuning, Delta/Iceberg basics<\/li><li>Months 31+ (or earlier on the job): Kafka/streaming, Terraform, Kubernetes, data governance<\/li><li>Ongoing: <em>Designing Data-Intensive Applications<\/em>; system design practice<\/li><\/ol>"}], "notes": {}}, {"title": "M. PROJECTS", "items": [{"id": "de:b011b5be", "text": "API → Airflow → PostgreSQL pipeline in Docker, with tests and alerts", "sub": "", "kind": "project"}, {"id": "de:b8587217", "text": "dbt project: staging → marts, tests, docs, CI (Snowflake/BigQuery/DuckDB)", "sub": "", "kind": "project"}, {"id": "de:ed7028d8", "text": "End-to-end cloud pipeline (ingest → lake → warehouse → dashboard) deployed with Terraform", "sub": "", "kind": "project"}, {"id": "de:05ac49e2", "text": "PySpark job on 10M+ rows with documented tuning (before/after Spark UI evidence)", "sub": "", "kind": "project"}, {"id": "de:41ca7275", "text": "Kafka + Debezium CDC → lakehouse (Delta/Iceberg)", "sub": "", "kind": "project"}, {"id": "de:5c469e3a", "text": "Streaming pipeline with Spark Structured Streaming/Flink and real-time dashboard", "sub": "", "kind": "project"}, {"id": "de:f37eb4ad", "text": "Data quality framework with automated checks and alerts", "sub": "", "kind": "project"}, {"id": "de:63403ba3", "text": "**Performance and capacity report of a data pipeline** — load-test it (JMeter/Locust), find bottlenecks, document improvements. This is a unique portfolio piece combining my current expertise with data engineering.", "sub": "", "kind": "project"}], "notes": {}}, {"title": "N. MASTERY TESTS", "items": [{"id": "de:7b7763ca", "text": "Design a pipeline for a described business case on a whiteboard in 45 minutes, covering failures and cost", "sub": "", "kind": "test"}, {"id": "de:e9d8873c", "text": "Fix a skewed Spark join and prove the improvement", "sub": "", "kind": "test"}, {"id": "de:cb386ba9", "text": "Explain Kafka delivery semantics, Airflow idempotency, SCD2, and Parquet internals clearly", "sub": "", "kind": "test"}, {"id": "de:5df20e96", "text": "Operate a pipeline for 3 months with documented incidents and fixes", "sub": "", "kind": "test"}], "notes": {}}], "intro": "<p>Role: build the reliable systems that collect, move, transform, store, and serve data. Level to target: <strong>Advanced → Expert<\/strong>. <strong>Best fit for my background<\/strong> (performance engineering → systems thinking). Prerequisites: <code>01<\/code> (Python, SQL, Linux, Git).<\/p>\n<hr/>"}, {"key": "mlops", "file": "07_MLOps_AI_Engineering_and_Cloud.md", "title": "MLOps & Cloud", "icon": "☁️", "sections": [{"title": "A. ML ENGINEERING FUNDAMENTALS", "items": [{"id": "mlops:e4c3cb55", "text": "ML system lifecycle: data → features → training → validation → registry → deployment → monitoring → retraining", "sub": "", "kind": "skill"}, {"id": "mlops:0bc8c585", "text": "Software engineering for ML: modular code (not notebooks), typed interfaces, configs (Hydra/YAML), unit/integration tests, code review, reproducibility", "sub": "", "kind": "skill"}, {"id": "mlops:35b78259", "text": "Project structure: cookiecutter-style layouts, separating data/features/models/serving", "sub": "", "kind": "skill"}, {"id": "mlops:a9c4b339", "text": "Technical debt in ML systems; training-serving skew; dependency hell; hidden feedback loops", "sub": "", "kind": "skill"}, {"id": "mlops:7d61b897", "text": "ML system design: requirements (latency, throughput, freshness, cost), batch vs online vs streaming inference, edge vs cloud", "sub": "", "kind": "skill"}, {"id": "mlops:ce8ace1a", "text": "Ownership of the full path: working with data engineers, data scientists, product, SRE", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "B. EXPERIMENT TRACKING, DATA & MODEL VERSIONING", "items": [{"id": "mlops:4d63ee03", "text": "**MLflow**: tracking (params, metrics, artifacts), model registry (stages/aliases), projects, model flavors, serving, autologging, deploying to cloud", "sub": "", "kind": "skill"}, {"id": "mlops:e4228c52", "text": "Alternatives: Weights & Biases, Neptune, Comet, ClearML, TensorBoard", "sub": "", "kind": "skill"}, {"id": "mlops:981de1ad", "text": "**Data versioning**: DVC, lakeFS, Delta/Iceberg time travel; dataset documentation (datasheets), model cards", "sub": "", "kind": "skill"}, {"id": "mlops:1b477638", "text": "Reproducible environments: lock files, Docker images, seeds, hardware notes", "sub": "", "kind": "skill"}, {"id": "mlops:7c52aa82", "text": "Hyperparameter search at scale: Optuna, Ray Tune, SageMaker/Vertex tuning jobs", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "C. FEATURE STORES AND DATA FOR ML", "items": [{"id": "mlops:1980f8e1", "text": "Feature store concepts: offline vs online store, point-in-time correctness, training-serving consistency, feature reuse and discovery", "sub": "", "kind": "skill"}, {"id": "mlops:4c97e12b", "text": "Tools: **Feast**, Tecton, Databricks Feature Store, SageMaker/Vertex Feature Store, Hopsworks", "sub": "", "kind": "skill"}, {"id": "mlops:6a12595f", "text": "Feature pipelines (batch + streaming), backfills, feature monitoring", "sub": "", "kind": "skill"}, {"id": "mlops:07a1331a", "text": "Data validation for ML: schema checks, drift checks, label quality; TFX Data Validation, Great Expectations, Evidently", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "D. TRAINING AT SCALE", "items": [{"id": "mlops:aeb54db5", "text": "Training pipelines (orchestrated with Airflow, Kubeflow Pipelines, Argo, Metaflow, ZenML, Dagster, Vertex Pipelines, SageMaker Pipelines)", "sub": "", "kind": "skill"}, {"id": "mlops:8e740011", "text": "Distributed training: data parallel (DDP), model parallel, FSDP, DeepSpeed, Horovod, Ray Train; multi-node basics", "sub": "", "kind": "skill"}, {"id": "mlops:95dc4470", "text": "GPU management: utilization monitoring, mixed precision, batch size tuning, spot/preemptible instances with checkpointing", "sub": "", "kind": "skill"}, {"id": "mlops:169c1f87", "text": "Efficient data loading (WebDataset, Parquet streaming, TFRecord), caching", "sub": "", "kind": "skill"}, {"id": "mlops:81472d04", "text": "Cost control: right-sizing, spot instances, early stopping, experiment budgets", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "E. MODEL DEPLOYMENT AND SERVING", "items": [{"id": "mlops:2ffe6cf6", "text": "**Serving patterns**: batch scoring, online REST/gRPC, streaming inference, embedded/edge, serverless", "sub": "", "kind": "skill"}, {"id": "mlops:719544e0", "text": "**FastAPI** model service (validation with Pydantic, async, health checks, versioned endpoints, auth, rate limiting)", "sub": "", "kind": "skill"}, {"id": "mlops:11709b29", "text": "Packaging: **Docker** (small images, multi-stage builds, non-root, GPU images), model artifacts (pickle risks → ONNX, TorchScript, SavedModel, safetensors)", "sub": "", "kind": "skill"}, {"id": "mlops:31e8f05d", "text": "Serving frameworks: BentoML, **KServe**, Seldon Core, TorchServe, **Triton Inference Server**, Ray Serve, **vLLM / TGI** (LLMs), TensorRT-LLM, SageMaker/Vertex/Azure ML endpoints", "sub": "", "kind": "skill"}, {"id": "mlops:1b4a365d", "text": "Performance: batching (dynamic), quantization, distillation, pruning, ONNX Runtime/TensorRT, caching, autoscaling, warm pools, cold-start mitigation", "sub": "", "kind": "skill"}, {"id": "mlops:ccd14e32", "text": "**Release strategies**: shadow deployment, canary, blue/green, A/B tests of models, multi-armed bandit routing, rollback plans", "sub": "", "kind": "skill"}, {"id": "mlops:b41cb258", "text": "**Load testing ML services** — latency percentiles (p50/p95/p99), throughput, saturation, GPU utilization — *my JMeter/Locust/k6 background applies directly and is rare among ML engineers*", "sub": "", "kind": "skill"}, {"id": "mlops:88f724e6", "text": "Edge/mobile: TFLite, CoreML, ONNX Runtime Mobile, WebAssembly (awareness)", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "F. CI/CD AND AUTOMATION FOR ML", "items": [{"id": "mlops:1db41a3b", "text": "CI: linting, type checks, unit tests, data tests, model tests (behavioral tests, invariance/directional tests, performance floors) on every PR", "sub": "", "kind": "skill"}, {"id": "mlops:9cfb774b", "text": "CD: automated model packaging, registry promotion gates, environment promotion (dev → staging → prod), infrastructure as code", "sub": "", "kind": "skill"}, {"id": "mlops:80b506de", "text": "Tools: GitHub Actions, GitLab CI, Jenkins, Argo CD (GitOps), CML (Continuous ML), Terraform", "sub": "", "kind": "skill"}, {"id": "mlops:69097cec", "text": "Continuous training (CT): triggers (schedule, drift, new data), automated evaluation vs champion model, human approval gates", "sub": "", "kind": "skill"}, {"id": "mlops:10ca4600", "text": "MLOps maturity levels (Google's levels 0/1/2); decide how much automation a project actually needs", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "G. MONITORING, DRIFT DETECTION, AND OBSERVABILITY", "items": [{"id": "mlops:8177eff3", "text": "**What to monitor**: system health (latency, errors, throughput, CPU/GPU/memory), data quality (nulls, ranges, schema), **data drift**, **concept drift**, prediction drift, model performance (when labels arrive), business KPIs, fairness metrics, cost", "sub": "", "kind": "skill"}, {"id": "mlops:01cc58a9", "text": "**Drift detection methods**: PSI, KL/JS divergence, KS test, chi-square, Wasserstein distance, domain-classifier approach, ADWIN/DDM (streaming drift detectors), embeddings drift for unstructured data", "sub": "", "kind": "skill"}, {"id": "mlops:2ef2f8eb", "text": "Delayed labels: proxy metrics, performance estimation techniques (CBPE/DLE), shadow evaluation", "sub": "", "kind": "skill"}, {"id": "mlops:849aa865", "text": "Tools: **Evidently AI**, WhyLabs/whylogs, NannyML, Arize, Fiddler, Prometheus + Grafana, OpenTelemetry", "sub": "", "kind": "skill"}, {"id": "mlops:e3190b11", "text": "Alerting design (thresholds, anomaly-based, alert fatigue), dashboards, runbooks, incident response, postmortems", "sub": "", "kind": "skill"}, {"id": "mlops:06a2dffc", "text": "Retraining policies; rollback; feedback loops and logging for future training data", "sub": "", "kind": "skill"}, {"id": "mlops:b784f1ab", "text": "LLM-specific monitoring: tracing, token cost, latency, quality scores, guardrail triggers, user feedback, prompt/version tracking (`Langfuse`, `LangSmith`, `Phoenix`)", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "H. CONTAINERS AND ORCHESTRATION", "items": [{"id": "mlops:45bb4d06", "text": "**Docker**: images/layers, Dockerfile best practices, compose, registries, security scanning, GPU containers (NVIDIA Container Toolkit)", "sub": "", "kind": "skill"}, {"id": "mlops:2d19ebcd", "text": "**Kubernetes**: pods, deployments, services, ingress, ConfigMaps/Secrets, resource requests/limits, HPA/VPA, node pools with GPUs, jobs/cronjobs, namespaces, RBAC, Helm/Kustomize, observability, troubleshooting (`kubectl describe/logs`)", "sub": "", "kind": "skill"}, {"id": "mlops:6badf44d", "text": "ML on K8s: **Kubeflow**, KServe, Argo Workflows, Ray on K8s, GPU scheduling, autoscaling inference (KEDA/Knative)", "sub": "", "kind": "skill"}, {"id": "mlops:3cb8de82", "text": "Service mesh/networking (awareness): Istio, Envoy", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "I. LLMOPS (operating LLM applications)", "items": [{"id": "mlops:a8e3b6ba", "text": "Prompt/version management, config-driven prompts, evaluation in CI (regression suites for prompts/agents)", "sub": "", "kind": "skill"}, {"id": "mlops:e3b53c6e", "text": "Serving: hosted APIs vs self-hosted (vLLM/TGI/Ollama), model routing, fallbacks, rate-limit handling, retries with backoff", "sub": "", "kind": "skill"}, {"id": "mlops:cceb36ee", "text": "Cost engineering: token budgets, prompt caching, batching, smaller models for easy tasks, caching semantic results", "sub": "", "kind": "skill"}, {"id": "mlops:8b15c2fc", "text": "Observability: traces for chains/agents, quality sampling with LLM-judge + human review, feedback capture", "sub": "", "kind": "skill"}, {"id": "mlops:909ab673", "text": "Security: prompt injection, data leakage, access control on retrieval, secrets, audit logging", "sub": "", "kind": "skill"}, {"id": "mlops:89e259e0", "text": "Vector DB operations: index rebuilds, embedding model upgrades (re-embedding strategy), freshness", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "J. CLOUD COMPUTING AND INFRASTRUCTURE", "items": [{"id": "mlops:bfceee83", "text": "Models: IaaS/PaaS/SaaS/FaaS; regions/availability zones; shared responsibility model", "sub": "J1. Fundamentals (cloud-agnostic)", "kind": "skill"}, {"id": "mlops:2361a33a", "text": "Compute (VMs, containers, serverless), storage (object/block/file), networking (VPC/VNet, subnets, routing, load balancers, DNS, CDN, VPN, private links), identity (IAM, roles, policies, SSO)", "sub": "J1. Fundamentals (cloud-agnostic)", "kind": "skill"}, {"id": "mlops:1048a2e5", "text": "Reliability: high availability, fault tolerance, disaster recovery (RPO/RTO), autoscaling", "sub": "J1. Fundamentals (cloud-agnostic)", "kind": "skill"}, {"id": "mlops:bb5109c6", "text": "Cost management: pricing models (on-demand/reserved/spot), budgets, tagging, FinOps basics", "sub": "J1. Fundamentals (cloud-agnostic)", "kind": "skill"}, {"id": "mlops:5f5c5aad", "text": "Security: least privilege, encryption (KMS), secrets managers, network isolation, audit logging, compliance basics, zero trust", "sub": "J1. Fundamentals (cloud-agnostic)", "kind": "skill"}, {"id": "mlops:fc12f54b", "text": "Functions (Lambda/Azure Functions/Cloud Functions), event-driven design (queues, topics, triggers), API gateways, step functions/durable workflows, cold starts, limits, cost model, when serverless is wrong", "sub": "J3. Serverless and architecture", "kind": "skill"}, {"id": "mlops:dd010db4", "text": "Architecture patterns: microservices, event sourcing/CQRS (awareness), multi-tier, data pipelines, well-architected frameworks (AWS/Azure/GCP — six pillars: operational excellence, security, reliability, performance, cost, sustainability)", "sub": "J3. Serverless and architecture", "kind": "skill"}, {"id": "mlops:5c510d1a", "text": "IAM design, policies, roles, federation; network segmentation; WAF; secrets; key management; vulnerability scanning; container image scanning; compliance (ISO 27001, SOC 2, GDPR/DPDP awareness)", "sub": "J4. Cloud security and infrastructure", "kind": "skill"}, {"id": "mlops:ea6a53dd", "text": "**Infrastructure as Code**: Terraform (HCL, state, modules, workspaces, remote state, plan/apply in CI), CloudFormation/CDK, Bicep, Pulumi", "sub": "J4. Cloud security and infrastructure", "kind": "skill"}, {"id": "mlops:42ef7d03", "text": "Observability: metrics/logs/traces, dashboards, SLO-based alerting, incident management", "sub": "J4. Cloud security and infrastructure", "kind": "skill"}], "extras": [{"sub": "J2. Pick ONE cloud first, then learn the equivalents", "after": 5, "html": "<p><strong>AWS<\/strong>: IAM, S3, EC2, VPC, Lambda, ECS/EKS, RDS/Aurora, DynamoDB, Redshift, Glue, Athena, EMR, Kinesis/MSK, SageMaker (Studio, Pipelines, Endpoints, Feature Store), Bedrock, CloudWatch, Step Functions, MWAA, CloudFormation/CDK <strong>Azure<\/strong>: Entra ID/RBAC, Blob/ADLS, VMs, VNet, Functions, AKS, Azure SQL/Cosmos DB, Synapse/Fabric, Data Factory, Databricks, Event Hubs, Azure ML, Azure OpenAI/AI Foundry, Monitor, Bicep <strong>GCP<\/strong>: IAM, GCS, Compute Engine, VPC, Cloud Functions/Run, GKE, Cloud SQL/Spanner/Bigtable, BigQuery, Dataflow, Dataproc, Pub/Sub, Composer, Vertex AI, Gemini, Cloud Monitoring, Terraform<\/p>\n<ul><li>Which first? Check job postings in my target city/company; <strong>AWS<\/strong> has the largest market share, <strong>Azure<\/strong> is strong in Indian MNCs/enterprise, <strong>GCP<\/strong> is excellent for BigQuery/ML.<\/li><\/ul>"}, {"sub": "J5. Certification path (pick what matches the chosen cloud)", "after": 10, "html": "<ul><li>Foundations: AWS Cloud Practitioner / AZ-900 / Google Cloud Digital Leader (optional)<\/li><li>Associate: AWS Solutions Architect Associate or Data Engineer Associate; Azure DP-203 successor/Fabric Data Engineer; GCP Associate Cloud Engineer<\/li><li>ML-specific: AWS Machine Learning Engineer Associate, Azure AI Engineer (AI-102), Google Professional ML Engineer<\/li><li>Also: Terraform Associate, CKA/CKAD (Kubernetes) for platform-heavy roles<\/li><\/ul>"}], "notes": {}}, {"title": "K. LEARNING SEQUENCE", "items": [], "extras": [{"sub": "", "after": 0, "html": "<ol><li>Month 11-12: one cloud fundamentals + data services (ties with <code>06<\/code>)<\/li><li>Months 28-31: Docker (already), FastAPI serving, MLflow, CI/CD for ML<\/li><li>Months 31-33: monitoring/drift, feature stores (Feast), Kubernetes basics, model release strategies<\/li><li>Months 34-36: LLMOps, distributed training awareness, cloud ML platform (SageMaker/Vertex/Azure ML), cloud ML certification<\/li><\/ol>"}], "notes": {}}, {"title": "L. PROJECTS", "items": [{"id": "mlops:4386b550", "text": "Containerized FastAPI model service with tests and CI (GitHub Actions)", "sub": "", "kind": "project"}, {"id": "mlops:81bfadbc", "text": "MLflow tracking + registry; automated promotion if the new model beats the champion", "sub": "", "kind": "project"}, {"id": "mlops:11d739a0", "text": "**Load test an ML endpoint** (Locust/JMeter): report p95 latency vs QPS, autoscaling behavior, cost per 1k predictions — *unique selling point*", "sub": "", "kind": "project"}, {"id": "mlops:a649232d", "text": "Drift monitoring dashboard (Evidently + Prometheus/Grafana) with simulated drift and an alert → retraining trigger", "sub": "", "kind": "project"}, {"id": "mlops:68eaa7ee", "text": "Full end-to-end MLOps pipeline on a cloud: data → train → register → deploy → monitor (infrastructure with Terraform)", "sub": "", "kind": "project"}, {"id": "mlops:8998422a", "text": "Kubernetes deployment (KServe or plain K8s) with autoscaling and canary release", "sub": "", "kind": "project"}, {"id": "mlops:e7717ef4", "text": "LLM app in production-like form: traces, cost dashboards, eval suite in CI, guardrails", "sub": "", "kind": "project"}], "notes": {}}, {"title": "M. MASTERY TESTS", "items": [{"id": "mlops:c6e9e663", "text": "Take a notebook model to a monitored production endpoint, from scratch, in a weekend", "sub": "", "kind": "test"}, {"id": "mlops:fe0e40a3", "text": "Explain training-serving skew, data vs concept drift, and show how to detect each with code", "sub": "", "kind": "test"}, {"id": "mlops:cacb8e0e", "text": "Show a canary rollout with automated rollback based on metrics", "sub": "", "kind": "test"}, {"id": "mlops:76cab04e", "text": "Present a cost and latency analysis of serving options (CPU vs GPU, batch vs online, self-hosted vs managed)", "sub": "", "kind": "test"}], "notes": {}}], "intro": "<p>Role: ML Engineer / MLOps Engineer / AI Platform Engineer — take models from notebook to reliable production. Level to target: <strong>Advanced<\/strong>. Prerequisites: <code>01<\/code>, <code>04<\/code>, <code>06<\/code> (Docker, pipelines), some of <code>05<\/code>.<\/p>\n<hr/>"}, {"key": "pro", "file": "08_Professional_Research_and_System_Design.md", "title": "Professional & Research", "icon": "🎯", "sections": [{"title": "A. TECHNICAL COMMUNICATION (and English)", "items": [{"id": "pro:a6089347", "text": "Daily 10-minute speaking routine: pick one concept, explain it aloud as if to a beginner, record, listen, fix one thing next time", "sub": "A1. Spoken English and presentations", "kind": "skill"}, {"id": "pro:68648814", "text": "**Shadowing**: play a short tech talk, repeat sentence-by-sentence to copy rhythm and pronunciation", "sub": "A1. Spoken English and presentations", "kind": "skill"}, {"id": "pro:97f8997e", "text": "Build a \"meeting phrase bank\": agreeing/disagreeing politely, asking for clarification, summarizing (\"So to confirm…\"), buying time (\"Let me check and get back to you\"), giving status updates", "sub": "A1. Spoken English and presentations", "kind": "skill"}, {"id": "pro:074d9a15", "text": "Structure for explanations: **point → reason → example → point** (PREP); for status: **what I did → result → next → blockers**", "sub": "A1. Spoken English and presentations", "kind": "skill"}, {"id": "pro:12ede6e4", "text": "Present with a clear structure: problem → approach → result → recommendation; practice with a timer; slides with one message each", "sub": "A1. Spoken English and presentations", "kind": "skill"}, {"id": "pro:4f01f55d", "text": "Handle Q&A: pause, restate the question, answer briefly, say \"I don't know yet, I'll find out\" honestly", "sub": "A1. Spoken English and presentations", "kind": "skill"}, {"id": "pro:4ef05f87", "text": "Join Toastmasters or a speaking practice group; use ELSA Speak/Cambly/language exchange (optional); watch YouTube channels on English for tech professionals", "sub": "A1. Spoken English and presentations", "kind": "skill"}, {"id": "pro:ac0e72a3", "text": "Vocabulary: learn 5 technical/professional phrases a week in context, not word lists", "sub": "A1. Spoken English and presentations", "kind": "skill"}, {"id": "pro:0531c3d1", "text": "Emails: subject line with the ask; lead with the conclusion; bullets; clear next steps", "sub": "A2. Written communication", "kind": "skill"}, {"id": "pro:c2b3a513", "text": "Documentation: README, design docs, runbooks, data dictionaries, decision records (ADRs)", "sub": "A2. Written communication", "kind": "skill"}, {"id": "pro:f949cca5", "text": "Reports and executive summaries (one page, numbers first)", "sub": "A2. Written communication", "kind": "skill"}, {"id": "pro:41b20f65", "text": "Slack/Teams etiquette; asking good questions (what I tried, expected, actual, minimal example)", "sub": "A2. Written communication", "kind": "skill"}, {"id": "pro:c91d2ea9", "text": "Learning in public: one short post a week on LinkedIn or a blog (TIL posts, project write-ups); use Grammarly/LanguageTool", "sub": "A2. Written communication", "kind": "skill"}, {"id": "pro:bcb74d8a", "text": "Audience first; headline insight; evidence; recommendation; one message per chart; remove clutter", "sub": "A3. Data storytelling", "kind": "skill"}, {"id": "pro:f0e90c14", "text": "Resources: *Storytelling with Data* (Knaflic), *Good Charts* (Berinato)", "sub": "A3. Data storytelling", "kind": "skill"}], "extras": [{"sub": "A1. Spoken English and presentations", "after": 8, "html": "<ul><li>Truth: clear, simple, confident English beats fancy English. Accent is not a problem; clarity is the goal.<\/li><\/ul>"}], "notes": {}}, {"title": "B. PROBLEM SOLVING", "items": [{"id": "pro:26a9eae1", "text": "Framework: clarify → restate → examples → brute force → optimize → code → test → analyze complexity", "sub": "", "kind": "skill"}, {"id": "pro:3b82bd06", "text": "Structured thinking: MECE, issue trees, hypothesis-driven analysis, first-principles, 5 Whys, root-cause analysis (a performance engineer's native skill)", "sub": "", "kind": "skill"}, {"id": "pro:9fec87b2", "text": "Debugging methodology: reproduce → isolate → hypothesize → test → fix → prevent; bisecting; reading logs", "sub": "", "kind": "skill"}, {"id": "pro:3c2f48a4", "text": "Estimation (\"Fermi\") problems; back-of-envelope calculations for systems", "sub": "", "kind": "skill"}, {"id": "pro:abe5791a", "text": "Decision making under uncertainty; tradeoff documentation; reversible vs irreversible decisions", "sub": "", "kind": "skill"}, {"id": "pro:47416b6e", "text": "Learning how to learn: spaced repetition (Anki), active recall, teach-back, deliberate practice, project-based learning", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "C. TECHNICAL INTERVIEW PREPARATION", "items": [{"id": "pro:d314197d", "text": "Coding: LeetCode (SQL + Python); pattern-based practice (see `01` section E)", "sub": "C2. Preparation plan", "kind": "skill"}, {"id": "pro:7ef5598f", "text": "Stats/ML Q&A bank: write my own answers to 100 common questions (bias-variance, regularization, p-values, A/B testing, boosting, evaluation metrics…)", "sub": "C2. Preparation plan", "kind": "skill"}, {"id": "pro:079c7d78", "text": "**Behavioral (STAR method)**: prepare 8 stories (conflict, failure, leadership, ambiguity, deadline, mistake, influence, learning something fast); use real performance-engineering examples", "sub": "C2. Preparation plan", "kind": "skill"}, {"id": "pro:3d09d09d", "text": "Mock interviews: with peers, Pramp, interviewing.io; record and review myself", "sub": "C2. Preparation plan", "kind": "skill"}, {"id": "pro:8f220fa3", "text": "Resume: one page, impact-focused bullets (\"Reduced p95 latency by 40% by…\"), keywords for the role, project links, quantified results", "sub": "C2. Preparation plan", "kind": "skill"}, {"id": "pro:28fb20d5", "text": "LinkedIn: headline with target role, projects section, recommendations; GitHub pinned repos with clean READMEs", "sub": "C2. Preparation plan", "kind": "skill"}, {"id": "pro:7f9531e6", "text": "Job search: referrals first, company career pages, LinkedIn, Naukri, Instahyre, Wellfound; internal transfers; apply in batches, track in a spreadsheet; learn from rejections", "sub": "C2. Preparation plan", "kind": "skill"}, {"id": "pro:98e5536b", "text": "Negotiation basics: know market range (Glassdoor, AmbitionBox, levels.fyi), ask, compare total compensation, don't accept under pressure", "sub": "C2. Preparation plan", "kind": "skill"}], "extras": [{"sub": "C1. By role", "after": 0, "html": "<div class=\"tablewrap\"><table class=\"data\"><thead><tr><th>Round<\/th><th>Analyst<\/th><th>Data Eng<\/th><th>Data Scientist<\/th><th>ML/AI Eng<\/th><\/tr><\/thead><tbody><tr><td>SQL<\/td><td>Heavy<\/td><td>Heavy<\/td><td>Medium-Heavy<\/td><td>Medium<\/td><\/tr><tr><td>Python/coding<\/td><td>Light<\/td><td>Medium-Heavy<\/td><td>Medium<\/td><td>Heavy (+DSA)<\/td><\/tr><tr><td>Statistics/probability<\/td><td>Medium<\/td><td>Light<\/td><td>Heavy<\/td><td>Medium<\/td><\/tr><tr><td>ML<\/td><td>—<\/td><td>—<\/td><td>Heavy<\/td><td>Heavy<\/td><\/tr><tr><td>System design<\/td><td>—<\/td><td>Heavy (data systems)<\/td><td>Medium (ML design)<\/td><td>Heavy (ML systems)<\/td><\/tr><tr><td>Case/product<\/td><td>Heavy<\/td><td>Light<\/td><td>Heavy<\/td><td>Medium<\/td><\/tr><tr><td>Behavioral<\/td><td>Always<\/td><td>Always<\/td><td>Always<\/td><td>Always<\/td><\/tr><\/tbody><\/table><\/div>"}], "notes": {}}, {"title": "D. SYSTEM DESIGN", "items": [{"id": "pro:dbb98fb6", "text": "Fundamentals: client-server, HTTP, REST/gRPC, DNS, CDN, load balancers, caching (Redis, CDN, cache invalidation), databases (SQL vs NoSQL, indexing, sharding, replication), queues/streams, rate limiting, consistent hashing, CAP/PACELC, idempotency, observability", "sub": "D1. Software system design", "kind": "skill"}, {"id": "pro:a5ea7385", "text": "Reliability: availability, redundancy, failover, graceful degradation, circuit breakers, retries with backoff", "sub": "D1. Software system design", "kind": "skill"}, {"id": "pro:2f581e82", "text": "Classic problems: URL shortener, rate limiter, news feed, chat system, notification service, file storage, search autocomplete", "sub": "D1. Software system design", "kind": "skill"}, {"id": "pro:73de0e6a", "text": "Framework: requirements (functional + non-functional) → estimates → API → data model → high-level design → deep dives → bottlenecks → tradeoffs", "sub": "D1. Software system design", "kind": "skill"}, {"id": "pro:3eb1563f", "text": "Resources: *Designing Data-Intensive Applications*, *System Design Interview* (Alex Xu), ByteByteGo, Gaurav Sen/Hello Interview videos", "sub": "D1. Software system design", "kind": "skill"}, {"id": "pro:f184b37b", "text": "Framework: business objective → metric (offline and online) → data → features → model options → training → evaluation → serving (latency/cost) → monitoring → iteration → risks", "sub": "D2. ML/AI system design", "kind": "skill"}, {"id": "pro:f0e3bf52", "text": "Classic cases: recommendation system, search ranking, fraud detection, ads CTR prediction, content moderation, RAG/chatbot for enterprise docs, forecasting system, anomaly detection platform", "sub": "D2. ML/AI system design", "kind": "skill"}, {"id": "pro:fc7856c5", "text": "Resources: *Designing Machine Learning Systems* (Chip Huyen), *Machine Learning System Design Interview* (Aminian), Eugene Yan's blog, Google's *Rules of ML*", "sub": "D2. ML/AI system design", "kind": "skill"}, {"id": "pro:b46cc876", "text": "Choosing between prompt/RAG/fine-tune/agent; context and memory design; evaluation and guardrails as first-class components; cost/latency architecture; human-in-the-loop; failure and security modeling", "sub": "D3. AI system design (LLM-era)", "kind": "skill"}], "extras": [{"sub": "D1. Software system design", "after": 5, "html": "<ul><li><strong>Advantage:<\/strong> performance engineering gives me real intuition for load, bottlenecks, and capacity — use it explicitly in interviews.<\/li><\/ul>"}], "notes": {}}, {"title": "E. RESEARCH SKILLS (Advanced; important for Applied Scientist/Research roles, valuable for everyone)", "items": [{"id": "pro:c4dc3ed7", "text": "Formulating questions and falsifiable hypotheses; literature review; identifying gaps", "sub": "E1. Research methodology", "kind": "skill"}, {"id": "pro:7b536375", "text": "**Experimental design**: controls, baselines, ablations, confounders, randomization, power, multiple comparisons, seeds and variance reporting, statistical significance across runs", "sub": "E1. Research methodology", "kind": "skill"}, {"id": "pro:e21cd2ee", "text": "Reproducibility: version everything (code/data/config/env), report compute and hyperparameters, release code", "sub": "E1. Research methodology", "kind": "skill"}, {"id": "pro:2cc53335", "text": "Ethical research: data consent, privacy, bias, dual-use, responsible disclosure, honest reporting of negative results", "sub": "E1. Research methodology", "kind": "skill"}, {"id": "pro:d968c137", "text": "Applied vs fundamental research; academic vs industry research", "sub": "E1. Research methodology", "kind": "skill"}, {"id": "pro:c91c9056", "text": "Three-pass method (Keshav): (1) title/abstract/figures/conclusion, (2) method and results, (3) re-implement mentally", "sub": "E2. Reading papers (do this weekly)", "kind": "skill"}, {"id": "pro:2b7acef2", "text": "Questions per paper: problem? novelty? assumptions? baselines fair? ablations? limitations? would it work for my data?", "sub": "E2. Reading papers (do this weekly)", "kind": "skill"}, {"id": "pro:a6737667", "text": "Keep a paper log (title, 3-line summary, key idea, what I'd test); share a summary post monthly", "sub": "E2. Reading papers (do this weekly)", "kind": "skill"}, {"id": "pro:b651490d", "text": "Sources: arXiv (cs.LG, cs.CL, cs.CV, stat.ML), Papers with Code, Semantic Scholar, ACL Anthology, NeurIPS/ICML/ICLR/CVPR/KDD proceedings, Hugging Face Daily Papers, Distill-style blogs", "sub": "E2. Reading papers (do this weekly)", "kind": "skill"}, {"id": "pro:b7972e46", "text": "Starter list: *Attention Is All You Need*, BERT, ResNet, Adam, Dropout, GPT-3, LoRA, RLHF/InstructGPT, Chinchilla scaling, RAG (Lewis et al.), ReAct, Chain-of-Thought, CLIP, Latent Diffusion, XGBoost, plus classics in my chosen specialization", "sub": "E2. Reading papers (do this weekly)", "kind": "skill"}, {"id": "pro:b7544ab2", "text": "Structure: abstract, introduction (problem, gap, contribution), related work, method, experiments, results, limitations, conclusion", "sub": "E3. Research paper writing", "kind": "skill"}, {"id": "pro:0684065e", "text": "LaTeX (Overleaf), citation managers (Zotero), figures, tables, clear notation", "sub": "E3. Research paper writing", "kind": "skill"}, {"id": "pro:b306e09f", "text": "Writing clarity: short sentences, define terms, state contributions explicitly; get feedback; learn peer-review norms", "sub": "E3. Research paper writing", "kind": "skill"}, {"id": "pro:269352d1", "text": "Venues: workshops (easier start), arXiv preprints, conferences, journals; reproducibility checklists", "sub": "E3. Research paper writing", "kind": "skill"}, {"id": "pro:234d8f1d", "text": "Reproduce a paper at small scale; run ablations; try one improvement; document honestly", "sub": "E4. Deep learning and applied AI research", "kind": "skill"}, {"id": "pro:334619b9", "text": "Tools: PyTorch, `wandb`, Hugging Face Hub, `lm-evaluation-harness`; cheap compute (Colab, Kaggle, Lightning AI, credits, cloud spot)", "sub": "E4. Deep learning and applied AI research", "kind": "skill"}, {"id": "pro:630224f8", "text": "Applied research projects: improving retrieval quality, domain-specific fine-tuning, Indian-language NLP, efficient inference, evaluation methods, anomaly detection in performance data (ties to my background)", "sub": "E4. Deep learning and applied AI research", "kind": "skill"}, {"id": "pro:c317e471", "text": "Design paradigms (divide & conquer, greedy, DP, randomization, approximation), correctness proofs (induction, invariants), complexity analysis, lower bounds (awareness)", "sub": "E5. Algorithm design", "kind": "skill"}, {"id": "pro:23859bcc", "text": "Resources: CLRS, Skiena's *Algorithm Design Manual*, MIT 6.006/6.046 lectures", "sub": "E5. Algorithm design", "kind": "skill"}], "notes": {}}, {"title": "F. KAGGLE AND COMPETITIVE DATA SCIENCE", "items": [{"id": "pro:6b34f11c", "text": "Progression: Learn courses → Titanic/House Prices → Playground Series (monthly, great for learning) → featured/research competitions", "sub": "", "kind": "skill"}, {"id": "pro:63e2d1ad", "text": "Skills: solid local CV that matches leaderboard, feature engineering, GBM tuning, ensembling/stacking, error analysis, reading winning solution write-ups, notebooks and discussions", "sub": "", "kind": "skill"}, {"id": "pro:d1498b31", "text": "Goals: Notebooks Expert, Competitions Expert (bronze/silver medals) over time; document learnings publicly", "sub": "", "kind": "skill"}, {"id": "pro:96593a22", "text": "Other: DrivenData, Zindi (Africa/global), Analytics Vidhya, AIcrowd, Hugging Face leaderboards/challenges", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "G. OPEN-SOURCE CONTRIBUTIONS", "items": [{"id": "pro:2f244c72", "text": "Ladder: use libraries → read their code → file good bug reports → fix docs/typos → \"good first issue\" → features", "sub": "", "kind": "skill"}, {"id": "pro:3aa192a5", "text": "Beginner-friendly targets: pandas, scikit-learn, Airflow, dbt, Hugging Face libraries, Great Expectations, Evidently, LangChain/LlamaIndex, JMeter plugins (leverages my current skill), Locust", "sub": "", "kind": "skill"}, {"id": "pro:0c3ef3b2", "text": "Practices: read CONTRIBUTING.md, small focused PRs, tests included, polite communication, patience with review", "sub": "", "kind": "skill"}, {"id": "pro:789c07b2", "text": "Also valuable: publish my own small open-source tool (e.g. a JMeter-results-to-warehouse loader or performance-anomaly detector)", "sub": "", "kind": "skill"}, {"id": "pro:b386b4ee", "text": "Programs: Hacktoberfest, Google Summer of Code (if student/eligible), Outreachy", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "H. PORTFOLIO DEVELOPMENT", "items": [{"id": "pro:c37b20ee", "text": "Quality over quantity: **6-8 strong projects** beat 30 weak ones", "sub": "", "kind": "skill"}, {"id": "pro:e88b72fd", "text": "Each project: business/problem statement, data source, approach, results with numbers, what I'd do next, architecture diagram, how to run it (reproducible), tests, deployed demo where possible", "sub": "", "kind": "skill"}, {"id": "pro:d1e29af3", "text": "Mix: 2 analytics, 2 data engineering, 2 ML/DL, 1-2 GenAI/agents, 1 MLOps/performance project", "sub": "", "kind": "skill"}, {"id": "pro:9c5156f3", "text": "Personal website or GitHub Pages portfolio; LinkedIn featured section; short demo videos (2-3 minutes)", "sub": "", "kind": "skill"}, {"id": "pro:a9fadd12", "text": "Each project gets a blog post: problem, approach, results, mistakes made", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "I. TECHNICAL WRITING AND PUBLICATIONS", "items": [{"id": "pro:18b10bb6", "text": "Blogging platforms: Medium, dev.to, Hashnode, personal blog; consistent schedule (2 posts/month is plenty)", "sub": "", "kind": "skill"}, {"id": "pro:17d481c1", "text": "Post types: tutorials, \"what I learned\" retrospectives, project write-ups, paper summaries, comparisons with benchmarks", "sub": "", "kind": "skill"}, {"id": "pro:e00fbddf", "text": "Craft: audience, outline, code samples that run, diagrams, edit ruthlessly, clear title", "sub": "", "kind": "skill"}, {"id": "pro:436a8208", "text": "Upgrades over time: conference talks (local meetups first), workshop papers, open-source docs, Kaggle write-ups", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "J. BUSINESS AND PRODUCT UNDERSTANDING", "items": [{"id": "pro:5d705042", "text": "How the business makes money: revenue streams, cost structure, unit economics, margins, growth levers", "sub": "", "kind": "skill"}, {"id": "pro:e0d79c95", "text": "Product thinking: user problems, jobs-to-be-done, funnels, experimentation culture, roadmaps, prioritization (RICE/ICE), MVPs", "sub": "", "kind": "skill"}, {"id": "pro:a8c47297", "text": "Metrics: north-star, input/output, guardrails, leading vs lagging indicators", "sub": "", "kind": "skill"}, {"id": "pro:79b3fe2a", "text": "Domain depth: choose **one or two industries** (e.g., banking/fintech, e-commerce, healthcare, telecom, logistics, SaaS) and learn their data, regulations, KPIs, and common ML use cases", "sub": "", "kind": "skill"}, {"id": "pro:13af23bc", "text": "Working with stakeholders: scoping, expectation setting, ROI framing, saying no with alternatives, translating tech into business impact", "sub": "", "kind": "skill"}, {"id": "pro:4ef960e4", "text": "Data ethics and governance: privacy (DPDP Act, GDPR), consent, bias, explainability, accountability", "sub": "", "kind": "skill"}, {"id": "pro:7ef0f965", "text": "Resources: *Lean Analytics*, *Inspired* (Cagan), *Trustworthy Online Controlled Experiments* (Kohavi), industry reports and earnings calls", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "K. SOFT SKILLS AND CAREER HABITS", "items": [{"id": "pro:4990d683", "text": "Time management for working learners: protect a fixed daily slot; 1 hour consistent beats 6 hours occasional; use weekends for projects", "sub": "", "kind": "skill"}, {"id": "pro:363781dd", "text": "Mentors and community: find one mentor, join data communities (DataTalks.Club Slack, local meetups, LinkedIn groups, Kaggle), study buddy", "sub": "", "kind": "skill"}, {"id": "pro:44d1b8dd", "text": "Networking: 5 new genuine connections per month; share useful posts; ask thoughtful questions; never ask strangers only for a job", "sub": "", "kind": "skill"}, {"id": "pro:a2e6bd1c", "text": "Teamwork: giving/receiving feedback, code review etiquette, disagreeing respectfully, owning mistakes", "sub": "", "kind": "skill"}, {"id": "pro:82278ea9", "text": "Wellbeing: sleep, exercise, breaks, rest day; avoid comparison; track progress, not perfection; ask for help early; seek a counselor/therapist if self-criticism becomes heavy", "sub": "", "kind": "skill"}, {"id": "pro:02c22892", "text": "Career strategy: T-shaped skills (broad base, 1-2 deep specialities), choose companies/teams for learning, revisit the plan every 3 months", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "L. HOW THIS SHOWS UP IN THE PLAN", "items": [], "extras": [{"sub": "", "after": 0, "html": "<div class=\"tablewrap\"><table class=\"data\"><thead><tr><th>Habit<\/th><th>Frequency<\/th><\/tr><\/thead><tbody><tr><td>Speaking practice (record)<\/td><td>Daily 10 min<\/td><\/tr><tr><td>LinkedIn/blog post<\/td><td>Weekly (short)<\/td><\/tr><tr><td>Problem-solving practice (SQL/Python/DSA)<\/td><td>2-3 per week<\/td><\/tr><tr><td>Paper reading<\/td><td>1 per week from Stage 3; 1 per month earlier<\/td><\/tr><tr><td>Kaggle/Playground<\/td><td>1 per month from Stage 2<\/td><\/tr><tr><td>Mock interview<\/td><td>Monthly from month 6<\/td><\/tr><tr><td>Network outreach<\/td><td>5 per month<\/td><\/tr><tr><td>Monthly review + progress tracker<\/td><td>Last day of the month<\/td><\/tr><\/tbody><\/table><\/div>"}], "notes": {}}], "intro": "<p>These skills decide how far and how fast I grow. They apply to <strong>every<\/strong> role. Level to target: <strong>Advanced<\/strong> (research/system design), <strong>Continuous<\/strong> (professional skills).<\/p>\n<hr/>"}, {"key": "gap", "file": "09_Gap_Topics.md", "title": "Gap Topics (2nd pass)", "icon": "🧩", "sections": [{"title": "A. COMPUTER SCIENCE CORE (what sits under all the tools)", "items": [{"id": "gap:32f00312", "text": "Processes vs threads; scheduling; context switches; concurrency problems (race conditions, deadlocks, starvation); locks, semaphores", "sub": "A1. Operating systems", "kind": "skill"}, {"id": "gap:66fbb96c", "text": "Memory: stack vs heap, virtual memory, paging, caches, memory leaks, OOM behavior, swapping", "sub": "A1. Operating systems", "kind": "skill"}, {"id": "gap:b633fb20", "text": "File systems, I/O models (blocking, non-blocking, async), page cache, disk vs SSD behavior", "sub": "A1. Operating systems", "kind": "skill"}, {"id": "gap:31ebc579", "text": "Linux internals for diagnosis: `top/htop`, `vmstat`, `iostat`, `strace`, `perf`, `lsof`, `/proc`", "sub": "A1. Operating systems", "kind": "skill"}, {"id": "gap:bd900a91", "text": "OSI/TCP-IP layers; IP, subnets, DNS, DHCP, NAT, routing basics", "sub": "A2. Computer networks", "kind": "skill"}, {"id": "gap:9f499712", "text": "TCP (handshake, congestion control, retransmission) vs UDP; HTTP/1.1/2/3, TLS/HTTPS, WebSockets, gRPC", "sub": "A2. Computer networks", "kind": "skill"}, {"id": "gap:5e8666e0", "text": "Load balancers (L4/L7), proxies/reverse proxies, CDNs, firewalls, VPNs; latency vs bandwidth vs throughput", "sub": "A2. Computer networks", "kind": "skill"}, {"id": "gap:1fc14f84", "text": "Tools: `curl`, `dig`, `tcpdump`/Wireshark, `traceroute`, `netstat/ss`", "sub": "A2. Computer networks", "kind": "skill"}, {"id": "gap:cb9b022b", "text": "CPU vs GPU vs TPU; memory hierarchy; why GPUs suit matrix math; vectorization/SIMD; memory-bound vs compute-bound workloads", "sub": "A3. Computer architecture and compute for ML", "kind": "skill"}, {"id": "gap:c9fa89a1", "text": "Reading GPU specs (VRAM, FLOPS, bandwidth) and estimating whether a model fits", "sub": "A3. Computer architecture and compute for ML", "kind": "skill"}, {"id": "gap:bc4e7688", "text": "Cost of compute: on-demand vs spot, free tiers (Colab, Kaggle), budgeting training runs", "sub": "A3. Computer architecture and compute for ML", "kind": "skill"}, {"id": "gap:faba727b", "text": "Replication, partitioning, consensus (Raft/Paxos intuition), leader election, eventual vs strong consistency, CAP/PACELC", "sub": "A4. Distributed systems fundamentals", "kind": "skill"}, {"id": "gap:779000db", "text": "Failure models: network partitions, partial failures, retries, idempotency, backpressure, timeouts", "sub": "A4. Distributed systems fundamentals", "kind": "skill"}, {"id": "gap:fc9a121e", "text": "Book: *Designing Data-Intensive Applications*; *Distributed Systems* (van Steen)", "sub": "A4. Distributed systems fundamentals", "kind": "skill"}], "notes": {"": ["**Why it matters:** People who understand operating systems, memory, and networks debug faster and design better systems. Performance engineers already have a head start here; this section fills in the gaps and makes the knowledge explicit for interviews."]}}, {"title": "B. SECURITY AND PRIVACY BASICS (needed by every data/ML engineer)", "items": [{"id": "gap:7275abba", "text": "Authentication vs authorization; passwords/hashing, MFA, OAuth2/OIDC, JWT basics, API keys, SSO", "sub": "", "kind": "skill"}, {"id": "gap:adf4e029", "text": "Secrets management: never commit secrets, `.env` and `.gitignore`, secret scanners (`gitleaks`), vaults/cloud secret managers, key rotation", "sub": "", "kind": "skill"}, {"id": "gap:be6cd7ad", "text": "Encryption: at rest vs in transit, TLS, KMS, hashing vs encryption", "sub": "", "kind": "skill"}, {"id": "gap:796ada2a", "text": "Least privilege, IAM roles, network isolation, private endpoints, audit logs", "sub": "", "kind": "skill"}, {"id": "gap:e891d8da", "text": "OWASP Top 10 awareness (injection, broken access control…); **SQL injection and parameterized queries**", "sub": "", "kind": "skill"}, {"id": "gap:c5a7f221", "text": "Dependency and container scanning (`pip-audit`, Dependabot, Trivy); pinned versions; supply-chain awareness", "sub": "", "kind": "skill"}, {"id": "gap:97e5f376", "text": "Data privacy engineering: PII detection, masking/tokenization, anonymization limits, data retention, access reviews", "sub": "", "kind": "skill"}, {"id": "gap:aec424d0", "text": "ML/AI-specific security: prompt injection, data leakage through models, model theft, poisoning, safe handling of API keys in notebooks", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** Data roles handle sensitive data. A leaked credential or exposed bucket is a career-defining mistake. Security basics are cheap to learn and heavily valued."]}}, {"title": "C. OTHER LANGUAGES AND TOOLS WORTH KNOWING", "items": [{"id": "gap:92d864f8", "text": "**R** (tidyverse, `ggplot2`, `dplyr`, `tidymodels`): common in biostatistics, pharma, academi

a, survey and econometric work", "sub": "", "kind": "skill"}, {"id": "gap:97d3715f", "text": "**Scala** (Spark native) / **Java** (Kafka, Spark, JMeter ecosystem) basics, only if a DE role demands it", "sub": "", "kind": "skill"}, {"id": "gap:988588d8", "text": "**Go or Rust** awareness for high-performance data tools; **TypeScript/JavaScript** basics for building dashboards and demos", "sub": "", "kind": "skill"}, {"id": "gap:16ef4391", "text": "**Bash/Zsh** scripting (see `01`), **PowerShell** basics if the employer is a Windows/Azure shop", "sub": "", "kind": "skill"}, {"id": "gap:663e6ab2", "text": "**Jupyter alternatives:** VS Code notebooks, Marimo, Quarto (reproducible reports), Observable", "sub": "", "kind": "skill"}, {"id": "gap:afc1be08", "text": "**Markdown, LaTeX, Mermaid/diagrams-as-code** for documentation", "sub": "", "kind": "skill"}, {"id": "gap:40262d72", "text": "**Google Sheets** (+ Apps Script) and **Looker Studio** for lightweight analytics", "sub": "", "kind": "skill"}], "notes": {"": ["**Insight:** One language deeply (Python) beats five shallowly. These are optional add-ons for specific roles."]}}, {"title": "D. DATABASES BEYOND SQL", "items": [{"id": "gap:7020f418", "text": "**Document stores (MongoDB):** collections, schema design (embed vs reference), indexes, aggregation pipeline", "sub": "", "kind": "skill"}, {"id": "gap:e4453ca6", "text": "**Key-value/cache (Redis):** data structures, TTL, caching patterns (cache-aside, write-through), invalidation, rate limiting, pub/sub", "sub": "", "kind": "skill"}, {"id": "gap:b7c0ecc9", "text": "**Wide-column (Cassandra/HBase/DynamoDB):** partition keys, query-first modeling, tunable consistency", "sub": "", "kind": "skill"}, {"id": "gap:f7fee8f7", "text": "**Time-series DBs (InfluxDB, TimescaleDB, Prometheus):** retention, downsampling, cardinality problems — relevant to monitoring and performance data", "sub": "", "kind": "skill"}, {"id": "gap:8f20030d", "text": "**Graph DBs (Neo4j) and graph queries (Cypher):** relationship-heavy problems (fraud rings, recommendations)", "sub": "", "kind": "skill"}, {"id": "gap:fd9a8f00", "text": "**Search engines (Elasticsearch/OpenSearch/Solr):** inverted index, analyzers, relevance (BM25), aggregations; also used for logs", "sub": "", "kind": "skill"}, {"id": "gap:8328c984", "text": "**Vector databases:** see `05`; **OLAP engines:** ClickHouse, Druid, Pinot (see `06`)", "sub": "", "kind": "skill"}, {"id": "gap:3ba0af18", "text": "**NewSQL/distributed SQL:** CockroachDB, Spanner, TiDB — awareness", "sub": "", "kind": "skill"}, {"id": "gap:31b90030", "text": "Polyglot persistence: choosing a store by access pattern, consistency need, scale, and operational cost", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** Interview questions and real systems mix storage types. Knowing what each is *good at* and *bad at* beats memorizing product names."]}}, {"title": "E. BI AND PRODUCT-ANALYTICS TOOLING", "items": [{"id": "gap:b0794757", "text": "**Tableau** (calculated fields, LOD expressions, parameters, dashboard actions), **Looker/LookML** (semantic layer), **Qlik** awareness, **Metabase/Superset** (open source), **Looker Studio**", "sub": "", "kind": "skill"}, {"id": "gap:ae347f3d", "text": "**Product analytics:** event tracking plans, naming conventions, GA4, Mixpanel, Amplitude, Segment/RudderStack; funnels, retention curves, user paths, cohorts", "sub": "", "kind": "skill"}, {"id": "gap:d6f17936", "text": "**Web/marketing analytics:** UTM tracking, attribution windows, SEO and campaign dashboards, sessions vs users definitions", "sub": "", "kind": "skill"}, {"id": "gap:c3cd73e1", "text": "**Survey and qualitative analysis:** survey design, sampling, bias, Likert scale analysis, text coding", "sub": "", "kind": "skill"}, {"id": "gap:bd73047b", "text": "**Metrics layers / semantic layers** (dbt metrics, Cube) for consistent definitions across dashboards", "sub": "", "kind": "skill"}, {"id": "gap:9ad7d074", "text": "Dashboard governance: certified datasets, data dictionaries, refresh SLAs, access control, performance tuning of slow dashboards", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** Analyst job posts often name tools. Knowing two BI tools and one product-analytics tool makes you flexible."]}}, {"title": "F. QUANTITATIVE METHODS BEYOND THE CORE", "items": [{"id": "gap:6b3d2cd4", "text": "Linear programming (simplex, duality, sensitivity), integer/mixed-integer programming, constraint programming, network flow, assignment/transportation problems", "sub": "F1. Operations research (optimization in practice)", "kind": "skill"}, {"id": "gap:81261c0a", "text": "Routing and scheduling (TSP/VRP), knapsack, bin packing, heuristics/metaheuristics", "sub": "F1. Operations research (optimization in practice)", "kind": "skill"}, {"id": "gap:5a855b51", "text": "Queueing theory basics (M/M/1, Little's law, utilization vs wait time) — directly tied to performance engineering", "sub": "F1. Operations research (optimization in practice)", "kind": "skill"}, {"id": "gap:305fabda", "text": "Tools: `PuLP`, `OR-Tools`, `Pyomo`, `cvxpy`, `scipy.optimize`, `Gurobi` (awareness), `simpy` for discrete-event simulation", "sub": "F1. Operations research (optimization in practice)", "kind": "skill"}, {"id": "gap:c87b0e9e", "text": "Panel data, fixed/random effects, instrumental variables, time-series econometrics (cointegration, VAR), event studies", "sub": "F2. Econometrics and applied statistics", "kind": "skill"}, {"id": "gap:6c58a180", "text": "Quasi-experimental design in practice (see `04_Data_Science.md` F2)", "sub": "F2. Econometrics and applied statistics", "kind": "skill"}, {"id": "gap:89ca8627", "text": "Survey methodology, weighting, post-stratification, small-area estimation — awareness", "sub": "F2. Econometrics and applied statistics", "kind": "skill"}, {"id": "gap:8a897542", "text": "Monte Carlo methods, bootstrapping, MCMC (Metropolis-Hastings, HMC), variational inference awareness, probabilistic programming (`PyMC`, `Stan`, `NumPyro`)", "sub": "F3. Simulation and Bayesian modelling", "kind": "skill"}, {"id": "gap:90a84285", "text": "Agent-based and discrete-event simulation for what-if analysis", "sub": "F3. Simulation and Bayesian modelling", "kind": "skill"}, {"id": "gap:7c9232fe", "text": "Graph basics, centrality, community detection, link prediction, PageRank, `networkx`, graph embeddings and GNNs (awareness)", "sub": "F4. Network/graph analytics", "kind": "skill"}], "notes": {"F1. Operations research (optimization in practice)": ["**Insight:** A lot of \"AI\" value is really optimization: allocating budget, routing vehicles, scheduling staff, pricing. OR skills pair very well with ML (predict, then optimize)."]}}, {"title": "G. BRIDGE FROM PERFORMANCE ENGINEERING (my unfair advantage)", "items": [{"id": "gap:a1b268ae", "text": "Load, stress, soak and spike testing design; workload modeling (think time, pacing, concurrency vs throughput)", "sub": "G1. Skills I already have (document them with evidence)", "kind": "skill"}, {"id": "gap:b66c20a2", "text": "JMeter plus scripting (Groovy), correlation/parameterization, distributed testing; reading percentile latencies, error classes", "sub": "G1. Skills I already have (document them with evidence)", "kind": "skill"}, {"id": "gap:7117bf14", "text": "Bottleneck analysis: CPU, memory, I/O, DB locks/queries, connection pools, GC, thread pools, network", "sub": "G1. Skills I already have (document them with evidence)", "kind": "skill"}, {"id": "gap:e375e6c0", "text": "Reporting for stakeholders, capacity recommendations, SLA/SLO validation", "sub": "G1. Skills I already have (document them with evidence)", "kind": "skill"}, {"id": "gap:c0027cfb", "text": "Add: Locust (Python), k6, Gatling, BlazeMeter awareness", "sub": "G1. Skills I already have (document them with evidence)", "kind": "skill"}, {"id": "gap:7cf115a6", "text": "**Performance analytics:** put test and monitoring results into a warehouse; trend analysis across builds; regression detection with statistics (bootstrap, change-point)", "sub": "G2. Add data skills to those (the combined profile)", "kind": "skill"}, {"id": "gap:89914d04", "text": "**Observability data:** logs/metrics/traces (OpenTelemetry), Prometheus + Grafana, ELK/OpenSearch, APM tools (Dynatrace, AppDynamics, New Relic, Datadog)", "sub": "G2. Add data skills to those (the combined profile)", "kind": "skill"}, {"id": "gap:0ec4ebe2", "text": "**AIOps:** anomaly detection on metrics, log clustering/parsing, incident prediction, root-cause ranking, alert noise reduction", "sub": "G2. Add data skills to those (the combined profile)", "kind": "skill"}, {"id": "gap:ac2c02f6", "text": "**Capacity forecasting:** time-series forecasting of load and resource usage; autoscaling policy evaluation", "sub": "G2. Add data skills to those (the combined profile)", "kind": "skill"}, {"id": "gap:6d5ddd43", "text": "**Queueing models + data:** Little's law, utilization-latency curves fit from test data", "sub": "G2. Add data skills to those (the combined profile)", "kind": "skill"}, {"id": "gap:cae089a8", "text": "**Testing data and ML systems:** load testing data pipelines, Kafka consumers, and ML inference endpoints (latency percentiles, throughput, GPU utilization, cost per 1k predictions)", "sub": "G2. Add data skills to those (the combined profile)", "kind": "skill"}, {"id": "gap:8ae57150", "text": "**Data-quality and pipeline reliability testing**: chaos testing of pipelines, backfill performance, SLAs for freshness", "sub": "G2. Add data skills to those (the combined profile)", "kind": "skill"}], "notes": {"": ["**Why it matters:** Most data/ML people can't answer \"will this system handle 10× load?\" or \"why did latency spike at 3pm?\" I can. Positioning myself as *the data person who understands systems performance* gives me a niche, makes my story memorable in interviews, and opens roles like **Data Platform, ML Platform, Observability/AIOps, and Performance Analytics**."]}, "extras": [{"sub": "G3. Signature portfolio pieces", "after": 12, "html": "<ol><li>JMeter results → warehouse → dashboard with regression detection across releases<\/li><li>Anomaly detection on real monitoring metrics with documented precision/recall<\/li><li>Load-testing report for a data pipeline or ML endpoint with bottleneck analysis and cost model<\/li><li>Blog post series: \"What performance engineering taught me about data engineering\"<\/li><\/ol>"}]}, {"title": "H. DOMAIN KNOWLEDGE (pick one or two; this is a career moat)", "items": [{"id": "gap:97461ce6", "text": "**BFSI (banking, financial services, insurance):** payments/UPI, credit lifecycle, risk metrics (NPA, PD/LGD), KYC/AML, regulations (RBI), actuarial basics", "sub": "", "kind": "skill"}, {"id": "gap:8be783e7", "text": "**E-commerce/retail:** catalog, pricing, promotions, logistics, returns, marketplaces, search/recommendation", "sub": "", "kind": "skill"}, {"id": "gap:39a0ac66", "text": "**Telecom:** churn, ARPU, network KPIs, billing; **Healthcare/pharma:** clinical data, privacy, outcomes, regulatory", "sub": "", "kind": "skill"}, {"id": "gap:1bf3b0a3", "text": "**SaaS/product companies:** MRR/ARR, subscriptions, PLG funnels, activation and retention", "sub": "", "kind": "skill"}, {"id": "gap:80f81a78", "text": "**Logistics/supply chain, manufacturing, energy/utilities, ed-tech, ad-tech/media, gaming, government/public services**", "sub": "", "kind": "skill"}, {"id": "gap:4cae6697", "text": "How to learn a domain fast: read annual reports and earnings calls, glossary of 50 terms, ask domain experts, shadow a business meeting, build one domain project", "sub": "", "kind": "skill"}, {"id": "gap:bec4a58a", "text": "**Indian context advantages:** UPI/fintech scale, ONDC and open networks, e-commerce and quick commerce, Indian-language NLP (AI4Bharat, Bhashini), agritech, GCC (Global Capability Center) roles in India, data localization/DPDP rules", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** Two equally skilled candidates differ by domain understanding. It's also the part AI tools can't easily replace."]}}, {"title": "I. LEARNING PATHS, DEGREES, AND CERTIFICATIONS (map)", "items": [{"id": "gap:4b12dc6a", "text": "**Certification map** (pick only those matching my target job): SQL (none needed), Power BI PL-300, Tableau Desktop Specialist, AWS Cloud Practitioner → Data Engineer Associate / ML Engineer Associate, Azure DP-900/DP-700/AI-102, Google Professional Data Engineer / ML Engineer, Databricks Associate, Snowflake SnowPro Core, Terraform Associate, CKA/CKAD (platform roles)", "sub": "", "kind": "skill"}, {"id": "gap:347f9360", "text": "**Free structured programs:** DataTalks.Club Zoomcamps (DE, ML, MLOps, LLM), Harvard CS50 series, Stanford CS229/CS231n/CS224n, fast.ai, Google ML Crash Course, Kaggle Learn", "sub": "", "kind": "skill"}, {"id": "gap:e9de33e2", "text": "**Part-time/online degree options (optional, long-term):** IIT Madras BS in Data Science and Applications, other Indian online M.Tech/PG programs, Georgia Tech OMSCS/OMSA, UT Austin MS online programs. Research costs, time load, and recognition before committing", "sub": "", "kind": "skill"}, {"id": "gap:b6ab0bfa", "text": "**When a degree matters:** research scientist roles, some big-tech/PhD-heavy teams, immigration/visa routes; for most DA/DE/MLE roles, projects + experience win", "sub": "", "kind": "skill"}, {"id": "gap:a2908088", "text": "Avoid: expensive bootcamps promising guaranteed jobs, certificate collecting without projects", "sub": "", "kind": "skill"}], "notes": {"": ["**Insight:** Certificates and degrees help most when you lack other proof or when a company filters by them. Projects plus experience usually matter more. Choose credentials deliberately and cheaply."]}}, {"title": "J. CAREER PATHS AND JOB SEARCH (India-aware)", "items": [{"id": "gap:84f32585", "text": "Map of paths: IC track (Analyst → Senior → Staff/Principal), Management track (Lead → Manager → Director), Specialist (MLOps, Data Architect, Applied Scientist), Product/consulting/entrepreneurship, freelancing/consulting", "sub": "", "kind": "skill"}, {"id": "gap:a388ead6", "text": "**Internal transfer playbook:** talk to data/analytics managers, volunteer for data tasks, build a visible internal project (e.g. perf-analytics dashboard), ask for a shadow assignment, then formalize", "sub": "", "kind": "skill"}, {"id": "gap:72bf104b", "text": "**Target company types:** product companies, GCCs/captive centers, service companies/MNCs, startups, consulting firms; differences in pay, learning, stability, and interview style", "sub": "", "kind": "skill"}, {"id": "gap:d39bcf1f", "text": "Platforms and channels: referrals first, LinkedIn, company career pages, Naukri, Instahyre, Wellfound, Cutshort, Hirist; recruiter outreach templates; community referrals", "sub": "", "kind": "skill"}, {"id": "gap:97d41ca6", "text": "Resume ATS-friendly format, quantified bullets, project links; LinkedIn headline \"Performance Engineer → Data Engineer\"", "sub": "", "kind": "skill"}, {"id": "gap:48e955eb", "text": "Salary research: Glassdoor, AmbitionBox, levels.fyi; negotiating with data, comparing total compensation, notice-period strategy", "sub": "", "kind": "skill"}, {"id": "gap:dbecaa93", "text": "Interview loop knowledge: online assessment, SQL/Python screen, case/system design, behavioral; rejection log and improvement cycle", "sub": "", "kind": "skill"}, {"id": "gap:32564e64", "text": "Freelancing/side income (optional): small analytics/automation gigs, content, tutoring/teaching (also deepens learning)", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "K. LEARNING EFFECTIVENESS AND WELLBEING", "items": [{"id": "gap:290b96eb", "text": "Evidence-based study methods: **active recall, spaced repetition (Anki), interleaving, teaching-back, deliberate practice, desirable difficulties**; avoid passive re-watching", "sub": "", "kind": "skill"}, {"id": "gap:fa84f5e5", "text": "Note system: one notebook/Obsidian-style vault; \"what I learned / what confused me\" log (already in the habits)", "sub": "", "kind": "skill"}, {"id": "gap:2c9a3467", "text": "Energy management: fixed daily slot, sleep 7+ hours, movement, breaks (Pomodoro 25/5), weekly rest day; study on the days it's easiest to be consistent", "sub": "", "kind": "skill"}, {"id": "gap:72d479bc", "text": "Beating overwhelm: one project, one resource per topic (\"resource hopping\" is a trap), finish before starting new courses", "sub": "", "kind": "skill"}, {"id": "gap:0bec8366", "text": "Beating imposter feelings and comparison: track my own progress, celebrate small wins, remember everyone started confused", "sub": "", "kind": "skill"}, {"id": "gap:06e345b1", "text": "Mentors and peers: study buddy, community (DataTalks.Club Slack, local meetups), asking good questions", "sub": "", "kind": "skill"}, {"id": "gap:43d537eb", "text": "**When to seek help:** if the self-criticism becomes heavy or constant, talk to a trusted person or a counselor/therapist. Mental health support is part of a sustainable career, not a detour from it", "sub": "", "kind": "skill"}, {"id": "gap:910e3f65", "text": "Financial resilience: emergency fund, avoid debt for courses, keep the job until a signed offer", "sub": "", "kind": "skill"}], "notes": {"": ["**Why it matters:** The best plan fails if the person running it burns out. A working learner's real constraint is energy, not information."]}}, {"title": "L. HOW TO USE THIS FILE", "items": [], "extras": [{"sub": "", "after": 0, "html": "<ol><li>Don't try to finish it. It's a \"when you need it\" map.<\/li><li>Pull sections into the schedule when a trigger appears: <em>security<\/em> (month 9+, with pipelines/cloud), <em>OS/networks<\/em> (interview prep), <em>BI tools<\/em> (analyst job target), <em>OR/econometrics<\/em> (DS roles in pricing, supply chain, marketing), <em>performance bridge<\/em> (start in month 4 with Project 1, keep adding), <em>domain knowledge<\/em> (choose by month 6), <em>career paths/job search<\/em> (from month 6).<\/li><li>If something is still missing, add it with the \"Add something I missed\" box on the dashboard, or tell me and I'll add it to the files.<\/li><\/ol>"}], "notes": {}}], "intro": "<p>I audited files 01–08 for what was missing. These topics were either absent or only mentioned in passing. Use this file as a <strong>second pass<\/strong>: don't start here, come back to a section when a role, interview, or project needs it. Lines starting with <strong>&gt;<\/strong> explain why the topic matters.<\/p>\n<hr/>"}], "phases": [{"id": "p1", "months": [1, 1], "stage": 1, "title": "SQL basics (weeks 1-4)", "goal": "Daily lessons in 'Today' teach this. These are the milestones to tick at the end.", "tasks": [{"id": "p1:302be7ca", "text": "PostgreSQL (or SQLite) installed and a first table created"}, {"id": "p1:a240cee5", "text": "Finished SQLBolt (all single-table and join lessons)"}, {"id": "p1:db6b9188", "text": "Can write SELECT, WHERE, ORDER BY, GROUP BY, HAVING without help"}, {"id": "p1:9e0565f4", "text": "Can write INNER and LEFT JOINs across 3 tables"}, {"id": "p1:895824a9", "text": "Solved 30+ easy SQL problems"}, {"id": "p1:abbc37bc", "text": "Answered 10 business questions on my own orders table"}, {"id": "p1:31830238", "text": "GitHub account created and first files pushed"}, {"id": "p1:4807cc3e", "text": "Month-1 review written in the weekly review box"}], "maps": ["prog"], "project": null, "exit": "I can solve easy SQL problems without help.", "weeks": [1, 4]}, {"id": "p2", "months": [2, 2], "stage": 1, "title": "SQL intermediate and advanced (weeks 5-8)", "goal": "Daily lessons in 'Today' teach this. These are the milestones to tick at the end.", "tasks": [{"id": "p2:2ca8006f", "text": "Comfortable with subqueries and CTEs"}, {"id": "p2:0b1fa0c7", "text": "Can use CASE WHEN and conditional aggregation"}, {"id": "p2:e262a8c0", "text": "Can use window functions: ROW_NUMBER, RANK, LAG, LEAD, running totals"}, {"id": "p2:3e40f765", "text": "Created an index and measured the difference; can read EXPLAIN"}, {"id": "p2:d779752b", "text": "Designed a small normalized schema with keys"}, {"id": "p2:0a25b483", "text": "50+ SQL problems solved in total"}, {"id": "p2:55660dfd", "text": "SQL mini-project published on GitHub with a README"}], "maps": ["prog", "analyst"], "project": "SQL mini-project", "exit": "I can solve medium SQL problems including window functions.", "weeks": [5, 8]}, {"id": "p3", "months": [3, 3], "stage": 1, "title": "Python basics, Git, Linux (weeks 9-13)", "goal": "Daily lessons in 'Today' teach this. These are the milestones to tick at the end.", "tasks": [{"id": "p3:80273da4", "text": "Python and VS Code installed; wrote and ran several scripts"}, {"id": "p3:d25415a2", "text": "Comfortable with variables, conditions, loops, functions"}, {"id": "p3:3e496e27", "text": "Comfortable with lists, dicts, sets and comprehensions"}, {"id": "p3:94d06d70", "text": "Can read and write files, CSV and JSON, and handle errors"}, {"id": "p3:370b7560", "text": "Git: commit, push, and write a README; about 20 commits on GitHub"}, {"id": "p3:393c7d94", "text": "Linux basics: navigate, grep, pipes"}, {"id": "p3:a4cb38af", "text": "Timed-events analysis script and a Python + SQLite loader pushed to GitHub"}, {"id": "p3:e7839770", "text": "Month-3 self-test passed"}], "maps": ["prog"], "project": null, "exit": "I can write and push a small Python script; I use Git daily.", "weeks": [9, 13]}, {"id": "p4", "months": [4, 4], "stage": 1, "title": "pandas, EDA, Excel + Project 1", "goal": "Take a messy dataset, clean it, analyze it, and explain it.", "tasks": [{"id": "p4:3041ebfa", "text": "NumPy basics"}, {"id": "p4:ec4cedc6", "text": "pandas: DataFrames, I/O, filtering, groupby, merge, pivot"}, {"id": "p4:63fa13d5", "text": "Cleaning: missing data, duplicates, dtypes, outliers"}, {"id": "p4:014d7c14", "text": "EDA: step-by-step checklist on a new dataset"}, {"id": "p4:9426f888", "text": "Excel: pivot tables, XLOOKUP, formulas, charts"}, {"id": "p4:d5ec915f", "text": "Project 1 - Timed-events Results Analyzer: load a CSV of timed events into PostgreSQL"}, {"id": "p4:659833ea", "text": "Project 1: percentiles (p90/p95/p99), error rate, throughput via SQL + pandas"}, {"id": "p4:da6b51ad", "text": "Project 1: charts + README with findings, published on GitHub"}, {"id": "p4:c08f4222", "text": "Month-end review + update this tracker"}], "maps": ["analyst", "prog"], "project": "Timed-events Results Analyzer", "exit": "Project 1 is on GitHub with a clear README."}, {"id": "p5", "months": [5, 5], "stage": 1, "title": "Visualization, Power BI, statistics + Project 2", "goal": "Build a clear dashboard and understand basic statistics.", "tasks": [{"id": "p5:0068669b", "text": "matplotlib and seaborn basics"}, {"id": "p5:28ed1980", "text": "Power BI: connect data, Power Query, star-schema model, relationships"}, {"id": "p5:fe334e32", "text": "Power BI: basic DAX (measures, CALCULATE, time intelligence)"}, {"id": "p5:36e517a1", "text": "Dashboard design: right chart, keep it simple"}, {"id": "p5:dc2f86d3", "text": "Statistics: mean, median, std, percentiles, distributions"}, {"id": "p5:1caad1a8", "text": "Probability basics: conditional probability, Bayes"}, {"id": "p5:74ae4df7", "text": "Sampling and confidence intervals (Khan Academy)"}, {"id": "p5:38b263f3", "text": "Project 2 - Power BI sales / e-commerce dashboard (2 pages)"}, {"id": "p5:c08f4222", "text": "Month-end review + update this tracker"}], "maps": ["analyst", "math"], "project": "Power BI sales dashboard", "exit": "A published dashboard and I can explain basic statistics."}, {"id": "p6", "months": [6, 6], "stage": 1, "title": "Hypothesis testing, business thinking, first applications", "goal": "Finish Stage 1 and start applying for analyst roles.", "tasks": [{"id": "p6:08990fb7", "text": "Hypothesis testing: null/alternative, p-value, t-test, chi-square, errors"}, {"id": "p6:139bea79", "text": "A/B testing: design, sample size, interpretation"}, {"id": "p6:6bdcb47c", "text": "Business metrics: KPIs, funnels, retention, churn, conversion"}, {"id": "p6:7718da05", "text": "Project 3 - churn or A/B test analysis (SQL + Python + stats + business write-up)"}, {"id": "p6:2e9a3b32", "text": "Update resume and LinkedIn with skills and 3 projects"}, {"id": "p6:c0d5f51a", "text": "Ask my company about internal data/analytics teams"}, {"id": "p6:28b73bd9", "text": "Begin applying (a few a week, even if I don't feel 100% ready)"}, {"id": "p6:b03ce568", "text": "Prepare 8 STAR behavioral stories"}, {"id": "p6:c08f4222", "text": "Month-end review + update this tracker"}], "maps": ["analyst", "math", "ds", "pro", "gap"], "project": "Churn / A-B test analysis", "exit": "Stage 1 done: 3 projects, a dashboard, applications started."}, {"id": "p7", "months": [7, 8], "stage": 2, "title": "Python depth, OOP, DSA basics", "goal": "Write clean, tested Python. (Math is learned just in time inside ML, not here.)", "tasks": [{"id": "p7:87599aa0", "text": "Refactor Project 1 into clean classes and modules (OOP by doing)"}, {"id": "p7:22cd9033", "text": "Add pytest tests to an old project"}, {"id": "p7:bf1784bc", "text": "Virtual environments, packages, clean-code habits"}, {"id": "p7:151902dd", "text": "DSA: arrays, hashing, strings, two pointers, sliding window, binary search"}, {"id": "p7:3529aaa0", "text": "DSA: stacks/queues, recursion, sorting, Big-O"}, {"id": "p7:21fe1c8a", "text": "80 easy/medium problems solved"}, {"id": "p7:7433ac53", "text": "Weekend curiosity: one 3Blue1Brown video per week, no note-taking"}], "maps": ["prog"], "project": null, "exit": "Clean, tested Python code and 80 problems solved."}, {"id": "p8", "months": [9, 10], "stage": 2, "title": "Data engineering core + Project 4", "goal": "Build and schedule a real pipeline.", "tasks": [{"id": "p8:2f833411", "text": "Linux and shell scripting (deeper)"}, {"id": "p8:adcce4b3", "text": "ETL vs ELT, batch vs streaming"}, {"id": "p8:a4e1b32a", "text": "Data modeling: star/snowflake schema, fact and dimension tables, SCD"}, {"id": "p8:128d5595", "text": "Data warehouses, lakes, lakehouses (concepts)"}, {"id": "p8:a8a35723", "text": "Apache Airflow: DAGs, scheduling, retries, backfills"}, {"id": "p8:81d3bbea", "text": "Docker: images, Dockerfile, compose"}, {"id": "p8:2e83260f", "text": "Working with APIs and JSON"}, {"id": "p8:1ed5bef2", "text": "Project 4 - API -> Airflow -> PostgreSQL pipeline in Docker, with tests and alerts"}], "maps": ["de", "prog"], "project": "API -> Airflow -> Postgres pipeline", "exit": "A scheduled, tested pipeline running in Docker."}, {"id": "p9", "months": [11, 12], "stage": 2, "title": "Cloud + warehouse + dbt + Project 5", "goal": "Deploy a pipeline on one cloud and start applying for data engineer roles.", "tasks": [{"id": "p9:966c9812", "text": "Pick ONE cloud (AWS / Azure / GCP) based on my target jobs"}, {"id": "p9:95f25f4e", "text": "Cloud basics: IAM, storage, compute, networking, serverless"}, {"id": "p9:93820a39", "text": "A cloud warehouse (Redshift / Synapse / BigQuery) or Snowflake"}, {"id": "p9:3dbe4bb4", "text": "dbt: models, tests, snapshots, docs"}, {"id": "p9:8c706fe5", "text": "Project 5 - end-to-end cloud pipeline (ingest -> store -> transform -> warehouse -> dashboard)"}, {"id": "p9:fda070e7", "text": "Cloud certification (optional but valuable)"}, {"id": "p9:877a182d", "text": "Practice DE interviews: SQL, Python, data modeling, 'design a pipeline'"}, {"id": "p9:9fb05547", "text": "Apply for Data Engineer roles / internal transfers"}], "maps": ["de", "mlops", "gap", "pro"], "project": "End-to-end cloud pipeline", "exit": "Pipeline deployed on a cloud; DE applications started."}, {"id": "p10", "months": [13, 15], "stage": 2, "title": "Machine learning: build first, math just in time", "goal": "Build ML models, then learn the math that your questions demand, then rebuild from scratch.", "tasks": [{"id": "p10:c7cf71ad", "text": "Weeks 1-2 BUILD: linear regression on house prices with scikit-learn"}, {"id": "p10:ea9df47f", "text": "Weeks 1-2 THEORY: loss function, derivatives, gradient descent (3Blue1Brown)"}, {"id": "p10:766574e8", "text": "Weeks 1-2 REBUILD: gradient descent for linear regression in NumPy"}, {"id": "p10:16901e8f", "text": "Weeks 3-4 BUILD: logistic regression + train/test split"}, {"id": "p10:0557bea7", "text": "Weeks 3-4 THEORY: probability, odds, log-loss, Bayes"}, {"id": "p10:8674a6d3", "text": "Weeks 3-4 REBUILD: logistic regression from scratch + decision boundary plot"}, {"id": "p10:17e7a492", "text": "Weeks 5-6 BUILD: decision trees, random forest, XGBoost/LightGBM, sklearn Pipelines"}, {"id": "p10:f9eb3c9d", "text": "Weeks 5-6 THEORY: Gini/entropy, bagging vs boosting (StatQuest)"}, {"id": "p10:8d43cd56", "text": "Weeks 7-8 BUILD: cross-validation, metrics, regularization, Optuna tuning"}, {"id": "p10:7ce1b766", "text": "Weeks 7-8 THEORY: bias-variance, L1/L2, precision/recall/ROC; make a model overfit on purpose, then fix it"}, {"id": "p10:a4519036", "text": "Weeks 9-10 BUILD: k-means, hierarchical clustering, PCA"}, {"id": "p10:5b32e136", "text": "Weeks 9-10 THEORY: vectors, matrices, eigenvectors, SVD (3Blue1Brown); REBUILD PCA in NumPy"}, {"id": "p10:79a05d85", "text": "Weeks 11-12: Project 6 - prediction project (e.g. house prices) with SHAP"}, {"id": "p10:72eff19c", "text": "Weeks 11-12: Project 7 - churn / classification with calibration + business recommendation"}, {"id": "p10:69ab8448", "text": "TEACH: record a 3-minute English explanation of one ML concept each week"}], "maps": ["ml", "ds", "math"], "project": "Two end-to-end ML projects", "exit": "2+ ML projects with proper evaluation, and I can explain the math behind them."}, {"id": "p11", "months": [16, 18], "stage": 2, "title": "Spark, time series, Kaggle + Project 8", "goal": "Handle big data and more ML problem types.", "tasks": [{"id": "p11:dd0ed20f", "text": "PySpark: DataFrames, joins, windows, partitioning"}, {"id": "p11:48971836", "text": "Spark tuning: shuffles, skew, broadcast joins, Spark UI"}, {"id": "p11:fb0b1eb2", "text": "Time series: decomposition, ARIMA, LightGBM with lags, walk-forward backtesting"}, {"id": "p11:e6b8088c", "text": "Anomaly detection basics"}, {"id": "p11:5b7f14c7", "text": "Recommendation systems basics"}, {"id": "p11:b183cc31", "text": "First Kaggle competition (Playground, for learning)"}, {"id": "p11:167275c0", "text": "Project 8 - PySpark batch job on 10M+ rows with documented tuning"}], "maps": ["de", "ml", "ds", "pro"], "project": "PySpark batch processing project", "exit": "Stage 2 done: pipeline, cloud deploy, ML projects, Spark."}, {"id": "p12", "months": [19, 22], "stage": 3, "title": "Deep learning + Project 9", "goal": "Understand and train neural networks.", "tasks": [{"id": "p12:e9eed380", "text": "Karpathy 'Neural Networks: Zero to Hero' (backprop from scratch)"}, {"id": "p12:f8a9ed66", "text": "PyTorch: tensors, autograd, nn.Module, DataLoader, training loops"}, {"id": "p12:b6f71660", "text": "CNNs, transfer learning (Stanford CS231n)"}, {"id": "p12:eddb37dc", "text": "RNN/LSTM/GRU, attention basics (CS224n)"}, {"id": "p12:05b423fe", "text": "Training tricks: normalization, dropout, schedulers, debugging"}, {"id": "p12:022f47d0", "text": "Project 9 - image or text classifier with PyTorch + web demo"}], "maps": ["ai", "math"], "project": "PyTorch classifier", "exit": "I can train, debug, and explain a neural network."}, {"id": "p13", "months": [23, 26], "stage": 3, "title": "NLP, transformers, LLMs, RAG + Project 10", "goal": "Build a measured, reliable RAG system.", "tasks": [{"id": "p13:c374f040", "text": "Transformers from scratch (nanoGPT)"}, {"id": "p13:5cd4a59a", "text": "Hugging Face: fine-tune BERT, tokenizers"}, {"id": "p13:0190b5a4", "text": "Prompt engineering with an evaluation set"}, {"id" const KEY = "career-tracker-v1";
const DEF = {theme:"light", fontScale:1, done:{}, custom:[], startDate:D.defaultStart, habits:{}, log:{}, weekly:{}, notes:{}, links:{},
  profile:"I work in IT at an MNC in India and I am learning data skills to become a Data Engineer / ML Engineer / Data Scientist. English is my second language, so please use simple, clear English and short sentences. Use general everyday examples (shops, schools, trains), not examples from my job. I study about 1 hour a day, I learn best practical-first (build something, then learn the theory), and I want to truly understand, not memorize."};
let S;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){ S = Object.assign({}, DEF); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function applyLook(){const r=document.documentElement;if(r&&r.setAttribute){r.setAttribute("data-theme",S.theme||"light");r.style.setProperty("--fs",String(S.fontScale||1));}}
applyLook();

const COLORS=["#2b4fd6","#6a2fd0","#357a70","#b84a22","#aa2d26","#b02d5e"];

const callout=(label,body,cls="")=>`<div class="callout ${cls}"><div class="lab">${esc(label)}</div><div class="txt">${body}</div></div>`;

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
const plain=s=>String(s).replace(/`/g,"").replace(/\*\*/g,"");
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};
const today=()=>iso(new Date());
const pct=(a,b)=>b?Math.round(100*a/b):0;
const pbar=(p,c="")=>`<div class="pbar ${c}"><i style="width:${p}%"></i></div>`;
const phaseSpan=p=>p.months[1]-p.months[0]+1;
const phaseLabel=p=>p.months[0]===p.months[1]?`Month ${p.months[0]}`:`Months ${p.months[0]}–${p.months[1]}`;
const phaseDone=p=>p.tasks.every(t=>S.done[t.id]);
const phaseFrac=p=>p.tasks.filter(t=>S.done[t.id]).length/p.tasks.length;
const stageNames={1:"Stage 1 · Foundations",2:"Stage 2 · Core Data + ML",3:"Stage 3 · Advanced AI"};

function elapsedMonths(){const st=new Date(S.startDate+"T00:00:00");return Math.min(36,Math.max(0,(new Date()-st)/86400000/30.44));}
function focusPhase(){return D.phases.find(p=>!phaseDone(p))||D.phases[D.phases.length-1];}
function journeyMonths(){return D.phases.reduce((a,p)=>a+phaseSpan(p)*phaseFrac(p),0);}

/* ---------- indexes ---------- */
const LESSONS=D.weeks.flatMap(w=>w.lessons);
const ITEMS={};
D.domains.forEach(d=>d.sections.forEach((s,si)=>s.items.forEach(it=>{ITEMS[it.id]={it,d,s,si};})));
function domainItems(d){return d.sections.flatMap(s=>s.items).concat(S.custom.filter(c=>c.domain===d.key));}
function domainProgress(d){const it=domainItems(d);const n=it.filter(i=>S.done[i.id]).length;return{n,total:it.length,p:pct(n,it.length)};}
function overall(){const it=D.domains.flatMap(domainItems);const n=it.filter(i=>S.done[i.id]).length;return{n,total:it.length,p:pct(n,it.length)};}
function stepIds(l){return l.rest?[`L${l.n}:r`]:[`L${l.n}:q`,`L${l.n}:b`,`L${l.n}:t`,`L${l.n}:s`];}
function lessonDone(l){return stepIds(l).every(i=>S.done[i]);}
function currentLessonIdx(){const l=LESSONS.find(x=>!lessonDone(x));return l?l.n:null;}
const PLAN=D.plan||[];
function wkDone(w){return w.tasks.every(t=>S.done[t.id]);}
function wkProg(w){const n=w.tasks.filter(t=>S.done[t.id]).length;return{n,total:w.tasks.length,p:pct(n,w.tasks.length)};}
function currentWeekIdx(){const i=PLAN.findIndex(w=>!wkDone(w));return i<0?PLAN.length-1:i;}
function weekRange(n){const st=new Date(S.startDate+"T00:00:00");const a=new Date(st);a.setDate(a.getDate()+(n-1)*7);const b=new Date(a);b.setDate(b.getDate()+6);const f=d=>d.toLocaleDateString(undefined,{day:"numeric",month:"short"});return `${f(a)} – ${f(b)}`;}
function linkTaskHtml(t){const d=!!S.done[t.id];const txt=fmt(t.text)+(t.href?` <a href="${esc(t.href)}" ${t.href.startsWith("#")?"":'target="_blank" rel="noopener"'} onclick="event.stopPropagation()" title="Open">↗</a>`:"");return `<label class="task ${d?"done":""}"><input type="checkbox" data-id="${t.id}" ${d?"checked":""}><span>${txt}</span></label>`;}
function lessonsDoneCount(){return LESSONS.filter(lessonDone).length;}
function projStepsDone(p){return p.steps.filter(i=>S.done[i]).length;}
function projDone(p){return projStepsDone(p)===p.steps.length;}
function habitScore(date){const h=S.habits[date]||{};return D.habits.filter(x=>h[x.id]).length;}
function streak(){let d=new Date(),n=0;const did=dt=>(S.habits[iso(dt)]||{}).study;if(!did(d))d.setDate(d.getDate()-1);while(did(d)){n++;d.setDate(d.getDate()-1);}return n;}
function longestStreak(){const ks=Object.keys(S.habits).filter(k=>S.habits[k].study).sort();let best=0,run=0,prev=null;ks.forEach(k=>{if(prev){const diff=(new Date(k)-new Date(prev))/86400000;run=diff===1?run+1:1;}else run=1;best=Math.max(best,run);prev=k;});return best;}

/* ---------- AI prompt builder ---------- */
const KINDS=[["teach","Teach me"],["practice","Practice"],["quiz","Quiz me"],["confused","I'm confused"],["review","Review my work"],["interview","Interview prep"],["project","Mini project"],["theory","Theory & math"],["plan","Study plan"]];
const LEVELS={new:"I am brand new to this topic. Assume I know nothing about it yet.",some:"I know a little about this topic. Fill my gaps, then go deeper.",ok:"I am fairly comfortable with this topic. Focus on depth, edge cases, and best practices."};
const ROLE="You are my patient, practical professor (think of an IIT/IISc teacher who loves real examples). Your goal is that I truly understand, not memorize.";
let P={ctx:null,kind:"teach",level:"new"};

function ctxBlock(c){
  const L=[];
  if(c.area)L.push(`Area: ${c.area}`);
  if(c.section)L.push(`Section: ${c.section}`);
  if(c.sub)L.push(`Group: ${c.sub}`);
  L.push(`Topic: ${c.topic}`);
  if(c.lesson){L.push(`Today's lesson: ${c.lesson.title}`);L.push(`What I am building today: ${c.lesson.build}`);L.push(`Question I want answered: ${c.lesson.ask}`);L.push(`Theory I planned to learn: ${c.lesson.learn}`);}
  if(c.hint)L.push(`Project idea: ${c.hint}`);
  if(c.notes)L.push(`Notes from my study guide: ${c.notes}`);
  if(c.items&&c.items.length)L.push(`Topics in this section:\n- ${c.items.join("\n- ")}`);
  return L.join("\n");
}
function buildPrompt(kind,c,level){
  const head=`${ROLE}\n\nABOUT ME\n${(S.profile||"").trim()}\n${LEVELS[level]}\n\nWHAT I WANT TO LEARN\n${ctxBlock(c)}\n\n`;
  const rules=`\nRULES\n- Use simple English and short sentences. Explain jargon the first time you use it.\n- Practical first: show it working, then give only the theory I need.\n- Never invent facts. If something depends on the tool or version, say so.\n- Be concise. Stop to check my understanding instead of writing everything at once.\n`;
  const T={
  teach:`TASK: Teach me this topic in small steps.\nUse this order, one step at a time, and ask "Ready for the next step?" before continuing:\n1. What it is, in 3 plain sentences, and why it matters in real jobs.\n2. The intuition using one everyday analogy (a shop, a school, a train station, a kitchen).\n3. The smallest example I can run myself. Give exact code or commands, then explain every line.\n4. Key terms: a short glossary of the words I must know.\n5. The 3 most common beginner mistakes and how to avoid or debug them.\n6. How this connects to what I should know before and after it.\n7. A 5-question check (do not show answers until I reply).\nIf the topic is broad, first list its sub-topics in the best learning order, then teach the first one.\nStart with step 1 only.`,
  practice:`TASK: Be my practice coach.\nCreate 8 exercises on this topic, ordered easy to hard (3 easy, 3 medium, 2 hard), each with a realistic scenario and sample data I can copy (or tell me where to get it).\nDo NOT show solutions. Give me exercise 1 only. After I answer: check it, explain any mistake in simple English, then give the next exercise.\nIf I am stuck, give hint level 1 (a nudge), then hint level 2 (more specific), and the solution only if I ask.\nAt the end, summarize my weak points and give a 15-minute review plan.`,
  quiz:`TASK: Quiz me.\nAsk ONE question at a time (mix definitions, "what will this output?", spot-the-bug, and short scenario questions). Wait for my answer.\nThen say correct / partly correct / incorrect, explain why in simple English, and show the ideal answer.\nIf I am right twice in a row, make questions harder. If I am wrong twice, go back to basics.\nAfter 10 questions, give my score, my weak areas, and exactly what to re-study.`,
  confused:`TASK: Help me with my confusion.\nWhat confuses me: [WRITE HERE: what you tried, what you expected, and what actually happened]\nFirst ask me up to 3 short questions to find exactly where my understanding breaks. Then explain using a different analogy than the usual one, show a tiny example, and ask me to PREDICT the result before you reveal it.\nFinally ask me to explain it back in my own words, and correct me gently.`,
  review:`TASK: Review my work like a kind senior mentor.\nMy work (code / query / answer / explanation):\n[PASTE YOUR WORK HERE]\n1. Does it work and answer the question correctly? Test it mentally with normal cases and edge cases.\n2. What is wrong or risky? List at most 5 points, most important first.\n3. How would a professional write it (readability, naming, performance)?\n4. Explain each suggestion with the reason, in simple English.\nDo not rewrite everything: show an improved version only for the single most important fix, and ask me to apply the rest myself.\nIf I wrote explanations in English, also show corrected versions of my sentences.`,
  interview:`TASK: Interview me on this topic.\nAct as an interviewer for a [Data Analyst / Data Engineer / Data Scientist / ML Engineer: choose one] role in India. Ask one question at a time, from basic to advanced (include 1-2 scenario questions).\nAfter each answer: give feedback on correctness, depth and clarity; show a model answer in clear, spoken-style English (3-6 sentences); suggest better phrases I can use.\nAfter 8 questions, summarize my strengths, gaps, and what to practise next.`,
  project:`TASK: Design a small hands-on project (1-3 hours) so I practise this topic.\nGive: the goal; a free dataset (name and where to download) or code to generate data; the steps as a checklist; the expected output; 3 stretch goals; and a README outline for GitHub.\nDo NOT write the solution. Guide me step by step only when I ask.\nUse a general, realistic dataset (shop orders, delivery times, exam marks).`,
  theory:`TASK: Explain the theory behind this topic "just in time".\nI have already seen it work in code. Now give me: the key idea; the simplest formula(s) or rules; a worked numeric example I can verify by hand; and how that example maps to the code.\nThen show me how to rebuild the core idea from scratch (plain Python / NumPy / SQL) in at most 40 lines.\nUse intuition first and mathematics second, and explain every symbol. Tell me what I can safely ignore for now.`,
  plan:`TASK: Make me a study plan for this section.\nList the topics in the best learning order (prerequisites first). For each topic give: estimated hours, what to BUILD (practical first), the one question I should be able to answer afterwards, and the theory to read just in time.\nGroup them into weeks assuming about 1 hour per day, 6 days a week. Mark which topics are essential now and which can wait.\nEnd with 5 mastery checks I can use to confirm that I really learned the section.`
  };
  return head+T[kind]+"\n"+rules;
}

function skillMatch(it){
  if(skillHide&&S.done[it.id])return false;
  if(skillQ&&!plain(it.text).toLowerCase().includes(skillQ))return false;
  return true;
}
function skillListHtml(key){
  const doms=skillQ?D.domains:[D.domains.find(d=>d.key===key)];
  let html="";
  doms.forEach(d=>{
    let any=false,sec="";
    d.sections.forEach((s,si)=>{
      const k=`${d.key}|${si}`;
      const its=s.items.filter(skillMatch),cus=S.custom.filter(c=>c.domain===d.key&&c.section===s.title&&skillMatch(c));
      if(!its.length&&!cus.length&&(skillQ||skillHide))return;
      any=true;
      const n=s.items.filter(i=>S.done[i.id]).length;
      const noteHtml=sub=>skillQ?"":((s.notes||{})[sub]||[]).map(x=>{const m=x.match(/^\*\*(.+?):?\*\*:?\s*(.*)$/);const lab=m?m[1].replace(/:$/,"").toUpperCase():"NOTE";const bad=/MISTAKE|PITFALL|WARNING/.test(lab);return callout(lab.slice(0,18),fmt(m?m[2]:x),bad?"red":(/INSIGHT|RULE|METHOD|WHY/.test(lab)?"cream":""));}).join("");
      const ex=(!skillQ&&!skillHide)?(s.extras||[]):[];
      let inner=noteHtml(""),last=null;
      const pushExtras=(i,fin)=>ex.filter(e=>fin?e.after>=i:e.after===i).forEach(e=>{
        if(e.sub!==last){if(e.sub)inner+=`<div class="subhead">${esc(e.sub)}</div>`+noteHtml(e.sub);last=e.sub;}
        inner+=`<div class="md">${e.html}</div>`;});
      s.items.forEach((it,i)=>{
        pushExtras(i,false);
        if(!skillMatch(it))return;
        if(it.sub!==last){if(it.sub)inner+=`<div class="subhead">${esc(it.sub)}</div>`+noteHtml(it.sub);last=it.sub;}
        const tag=it.kind==="project"?`<span class="tag project">project</span>`:it.kind==="test"?`<span class="tag test">mastery test</span>`:"";
        inner+=`<div class="itemrow">${taskHtml(it.id,it.text,tag)}<button class="ai" data-prompt-item="${it.id}" title="Get an AI prompt for this topic">✨</button></div>`;
      });
      pushExtras(s.items.length,true);
      cus.forEach(c=>{inner+=`<div class="itemrow">${taskHtml(c.id,c.text,'<span class="tag mine">mine</span>')}<button class="ai" data-prompt-item="${c.id}">✨</button><button class="x" data-del="${c.id}" title="Delete">×</button></div>`;});
      const open=openSecs.has(k)||!!skillQ;
      sec+=`<details data-sec="${k}" ${open?"open":""}><summary><span class="sm1">${esc(s.title)}</span><span class="mini"><i style="width:${pct(n,s.items.length)}%"></i></span><span class="cnt">${n}/${s.items.length}</span></summary>
        <div class="in"><div class="row" style="margin:0 6px 6px"><button class="btn ghost sm" data-prompt-sec="${d.key}|${si}">✨ Study-plan prompt for this section</button></div>${inner}
        <div class="row" style="margin:10px 4px 0;flex-wrap:nowrap"><input type="text" placeholder="Add something I missed here…" data-addin="${d.key}|${si}"><button class="btn sm" data-add="${d.key}|${si}">Add</button></div></div></details>`;
    });
    if(skillQ&&any)html+=`<h3 style="margin:16px 4px 8px">${d.icon} ${esc(d.title)}</h3>`;
    html+=sec;
  });
  return html||`<div class="empty">Nothing matches.</div>`;
}

  <div class="card"><h3>2. The consistency rules</h3><ul style="margin:6px 0 0 18px"><li><b>Minimum day:</b> 20 minutes of Build + one line in the log still counts.</li><li><b>Never miss twice.</b> One missed day is life. Two in a row is a new habit.</li><li><b>Same time, same place.</b> Use the calendar reminder in Settings.</li><li><b>Sunday = review + rest.</b> Rest is part of the plan.</li><li><b>Behind schedule?</b> Continue from where you stopped. Never restart.</li></ul></div>
  <div class="card"><h3>3. The learning loop</h3><p style="margin:4px 0 0"><b>Build</b> it first, badly → <b>Ask</b> what confused you → learn just that <b>theory</b> → <b>Rebuild</b> it yourself → <b>Teach</b> it in 3 lines. Theory without a problem to attach to doesn't stick. That's why the math comes inside the ML work, not before it.</p></div>
  <div class="card"><h3>4. Using AI as your tutor (the right way)</h3><ul style="margin:6px 0 0 18px"><li>Press <b>✨</b> beside any topic, lesson or project. Pick a tab (Teach, Practice, Quiz, I'm confused, Review, Interview…), copy, paste into any AI.</li><li><b>Try first, ask second.</b> Spend 15 minutes on your own before asking for help.</li><li>Ask for <b>hints</b>, not full solutions. Then explain the answer back in your own words.</li><li>AI can be wrong. Run the code. Check important facts in the official docs.</li><li>Never paste passwords, API keys, or private company data into an AI.</li></ul></div>
  <div class="card"><h3>5. When you're stuck</h3><ol style="margin:6px 0 0 18px"><li>Read the error message from the bottom up.</li><li>Shrink the problem: the smallest example that still fails.</li><li>Search the exact error text. Check the official docs.</li><li>Use the ✨ "I'm confused" prompt with what you tried.</li><li>Still stuck after 30 minutes? Write the question in your log, move on, return tomorrow.</li></ol></div>
  <div class="card"><h3>6. Weekly and monthly reviews</h3><p style="margin:4px 0 0"><b>Weekly (day 7):</b> what can I do now, what was hardest, what will I change. <b>Monthly:</b> tick the milestones in Roadmap → 36 months, count problems and projects, adjust the pace. Small honest adjustments beat heroic plans.</p></div>
  <div class="card"><h3>7. What "mastery" means here</h3><p style="margin:4px 0 0">You are done with a topic when you can <b>(1)</b> do it without help, <b>(2)</b> explain it simply, <b>(3)</b> spot a mistake in it, and <b>(4)</b> show a project that uses it. Skills are not for ticking quickly. Tick when it's true.</p></div>
  <div class="card"><h3>8. Your advantages and your focus</h3><p style="margin:4px 0 0">You already understand load, bottlenecks, and test results. Data work will feel familiar sooner than you think. Focus on one stage at a time. Comparing yourself with others is the only thing that can slow you down.</p></div>
  </div>`;
}

function pageSettings(){
  return `<h1>Settings</h1>
  <div class="grid g2">
  <div class="card"><p class="label">Reading mode</p><p class="note" style="margin-top:0">Light is easiest for long reading. Sepia is gentle on the eyes at night. Dark is optional. Study pages support Light and Sepia.</p>
    <div class="tabs">${[["light","☀️ Light (white)"],["sepia","📖 Sepia"],["dark","🌙 Dark"]].map(([k,t])=>`<button data-theme-set="${k}" class="${(S.theme||"light")===k?"on":""}">${t}</button>`).join("")}</div>
    <p class="note" style="margin:8px 0 4px">Text size: use the A− and A+ buttons (now ${Math.round((S.fontScale||1)*100)}%).</p></div>
  <div class="card"><p class="label">Start date</p><p class="note" style="margin-top:0">Used for the "today" marker and pace message. Changing it never deletes progress.</p><input type="date" id="start" value="${esc(S.startDate)}"></div>
  <div class="card"><p class="label">Daily reminder (calendar)</p><p class="note" style="margin-top:0">Download a repeating calendar event (Mon–Sat) and open it with Google/Apple/Outlook calendar.</p>
    <div class="row"><input type="time" id="rtime" value="20:00" style="width:140px"><button class="btn" id="ics">Download reminder (.ics)</button></div></div>
  <div class="card" style="grid-column:1/-1"><p class="label">About me (used in every AI prompt)</p><p class="note" style="margin-top:0">Edit this so the AI explains things at your level and in your style.</p>
    <textarea id="profile" style="min-height:120px">${esc(S.profile)}</textarea><div class="row" style="margin-top:8px"><button class="btn ghost sm" id="profreset">Reset to default</button></div></div>
  <div class="card"><p class="label">Backup</p><p class="note" style="margin-top:0">Progress is saved only in this browser (on this device and website address). Export a backup every month-end, and before clearing browser data. If you switch device, use Import.</p>
    <div class="row"><button class="btn" id="exp">Export progress</button><label class="btn ghost" style="cursor:pointer">Import progress<input type="file" id="imp" accept="application/json" hidden></label></div></div>
  <div class="card"><p class="label">Updating the content</p><p class="note" style="margin-top:0">All checklists come from the <code>.md</code> files; daily lessons and resources come from <code>tools/content.py</code>. After editing, run <code>python3 -I tools/build_site.py</code>, then commit and push the <code>docs</code> folder. Ticks are kept unless an item's wording changes.</p></div>
  <div class="card"><p class="label">Reset</p><p class="note" style="margin-top:0">Erase everything saved in this browser.</p><button class="btn danger" id="reset">Erase all progress</button></div></div>`;
}

const RENDER={map:pageMap,more:pageMore,home:pageHome,today:pageToday,study:pageStudy,roadmap:pageRoadmap,skills:pageSkills,projects:pageProjects,resources:pageResources,progress:pageProgress,guide:pageGuide,settings:pageSettings};
function render(){
  $("#snav").innerHTML=NAV.map(([k,t,i])=>`<a class="nav ${R.page===k?"on":""}" href="#/${k}"><span class="ic">${i}</span>${t}</a>`).join("");
  $("#tabbar").innerHTML=TABS.map(([k,t,i])=>{const on=R.page===k||(k==="more"&&["roadmap","projects","resources","progress","guide","settings"].includes(R.page));return `<a class="${on?"on":""}" href="#/${k}"><span>${i}</span>${t}</a>`;}).join("");
  const modeLbl=S.theme==="dark"?"🌙 Dark":S.theme==="sepia"?"📖 Sepia":"☀️ Light";
  $("#sfoot").innerHTML=`<div>🔥 ${streak()} day streak · ${overall().p}% skills</div><div class="row" style="margin-top:8px;gap:6px"><button class="btn ghost sm" data-cycle-theme title="Change reading mode">${modeLbl}</button><button class="btn ghost sm" data-fs="-" aria-label="Smaller text">A−</button><button class="btn ghost sm" data-fs="+" aria-label="Larger text">A+</button></div>`;
  const tb=$("#themebtn");if(tb)tb.textContent=S.theme==="dark"?"🌙":S.theme==="sepia"?"📖":"☀️";
  $("#main").innerHTML=RENDER[R.page]();
}
let SIDX=null;
function buildIndex(){
  SIDX=[];
  NAV.forEach(([k,t,i])=>SIDX.push({g:"Go to",t:`${i} ${t}`,a:{h:`#/${k}`}}));
  LESSONS.forEach(l=>SIDX.push({g:"Lesson",t:`Day ${l.n+1}: ${l.title}`,s:`Week ${l.week}`,a:{h:`#/today/${l.n}`}}));
  D.study.filter(d=>d.status==="ready").forEach(d=>d.chapters.forEach(c=>SIDX.push({g:"Study",t:`${c.label}: ${c.title}`,s:d.label,a:{u:`study/${d.key}/${c.page}`}})));
  D.topicMap.forEach(g=>g.items.forEach(it=>SIDX.push({g:"Topic",t:`${it.n}. ${it.name}`,s:g.domain,a:{h:"#/map"}})));
  D.projects.forEach(p=>SIDX.push({g:"Project",t:`#${p.n} ${p.title}`,s:p.track,a:{h:"#/projects"}}));
  D.domains.forEach(d=>d.sections.forEach(s=>s.items.forEach(it=>SIDX.push({g:"Skill",t:plain(it.text).slice(0,120),s:`${d.title} › ${s.title}`,a:{skill:d.key,q:plain(it.text).toLowerCase().slice(0,60)}}))));
  D.resources.forEach(g=>g.items.forEach(r=>SIDX.push({g:"Resource",t:r.title,s:r.note,a:{u:r.url,blank:true}})));
  SIDX.forEach((x,i)=>{x.i=i;x.k=(x.t+" "+(x.s||"")).toLowerCase();});
}
function runSearch(q){
  if(!SIDX)buildIndex();
  q=q.trim().toLowerCase();const box=$("#sres");
  if(!q){box.innerHTML=`<div class="empty">Type to search lessons, skills, study chapters, projects and resources.</div>`;return;}
  const toks=q.split(/\s+/);
  const hits=SIDX.filter(x=>toks.every(t=>x.k.includes(t)));
  const order=["Go to","Lesson","Study","Topic","Project","Skill","Resource"];let html="",shown=0;
  order.forEach(g=>{const hs=hits.filter(x=>x.g===g).slice(0,8);if(!hs.length)return;
    html+=`<div class="sgrp">${g}</div>`+hs.map(x=>`<button class="sit ${shown++===0?"first":""}" data-sidx="${x.i}">${esc(x.t)}${x.s?`<small>${esc(x.s)}</small>`:""}</button>`).join("");});
  box.innerHTML=html||`<div class="empty">No results for "${esc(q)}".</div>`;
}
function openSearch(){$("#sveil").classList.add("open");$("#smodal").classList.add("open");const i=$("#sinput");i.value="";runSearch("");setTimeout(()=>i.focus(),30);}
function closeSearch(){$("#sveil").classList.remove("open");$("#smodal").classList.remove("open");}
function goSearch(x){closeSearch();const a=x.a;
  if(a.h){location.hash=a.h;}
  else if(a.u){if(a.blank)window.open(a.u,"_blank","noopener");else location.href=a.u;}
  else if(a.skill){skillQ=a.q;const h=`#/skills/${a.skill}`;if(location.hash===h){R=parseRoute();render();}else location.hash=h;}}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);}
function pageMap(){
  const total=D.topicMap.reduce((a,g)=>a+g.items.length,0),done=D.topicMap.reduce((a,g)=>a+g.items.filter(i=>S.done[i.id]).length,0);
  return `<div class="phead"><div class="eyebrow">Topic map</div><h1>The ${total} topics of mastery</h1><p>${done} of ${total} truly learned. Tick a topic only when you can do it without help, explain it simply, and show a project that uses it.</p></div>
  <div class="card md"><p class="label">Target level for each priority</p><div class="tablewrap"><table class="data"><thead><tr><th>Priority</th><th>Areas</th><th>Level to reach</th></tr></thead><tbody>${D.mastery.map(m=>`<tr><td>${m.p}</td><td>${esc(m.areas)}</td><td><b>${esc(m.level)}</b></td></tr>`).join("")}</tbody></table></div></div>
  <div style="height:14px"></div>
  ${D.topicMap.map((g,gi)=>{const n=g.items.filter(i=>S.done[i.id]).length,key="tm|"+gi;
    const docs=g.docs.map(k=>D.study.find(x=>x.key===k)).filter(x=>x&&x.status==="ready");
    return `<details data-sec="${key}" ${openSecs.has(key)?"open":""} style="border-left-color:${COLORS[gi%6]}"><summary><span class="sm1">${gi+1}. ${esc(g.domain)}</span><span class="mini"><i style="width:${pct(n,g.items.length)}%"></i></span><span class="cnt">${n}/${g.items.length}</span></summary>
    <div class="in"><div class="row" style="margin:0 6px 8px"><a class="btn ghost sm" href="#/skills/${g.skill}">📖 Skill map</a>${docs.map(x=>`<a class="btn ghost sm" href="study/${x.key}/index.html">${x.icon} ${esc(x.label)}</a>`).join("")}</div>
    ${g.items.map(it=>`<div class="itemrow">${taskHtml(it.id,`**${it.n}.** ${it.name}`)}<button class="ai" data-prompt-topic="${it.id}" title="Get an AI prompt for this topic">✨</button></div>`).join("")}</div></details>`;}).join("")}`;
}
function pageMore(){
  return `<div class="phead"><div class="eyebrow">Menu</div><h1>More</h1><p>Everything else in your learning home.</p></div>
  <div class="grid g2 moregrid">${NAV.filter(n=>["roadmap","projects","resources","progress","guide","settings"].includes(n[0])).map(([k,t,i])=>`<div class="card" style="padding:0"><a href="#/${k}"><span style="font-size:24px">${i}</span>${t}</a></div>`).join("")}</div>`;
}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y);}

/* ---------- events ---------- */
window.addEventListener("hashchange",()=>{R=parseRoute();closePrompt();render();window.scrollTo(0,0);});

document.addEventListener("click",e=>{
  const q=e.target.closest("[data-cycle-theme],[data-fs],[data-theme-set],[data-jumpweek],#searchbtn,[data-sidx],#sveil,[data-stp],[data-stepdone],[data-stepundo],[data-timer],[data-welcome],[data-track],[data-prompt-topic]");
  if(q){
    const d=q.dataset;
    if(d.cycleTheme!==undefined){const order=["light","sepia","dark"];S.theme=order[(order.indexOf(S.theme||"light")+1)%3];save();applyLook();render();toast(`Reading mode: ${S.theme}`);return;}
    if(d.fs!==undefined){S.fontScale=Math.round(Math.min(1.4,Math.max(0.85,(S.fontScale||1)+(d.fs==="+"?0.05:-0.05)))*100)/100;save();applyLook();return;}
    if(d.themeSet!==undefined){S.theme=d.themeSet;save();applyLook();rerender();return;}
    if(d.jumpweek!==undefined){e.preventDefault();const w=PLAN[currentWeekIdx()],el=document.getElementById?document.getElementById("wk-"+w.n):null;if(el&&el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"center"});return;}
    if(q.id==="searchbtn"){openSearch();return;}
    if(q.id==="sveil"){closeSearch();return;}
    if(d.sidx!==undefined){goSearch(SIDX[+d.sidx]);return;}
    if(d.stp!==undefined){viewStep=+d.stp;rerender();return;}
    if(d.stepdone!==undefined){S.done[d.stepdone]=true;viewStep=null;afterStep(d.stepdone);save();rerender();return;}
    if(d.stepundo!==undefined){delete S.done[d.stepundo];const kk=d.stepundo.split(":")[1];viewStep=STEPS.findIndex(s=>s[0]===kk);save();rerender();return;}
    if(d.timer){if(d.timer==="toggle"){if(timer.running){timer.running=false;timer.left=Math.max(0,Math.round((timer.end-Date.now())/1000));}else{timer.running=true;timer.end=Date.now()+timer.left*1000;}}else{timer.running=false;timer.left=timer.mins*60;}rerender();return;}
    if(d.welcome!==undefined){S.seenWelcome=true;save();rerender();return;}
    if(d.track!==undefined){projTrack=d.track;rerender();return;}
    if(d.promptTopic!==undefined){for(const g of D.topicMap){const it=g.items.find(x=>x.id===d.promptTopic);if(it){showPrompt({title:it.name,topic:it.name,area:g.domain});break;}}return;}
  }
  const t=e.target.closest("[data-prompt-item],[data-prompt-sec],[data-prompt-lesson],[data-prompt-proj],[data-prompt-text],[data-mclose],[data-copy],[data-kind],[data-road],[data-add],[data-del],#exp,#reset,#ics,#profreset,#mveil");
  if(!t)return;
  const d=t.dataset;
  if(d.promptItem!==undefined){const c=ctxForItem(d.promptItem);if(c)showPrompt(c);}
  else if(d.promptSec!==undefined){const[k,si]=d.promptSec.split("|");showPrompt(ctxForSection(k,+si));}
  else if(d.promptLesson!==undefined){showPrompt(ctxForLesson(+d.promptLesson,d.kind));}
  else if(d.promptProj!==undefined){showPrompt(ctxForProject(+d.promptProj));}
  else if(d.promptText!==undefined){showPrompt({title:d.promptText.slice(0,90),topic:d.promptText,area:"Milestone"});}
  else if(t.hasAttribute("data-mclose")||t.id==="mveil"){closePrompt();}
  else if(t.hasAttribute("data-copy")){copyPrompt();}
  else if(t.closest("#mtabs")&&d.kind){P.kind=d.kind;renderPrompt();}
  else if(d.road){roadTab=d.road;rerender();}
  else if(d.add){const[dk,si]=d.add.split("|");const inp=$(`[data-addin="${d.add}"]`);const text=inp.value.trim();if(!text)return;const sec=D.domains.find(x=>x.key===dk).sections[+si];S.custom.push({id:"c:"+Date.now(),domain:dk,section:sec.title,text,kind:"custom"});openSecs.add(d.add);save();rerender();}
  else if(d.del){S.custom=S.custom.filter(c=>c.id!==d.del);delete S.done[d.del];save();rerender();}
  else if(t.id==="exp"){const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`career-progress-${today()}.json`;a.click();}
  else if(t.id==="reset"){if(confirm("Erase ALL saved progress in this browser? This cannot be undone.")){S=Object.assign({},DEF);save();rerender();}}
  else if(t.id==="profreset"){S.profile=DEF.profile;save();rerender();}
  else if(t.id==="ics"){downloadICS($("#rtime").value||"20:00");}
});

document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="mlevel"){P.level=t.value;renderPrompt();return;}
  if(d.id!==undefined){if(t.checked)S.done[d.id]=true;else delete S.done[d.id];save();rerender();return;}
  if(d.step!==undefined){
    if(t.checked)S.done[d.step]=true;else delete S.done[d.step];
    const k=today();S.habits[k]=S.habits[k]||{};
    const l=LESSONS[+d.step.slice(1).split(":")[0]],kind=d.step.split(":")[1];
    if(t.checked&&kind==="b")S.habits[k].practice=true;
    if(t.checked&&kind==="s"&&(S.log[k]||"").trim())S.habits[k].log=true;
    if(l&&lessonDone(l))S.habits[k].study=true;
    save();rerender();return;}
  if(d.habit){const k=today();S.habits[k]=S.habits[k]||{};if(t.checked)S.habits[k][d.habit]=true;else delete S.habits[k][d.habit];save();rerender();return;}
  if(t.id==="shide"){skillHide=t.checked;$("#skillList").innerHTML=skillListHtml(D.domains.some(x=>x.key===R.arg)?R.arg:D.domains[0].key);return;}
  if(t.id==="start"){if(t.value){S.startDate=t.value;save();render();}return;}
  if(t.id==="imp"){const f=t.files[0];if(!f)return;f.text().then(txt=>{try{S=Object.assign({},DEF,JSON.parse(txt));save();render();alert("Progress imported.");}catch(err){alert("That file isn't a valid backup.");}});return;}
  if(d.link){S.links[d.link]=t.value.trim();save();rerender();}
});

document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="sinput"){runSearch(t.value);return;}
  if(t.id==="log"){S.log[today()]=t.value;if(t.value.trim()){S.habits[today()]=S.habits[today()]||{};S.habits[today()].log=true;}save();}
  else if(t.id==="wk"){S.weekly[d.week]=t.value;save();}
  else if(d.pnote){S.notes[d.pnote]=t.value;save();}
  else if(t.id==="profile"){S.profile=t.value;save();}
  else if(t.id==="sq"){skillQ=t.value.trim().toLowerCase();const key=D.domains.some(x=>x.key===R.arg)?R.arg:D.domains[0].key;$("#skillList").innerHTML=skillListHtml(key);}
  else if(t.id==="rq"){$("#resList").innerHTML=resListHtml(t.value.trim());}
  else if(t.id==="jq"){jq=t.value.trim().toLowerCase();const el=$("#jlist");const logs=Object.keys(S.log).filter(k=>S.log[k].trim()).sort().reverse().filter(k=>!jq||S.log[k].toLowerCase().includes(jq));el.innerHTML=logs.length?logs.map(k=>`<div class="card" style="margin-bottom:8px"><b>${k}</b><p style="margin:4px 0 0;white-space:pre-wrap">${esc(S.log[k])}</p></div>`).join(""):`<div class="note">No matches.</div>`;}
});

document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||""));
  if(e.key==="/"&&!typing&&!e.metaKey&&!e.ctrlKey){e.preventDefault();openSearch();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch();return;}
  if(e.key==="Enter"&&e.target.id==="sinput"){const f=$("#sres .sit");if(f)f.click();return;}
  if(e.key==="Escape"){closePrompt();closeSearch();}
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.addin){const b=$(`[data-add="${e.target.dataset.addin}"]`);if(b)b.click();}
});

document.addEventListener("toggle",e=>{
  const d=e.target;if(d.dataset&&d.dataset.sec){if(d.open){openSecs.add(d.dataset.sec);openSecs.delete("closed|"+d.dataset.sec);}else{openSecs.delete(d.dataset.sec);openSecs.add("closed|"+d.dataset.sec);}}
},true);

function downloadICS(hhmm){
  const[h,m]=hhmm.split(":");const now=new Date();const pad=n=>String(n).padStart(2,"0");
  const d=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Career Journey//EN","BEGIN:VEVENT",`UID:career-${Date.now()}@journey`,`DTSTAMP:${d}T000000Z`,`DTSTART:${d}T${h}${m}00`,"DURATION:PT1H","RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR,SA","SUMMARY:Study hour (Career Journey)","DESCRIPTION:Open the Career Journey site → Today. Do the next lesson. Minimum day: 20 minutes.","BEGIN:VALARM","TRIGGER:-PT10M","ACTION:DISPLAY","DESCRIPTION:Study hour in 10 minutes","END:VALARM","END:VEVENT","END:VCALENDAR"];
  const blob=new Blob([L.join("\r\n")],{type:"text/calendar"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="career-study-hour.ics";a.click();
}

render();
</script>

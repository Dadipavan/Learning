<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b5bf0">
<title>My Career Journey</title>
<style>
:root{
  --bg:#f7f8fb;--card:#ffffff;--text:#1d2433;--muted:#5f6b80;--line:#e3e7ef;
  --accent:#4338ca;--accent-soft:#eef0ff;--ok:#047857;--ok-soft:#e2f5ec;--warn:#b45309;--warn-soft:#fff3dc;--bad:#c62828;--bad-soft:#fdeaea;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 18px rgba(17,24,39,.04);--r:14px;--fs:1;
}
[data-theme="sepia"]{--bg:#f4ecd8;--card:#fbf5e6;--text:#3b3226;--muted:#76695a;--line:#e3d6b8;--accent:#8a4b12;--accent-soft:#f1e3c4;--ok:#3f6b2a;--ok-soft:#e5ecd0;--warn:#a3590f;--warn-soft:#f6e3bd;--bad:#a63a2a;--bad-soft:#f3dcd2;--shadow:none}
[data-theme="dark"]{--bg:#10131d;--card:#181c2a;--text:#e8ebf7;--muted:#9aa3bd;--line:#2a3050;--accent:#8b87ff;--accent-soft:#242952;--ok:#4fd6a0;--ok-soft:#143a2d;--warn:#f2b54a;--warn-soft:#3b2e12;--bad:#ff7a70;--bad-soft:#3d1c1c;--shadow:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:calc(16px*var(--fs))/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}button{font:inherit;color:inherit}
code{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:.88em}
.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 90px}
/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;font-size:16px;white-space:nowrap;text-decoration:none;color:var(--text)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{padding:7px 13px;border-radius:99px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:600;font-size:14px}
nav a:hover{background:var(--accent-soft);color:var(--accent)}nav a.on{background:var(--accent);color:#fff}
.badge{font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted)}
/* headings */
h1{font-size:26px;line-height:1.25;margin:0 0 4px;letter-spacing:-.01em}h2{font-size:19px;margin:30px 0 6px}h3{margin:0 0 6px;font-size:16px}
.sub{color:var(--muted);margin:0 0 16px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 6px}
.note{color:var(--muted);font-size:13px}
.phead{margin:2px 0 18px}.phead .eyebrow{font-size:12px;letter-spacing:.1em;font-weight:700;color:var(--accent);text-transform:uppercase}
.phead h1{margin-top:4px}.phead p{margin:2px 0 0;color:var(--muted)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.hero .big{font-size:48px;font-weight:800;line-height:1;letter-spacing:-.03em;text-align:right}
.btn{border:0;background:var(--accent);color:#fff;padding:9px 16px;border-radius:10px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:13px}.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px;font-weight:700}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.mut{background:var(--line);color:var(--muted)}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}.pbar.ok i{background:var(--ok)}
.pmeta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin:5px 0 10px}
input[type=text],input[type=search],input[type=date],input[type=time],select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent)}textarea{min-height:90px;resize:vertical}
.chk{width:20px;height:20px;accent-color:var(--ok);cursor:pointer;flex:none}
.task{display:flex;gap:12px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer}
.task:hover{background:var(--accent-soft)}.task input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--ok);cursor:pointer}
.task.done span{color:var(--muted);text-decoration:line-through}
.itemrow{display:flex;align-items:flex-start;gap:4px}.itemrow .task{flex:1;min-width:0}
.ai{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 8px;cursor:pointer;font-size:13px;margin-top:6px;flex:none}
.ai:hover{border-color:var(--accent);background:var(--accent-soft)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 6px}.x:hover{color:var(--bad)}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;margin-left:8px;font-weight:700}
.tag.project{background:var(--warn-soft);color:var(--warn)}.tag.test{background:var(--ok-soft);color:var(--ok)}.tag.mine{background:var(--accent-soft);color:var(--accent)}
/* callouts */
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0;font-size:14px}
.callout .lab{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.callout.cream{border-color:var(--warn);background:var(--warn-soft)}.callout.cream .lab{color:var(--warn)}
.callout.red{border-color:var(--bad);background:var(--bad-soft)}.callout.red .lab{color:var(--bad)}
.callout.green{border-color:var(--ok);background:var(--ok-soft)}.callout.green .lab{color:var(--ok)}
.subhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 6px 2px}
/* lesson steps */
table.steps{border-collapse:separate;border-spacing:0 10px;width:100%;margin:-10px 0}
table.steps th,table.steps td{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 16px;vertical-align:top;text-align:left}
table.steps th{width:170px;border-left:1px solid var(--line);border-radius:var(--r) 0 0 var(--r);font-size:14px;color:var(--accent)}
table.steps td{border-right:1px solid var(--line);border-radius:0 var(--r) var(--r) 0}
table.steps th small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
table.steps tr.done th{color:var(--ok)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details>summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center;padding:12px 16px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";font-size:20px;color:var(--muted);transition:transform .15s;width:12px}details[open]>summary::before{transform:rotate(90deg)}
details .sm1{flex:1;font-weight:700;min-width:0}details .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
details .mini{width:70px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}details .mini i{display:block;height:100%;background:var(--ok)}
details .in{padding:2px 12px 14px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--muted);padding:7px 14px;font-weight:600;cursor:pointer}.seg .on{background:var(--accent);color:#fff}
.jbar{position:relative;display:flex;gap:3px;height:14px;margin-top:22px}.jseg{background:var(--line);border-radius:5px;overflow:hidden;position:relative}.jseg i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.jmark{position:absolute;top:-7px;width:3px;height:28px;background:var(--text);border-radius:3px}.jmark b{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:11px;background:var(--text);color:var(--bg);padding:1px 7px;border-radius:99px}
.jlab{display:flex;gap:3px;margin-top:8px;font-size:12px;color:var(--muted)}.jlab div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pace{margin-top:12px;font-size:13px;padding:8px 12px;border-radius:10px;background:var(--accent-soft)}.pace.ok{background:var(--ok-soft)}.pace.warn{background:var(--warn-soft)}
.res{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.res a{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:3px 11px;text-decoration:none;color:var(--text);background:var(--card)}.res a:hover{border-color:var(--accent);color:var(--accent)}
.habit{display:flex;gap:12px;align-items:center;padding:8px 0;cursor:pointer}.habit+.habit{border-top:1px solid var(--line)}
/* skill areas */
.area{display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);transition:transform .12s,border-color .12s}
.area:hover{transform:translateY(-2px);border-color:var(--c)}
.ring{position:relative;width:58px;height:58px;flex:none}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:8}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--c);stroke-linecap:round}.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:14px}
.area b{display:block;font-size:15px;line-height:1.25}.area small{color:var(--muted)}
.skl{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.side{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--text);font-weight:600;font-size:14px}
.side:hover{background:var(--accent-soft)}.side.on{background:var(--accent);color:#fff}.side small{margin-left:auto;opacity:.75}
.stick{position:sticky;top:70px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,16px);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:16px;height:16px;border-radius:4px;background:var(--line)}.heat i.l1{background:#bfe7d3}.heat i.l2{background:#7fd0aa}.heat i.l3{background:#3fb982}.heat i.l4{background:var(--ok)}
.stat .n{font-size:28px;font-weight:800}.stat .l{color:var(--muted);font-size:13px}
/* study library */
.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.doc .chips{display:flex;height:6px}.doc .chips i{flex:1}
.doc .top2{padding:16px 18px 0}.doc .top2 .e{color:var(--muted);font-size:12px;font-weight:700}
.doc .top2 h3{font-size:16px;margin:4px 0 0;line-height:1.3}
.doc .bd{padding:10px 18px 16px;flex:1;display:flex;flex-direction:column;gap:8px}
.doc .bd p{margin:0;font-size:13.5px;color:var(--muted)}
/* modal */
.mveil{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:30;display:none}
.modal{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:92vh;background:var(--card);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:none;flex-direction:column;overflow:hidden}
.mveil.open{display:block}.modal.open{display:flex}
.mh{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}.mh b{font-size:17px}
.mbody{padding:14px 20px;overflow:auto}.mctx{font-size:13px;color:var(--muted);margin-bottom:10px}.mctx b{color:var(--text)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13px;font-weight:600}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#mtext{min-height:300px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.mfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
@media(max-width:820px){.skl{grid-template-columns:1fr}.stick{position:static}.hero{grid-template-columns:1fr}.hero .big{text-align:left;font-size:38px}.badge{display:none}table.steps th{width:100px}}

/* app shell */
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:#fff;padding:8px 14px;z-index:99;border-radius:0 0 8px 0}.skip:focus{left:0}
.shell{display:flex;min-height:100vh}
.sidebar{width:232px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.sidebar .brand{padding:6px 10px 14px;font-size:17px;display:block}
.sidebar a.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--text);text-decoration:none;font-weight:600;font-size:14.5px}
.sidebar a.nav .ic{width:22px;text-align:center;font-size:17px}
.sidebar a.nav:hover{background:var(--accent-soft)}.sidebar a.nav.on{background:var(--accent);color:#fff}
.sidebar .grow{flex:1}.sidebar .foot{padding:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.content{flex:1;min-width:0}
.appbar{position:sticky;top:0;z-index:9;background:var(--bg);padding:14px 18px 6px;max-width:1040px;margin:0 auto;display:flex;gap:10px;align-items:center}
.appbar .mbrand{display:none;font-weight:800;text-decoration:none;color:var(--text);font-size:16px}
.searchbtn{flex:1;max-width:460px;display:flex;gap:8px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);cursor:pointer;font-size:14px}
.searchbtn:hover{border-color:var(--accent)}
kbd{margin-left:auto;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--bg)}
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:12;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0;display:flex;flex-direction:column;gap:1px;align-items:center}
.tabbar a span{font-size:21px;line-height:1.15}.tabbar a.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(18px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,a.btn,.btn{min-height:36px}
/* continue card + stat cards */
.continue{border-left:6px solid var(--accent)}
.continue h2{margin:2px 0 4px;font-size:22px}
.dots2{display:flex;gap:6px;margin:10px 0 14px}.dots2 i{width:34px;height:8px;border-radius:99px;background:var(--line)}.dots2 i.on{background:var(--ok)}
.stats .card{padding:14px 16px}
.welcome{background:linear-gradient(135deg,var(--accent-soft),var(--card));margin-bottom:14px}
.welcome ol{margin:6px 0 10px;padding-left:20px}.welcome li{margin:3px 0}
/* lesson stepper */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.stp{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center}
.stp .n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.stp b{display:block;font-size:13.5px;line-height:1.25}.stp small{color:var(--muted);font-size:12px}
.stp.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}.stp.done .n{background:var(--ok);color:#fff}
.stepbody{padding:20px 22px}.stepbody h2{margin:0 0 8px;font-size:20px}
.bigbtn{display:block;width:100%;padding:14px 18px;font-size:16px;border-radius:12px;margin-top:14px}
.timer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0;padding:10px 12px;background:var(--bg);border-radius:12px}
.timer .t{font:700 24px ui-monospace,Menlo,monospace;min-width:76px}
/* search modal */
.smodal{position:fixed;z-index:41;left:50%;top:12vh;transform:translateX(-50%);width:min(680px,94vw);max-height:76vh;background:var(--card);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:none;flex-direction:column;overflow:hidden}
.smodal.open{display:flex}
.smodal input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:17px}
.smodal input:focus{outline:none}
.sres{overflow:auto;padding:6px 8px 10px}
.sgrp{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.sit{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14.5px}
.sit:hover,.sit.first{background:var(--accent-soft)}.sit small{display:block;color:var(--muted);font-size:12px}
.moregrid a{display:flex;gap:12px;align-items:center;padding:14px 16px;text-decoration:none;color:var(--text);font-weight:700}
@media(max-width:900px){.sidebar{display:none}.tabbar{display:flex}.appbar .mbrand{display:block}.wrap{padding-bottom:120px}.searchbtn kbd{display:none}.stepper{grid-template-columns:repeat(2,1fr)}}
.md{margin:4px 6px 8px;font-size:14px}.md p{margin:6px 0}.md ul,.md ol{margin:6px 0 6px 22px;padding:0}.md li{margin:2px 0}
.md .tablewrap{overflow-x:auto;margin:8px 0}.md table.data{border-collapse:collapse;width:100%;font-size:13.5px}
.md table.data th{background:var(--accent);color:#fff;text-align:left;padding:7px 10px}.md table.data td{border-bottom:1px solid var(--line);padding:6px 10px;vertical-align:top}
.md table.data tbody tr:nth-child(even) td{background:var(--bg)}.md h3{margin:10px 0 4px;font-size:15px}.md h2{font-size:16px;color:var(--text);border:0;margin:12px 0 4px}
.md .callout{margin:8px 0}.md pre.code{background:#12182b;color:#a6f0ff;padding:10px 12px;overflow:auto;border-radius:8px;font-size:12.5px}
</style>
</head>
<body>
<a href="#main" class="skip">Skip to content</a>
<div class="shell">
  <aside class="sidebar"><a class="brand" href="#/home">🎯 Career Journey</a><div id="snav"></div><div class="grow"></div><div class="foot" id="sfoot"></div></aside>
  <div class="content">
    <div class="appbar"><a class="mbrand" href="#/home">🎯</a><button class="searchbtn" id="searchbtn" aria-label="Search everything">🔍 <span>Search lessons, skills, chapters…</span><kbd>/</kbd></button><button class="btn ghost sm" id="themebtn" data-cycle-theme aria-label="Change reading mode" title="Light / Sepia / Dark">☀️</button></div>
    <main class="wrap" id="main"></main>
  </div>
</div>
<div class="tabbar" id="tabbar" role="navigation" aria-label="Main"></div>
<div class="toast" id="toast" role="status"></div>
<div class="mveil" id="sveil"></div>
<div class="smodal" id="smodal" role="dialog" aria-modal="true" aria-label="Search"><input type="search" id="sinput" placeholder="Search lessons, skills, study chapters, resources…" autocomplete="off"><div class="sres" id="sres"></div></div>
<div class="mveil" id="mveil"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="AI prompt builder">
  <div class="mh"><b>✨ AI prompt</b><span class="note">Copy it and paste into ChatGPT, Claude, Gemini or any AI</span><div class="sp"></div><button class="btn ghost sm" data-mclose>✕ Close</button></div>
  <div class="mbody">
    <div class="mctx" id="mctx"></div>

const D = {"domains": [{"key": "prog", "file": "01_Programming_and_CS.md", "title": "Programming & CS", "icon": "💻", "sections": [{"title": "A. PYTHON — COMPLETE SKILL LIST", "items": [{"id": "prog:7ca48bc3", "text": "Types: int, float, complex, bool, str, bytes, None; mutability vs immutability; identity (`is`) vs equality (`==`)", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:997fb89d", "text": "Strings: slicing, f-strings, `format`, `split/join/strip/replace/find`, encoding (UTF-8), raw strings, `str` methods list", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:fa620ca2", "text": "Collections: list, tuple, set, frozenset, dict (ordering, `get`, `setdefault`, `items`, merge `|`), deque", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:1c74874c", "text": "Comprehensions: list, set, dict, generator expressions; nested comprehensions", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:764c55aa", "text": "Control flow: `if/elif/else`, `for`, `while`, `break/continue/else`, `match` (structural pattern matching), walrus `:=`", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:d815c552", "text": "Functions: positional/keyword args, defaults (mutable default pitfall), `*args/**kwargs`, keyword-only/positional-only, lambda, recursion, closures, scope (LEGB), `nonlocal/global`", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:0d695055", "text": "Iterators and generators: `iter/next`, `yield`, `yield from`, generator pipelines, lazy evaluation, memory benefits", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:c5d9f78e", "text": "Decorators: function decorators, with arguments, `functools.wraps`, class decorators; practical uses (timing, caching, retry, logging)", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:634a59e5", "text": "Context managers: `with`, `__enter__/__exit__`, `contextlib.contextmanager`", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:6cb95a85", "text": "Exceptions: `try/except/else/finally`, custom exceptions, raising/chaining, `logging.exception`, EAFP vs LBYL", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:7c6f6e0c", "text": "Modules and packages: imports, `__init__.py`, `__name__ == \"__main__\"`, relative imports, circular import avoidance", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:fa65585e", "text": "Type hints: `typing` (List, Dict, Optional, Union, Callable, TypeVar, Protocol), `mypy`, `pydantic` for validation", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:f2c6ef53", "text": "Memory model: references, shallow vs deep copy, garbage collection, `__slots__`, `sys.getsizeof`", "sub": "A1. Core language", "kind": "skill"}, {"id": "prog:c874656f", "text": "Classes, instances, `__init__`, `self`, class vs instance attributes", "sub": "A2. OOP in Python", "kind": "skill"}, {"id": "prog:0e4e8577", "text": "Dunder methods: `__repr__`, `__str__`, `__eq__`, `__hash__`, `__lt__`, `__len__`, `__getitem__`, `__iter__`, `__call__`, `__enter__`", "sub": "A2. OOP in Python", "kind": "skill"}, {"id": "prog:2fee5313", "text": "Inheritance, `super()`, MRO, multiple inheritance, mixins", "sub": "A2. OOP in Python", "kind": "skill"}, {"id": "prog:8eae66ef", "text": "Abstract base classes (`abc`), interfaces via Protocol", "sub": "A2. OOP in Python", "kind": "skill"}, {"id": "prog:64b7c50b", "text": "Properties (`@property`), `@classmethod`, `@staticmethod`", "sub": "A2. OOP in Python", "kind": "skill"}, {"id": "prog:dcda61d7", "text": "`dataclasses` (frozen, field, post_init), `NamedTuple`, `Enum`", "sub": "A2. OOP in Python", "kind": "skill"}, {"id": "prog:1ffbdd0c", "text": "Composition over inheritance; SOLID principles; common design patterns (see section D)", "sub": "A2. OOP in Python", "kind": "skill"}, {"id": "prog:374850e8", "text": "GIL: what it is and what it implies", "sub": "A4. Concurrency and performance", "kind": "skill"}, {"id": "prog:6c4c113b", "text": "Threads (I/O-bound), processes (CPU-bound), `asyncio` (many I/O tasks)", "sub": "A4. Concurrency and performance", "kind": "skill"}, {"id": "prog:a35bc6af", "text": "Profiling: `cProfile`, `timeit`, `line_profiler`, `memory_profiler`", "sub": "A4. Concurrency and performance", "kind": "skill"}, {"id": "prog:f96ab014", "text": "Vectorization over loops; Numba, Cython (awareness); multiprocessing for pandas workloads", "sub": "A4. Concurrency and performance", "kind": "skill"}, {"id": "prog:3b13db45", "text": "Environments: `venv`, `pip`, `pip-tools`, `poetry` or `uv`, `conda`", "sub": "A5. Tooling and professional practice", "kind": "skill"}, {"id": "prog:bb237264", "text": "Testing: `pytest` (fixtures, parametrize, mocking), coverage, TDD basics", "sub": "A5. Tooling and professional practice", "kind": "skill"}, {"id": "prog:143556c0", "text": "Code quality: `black`/`ruff` (format/lint), `mypy`, `pre-commit`", "sub": "A5. Tooling and professional practice", "kind": "skill"}, {"id": "prog:90f095fa", "text": "Logging, configuration (env vars, `.env`, YAML), secrets handling", "sub": "A5. Tooling and professional practice", "kind": "skill"}, {"id": "prog:998b8e18", "text": "Packaging: `pyproject.toml`, building a package, publishing to a private index", "sub": "A5. Tooling and professional practice", "kind": "skill"}, {"id": "prog:198926ef", "text": "Debugging: `pdb`, VS Code debugger, reading tracebacks", "sub": "A5. Tooling and professional practice", "kind": "skill"}, {"id": "prog:c0862eb4", "text": "Jupyter: notebooks vs scripts, `nbconvert`, reproducibility", "sub": "A5. Tooling and professional practice", "kind": "skill"}, {"id": "prog:59fc0d1e", "text": "Web/API in Python: `requests`, `httpx`, `FastAPI`, `Flask` basics, REST design, auth (API keys, OAuth/JWT basics)", "sub": "A5. Tooling and professional practice", "kind": "skill"}, {"id": "prog:669ba1bf", "text": "Scraping: `BeautifulSoup`, `Scrapy`, `Selenium`/`Playwright` (use responsibly, respect robots.txt and terms)", "sub": "A5. Tooling and professional practice", "kind": "skill"}, {"id": "prog:85fde919", "text": "Write a CLI tool with argparse, logging, tests, and a typed API", "sub": "Python mastery tests", "kind": "test"}, {"id": "prog:3f32d569", "text": "Build a small FastAPI service with a database and tests", "sub": "Python mastery tests", "kind": "test"}, {"id": "prog:cca9f6ba", "text": "Explain generators, decorators, GIL, and MRO without notes", "sub": "Python mastery tests", "kind": "test"}, {"id": "prog:56ede9ff", "text": "Solve 150+ Python/LeetCode problems", "sub": "Python mastery tests", "kind": "test"}], "extras": [{"sub": "A3. Standard library (know these well)", "after": 20, "html": "<p><code>os<\/code>, <code>pathlib<\/code>, <code>sys<\/code>, <code>json<\/code>, <code>csv<\/code>, <code>re<\/code> (regex — learn it deeply), <code>datetime<\/code>/<code>zoneinfo<\/code>, <code>collections<\/code> (Counter, defaultdict, deque, OrderedDict), <code>itertools<\/code> (chain, groupby, product, combinations, islice), <code>functools<\/code> (lru_cache, partial, reduce), <code>math<\/code>, <code>statistics<\/code>, <code>random<\/code>, <code>argparse<\/code>, <code>logging<\/code>, <code>subprocess<\/code>, <code>shutil<\/code>, <code>glob<\/code>, <code>tempfile<\/code>, <code>sqlite3<\/code>, <code>urllib<\/code>, <code>http<\/code>, <code>hashlib<\/code>, <code>uuid<\/code>, <code>time<\/code>, <code>copy<\/code>, <code>heapq<\/code>, <code>bisect<\/code>, <code>unittest<\/code>, <code>concurrent.futures<\/code>, <code>threading<\/code>, <code>multiprocessing<\/code>, <code>asyncio<\/code><\/p>"}], "notes": {}}, {"title": "B. SQL & DATABASES — COMPLETE SKILL LIST (primary dialect: PostgreSQL)", "items": [{"id": "prog:eca3c771", "text": "`SELECT`, `WHERE`, `ORDER BY`, `LIMIT/OFFSET`, `DISTINCT`, aliasing, operators (`IN`, `BETWEEN`, `LIKE/ILIKE`, `IS NULL`)", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:601db4c3", "text": "NULL semantics (three-valued logic, `COALESCE`, `NULLIF`)", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:f437d983", "text": "Aggregation: `COUNT(*)` vs `COUNT(col)` vs `COUNT(DISTINCT)`, `SUM/AVG/MIN/MAX`, `GROUP BY`, `HAVING`, `FILTER (WHERE …)`", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:6b348cd1", "text": "Joins: INNER, LEFT, RIGHT, FULL, CROSS, SELF, anti-join (`NOT EXISTS`, `LEFT JOIN … IS NULL`), semi-join (`EXISTS`), `LATERAL`", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:fc63b3e7", "text": "Set operations: `UNION`, `UNION ALL`, `INTERSECT`, `EXCEPT`", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:bf7a1247", "text": "Subqueries: scalar, correlated, derived tables, `IN` vs `EXISTS`", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:c10d5d37", "text": "CTEs, chained CTEs, **recursive CTEs** (hierarchies, graph traversal, date series)", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:35f297c1", "text": "`CASE WHEN`, conditional aggregation, manual pivot/unpivot", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:5c29f31b", "text": "`GROUPING SETS`, `ROLLUP`, `CUBE`", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:7126f5e2", "text": "Strings: `CONCAT`, `SUBSTRING`, `POSITION`, `REGEXP_*`, `SPLIT_PART`, `TRIM`, `LPAD`", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:154a6c0b", "text": "Dates/times: `DATE_TRUNC`, `EXTRACT`, intervals, time zones, `generate_series`, date arithmetic", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:a0fcc428", "text": "JSON/array columns: `->`, `->>`, `jsonb_*`, `UNNEST`, `ARRAY_AGG`, `STRING_AGG`", "sub": "B1. Querying", "kind": "skill"}, {"id": "prog:8d1491fe", "text": "Ranking: `ROW_NUMBER`, `RANK`, `DENSE_RANK`, `NTILE`, `PERCENT_RANK`", "sub": "B2. Window functions (a must-master area)", "kind": "skill"}, {"id": "prog:87f73cfb", "text": "Offset: `LAG`, `LEAD`, `FIRST_VALUE`, `LAST_VALUE`, `NTH_VALUE`", "sub": "B2. Window functions (a must-master area)", "kind": "skill"}, {"id": "prog:67d6c997", "text": "Aggregates over windows: running totals, moving averages, cumulative distribution", "sub": "B2. Window functions (a must-master area)", "kind": "skill"}, {"id": "prog:c2ad106d", "text": "Frames: `ROWS` vs `RANGE`, `UNBOUNDED PRECEDING`, `CURRENT ROW`", "sub": "B2. Window functions (a must-master area)", "kind": "skill"}, {"id": "prog:465d2e1f", "text": "Patterns: top-N per group, deduplication, gaps and islands, sessionization, YoY/MoM, retention", "sub": "B2. Window functions (a must-master area)", "kind": "skill"}, {"id": "prog:326e2d8d", "text": "`CREATE/ALTER/DROP`, data types, constraints (PK, FK, UNIQUE, CHECK, NOT NULL, DEFAULT)", "sub": "B3. Data definition and manipulation", "kind": "skill"}, {"id": "prog:11e478b7", "text": "`INSERT`, `UPDATE`, `DELETE`, `MERGE`/upsert (`ON CONFLICT`), `TRUNCATE`, `COPY`", "sub": "B3. Data definition and manipulation", "kind": "skill"}, {"id": "prog:d754d75b", "text": "Views, materialized views, temp tables, sequences/identity, schemas", "sub": "B3. Data definition and manipulation", "kind": "skill"}, {"id": "prog:1ca9a867", "text": "Indexes: B-tree, hash, GIN/GiST, composite index order, covering index, partial index, when NOT to index", "sub": "B4. Database internals and performance (my JMeter strength applies here)", "kind": "skill"}, {"id": "prog:e81ddc93", "text": "`EXPLAIN` / `EXPLAIN ANALYZE`: reading plans, seq scan vs index scan, join algorithms (nested loop, hash, merge)", "sub": "B4. Database internals and performance (my JMeter strength applies here)", "kind": "skill"}, {"id": "prog:eb1de587", "text": "Query optimization: sargable predicates, avoiding `SELECT *`, join order, statistics, `VACUUM/ANALYZE`", "sub": "B4. Database internals and performance (my JMeter strength applies here)", "kind": "skill"}, {"id": "prog:4e399b9f", "text": "Transactions: ACID, isolation levels (read committed, repeatable read, serializable), locks, deadlocks, MVCC", "sub": "B4. Database internals and performance (my JMeter strength applies here)", "kind": "skill"}, {"id": "prog:22906618", "text": "Partitioning, sharding, replication, connection pooling (pgbouncer), backup/restore", "sub": "B4. Database internals and performance (my JMeter strength applies here)", "kind": "skill"}, {"id": "prog:e75794d5", "text": "Stored procedures, functions, triggers (know when to avoid)", "sub": "B4. Database internals and performance (my JMeter strength applies here)", "kind": "skill"}, {"id": "prog:b0314d09", "text": "ER diagrams, normalization (1NF → BCNF), when to denormalize", "sub": "B5. Modeling", "kind": "skill"}, {"id": "prog:efe8bab3", "text": "OLTP vs OLAP; star/snowflake schemas; slowly changing dimensions (SCD 1/2/3)", "sub": "B5. Modeling", "kind": "skill"}, {"id": "prog:a5365c07", "text": "Surrogate vs natural keys, naming conventions, data types choice", "sub": "B5. Modeling", "kind": "skill"}, {"id": "prog:64ace195", "text": "MySQL, SQL Server (T-SQL), Oracle differences; BigQuery and Snowflake SQL dialects", "sub": "B6. Other databases (awareness → working)", "kind": "skill"}, {"id": "prog:5819b339", "text": "NoSQL: MongoDB (documents), Redis (cache), Cassandra (wide-column), Neo4j (graph), Elasticsearch (search)", "sub": "B6. Other databases (awareness → working)", "kind": "skill"}, {"id": "prog:213ec152", "text": "When to use which (CAP theorem, consistency models)", "sub": "B6. Other databases (awareness → working)", "kind": "skill"}, {"id": "prog:d4a25a0c", "text": "Solve 300+ SQL problems (50 hard) across LeetCode, StrataScratch, DataLemur", "sub": "SQL mastery tests", "kind": "test"}, {"id": "prog:ca15ef00", "text": "Optimize a slow query from 10s to <1s with `EXPLAIN ANALYZE`", "sub": "SQL mastery tests", "kind": "test"}, {"id": "prog:aab522c5", "text": "Design a schema for an e-commerce app and write all analytics queries for it", "sub": "SQL mastery tests", "kind": "test"}], "notes": {}}, {"title": "C. LINUX, SHELL, GIT", "items": [{"id": "prog:d4cf5966", "text": "Navigation/files: `ls cd pwd cp mv rm mkdir find locate du df ln tar zip`", "sub": "C1. Linux/shell", "kind": "skill"}, {"id": "prog:5b3ce4af", "text": "Text: `cat less head tail grep sed awk cut sort uniq wc tr xargs tee`; pipes and redirection", "sub": "C1. Linux/shell", "kind": "skill"}, {"id": "prog:d048ad50", "text": "Permissions/users: `chmod chown sudo`, groups", "sub": "C1. Linux/shell", "kind": "skill"}, {"id": "prog:898a3c04", "text": "Processes: `ps top htop kill nohup jobs bg fg`, systemd basics", "sub": "C1. Linux/shell", "kind": "skill"}, {"id": "prog:58d48ffa", "text": "Networking: `curl wget ssh scp rsync netstat ss ping dig`", "sub": "C1. Linux/shell", "kind": "skill"}, {"id": "prog:c3147ac5", "text": "Bash scripting: variables, conditionals, loops, functions, exit codes, `set -euo pipefail`, argument parsing", "sub": "C1. Linux/shell", "kind": "skill"}, {"id": "prog:0e9eb26e", "text": "Scheduling: `cron`; environment variables; `.bashrc/.zshrc`", "sub": "C1. Linux/shell", "kind": "skill"}, {"id": "prog:2cec86bb", "text": "Monitoring/logs: `journalctl`, `/var/log`, `vmstat`, `iostat`, `strace` (awareness)", "sub": "C1. Linux/shell", "kind": "skill"}, {"id": "prog:de1e8997", "text": "Daily: `init clone add commit push pull fetch status log diff branch checkout/switch merge`", "sub": "C2. Git/GitHub", "kind": "skill"}, {"id": "prog:23d945ad", "text": "Advanced: `rebase`, interactive rebase, `cherry-pick`, `stash`, `reset` vs `revert`, `bisect`, `reflog`, tags", "sub": "C2. Git/GitHub", "kind": "skill"}, {"id": "prog:546a7045", "text": "Workflows: feature branches, pull requests, code review, merge conflict resolution, Git Flow vs trunk-based", "sub": "C2. Git/GitHub", "kind": "skill"}, {"id": "prog:8648bba3", "text": "GitHub: Issues, Projects, Actions (CI), releases, branch protection, README/CONTRIBUTING", "sub": "C2. Git/GitHub", "kind": "skill"}], "notes": {}}, {"title": "D. OOP, SOFTWARE ENGINEERING, DESIGN", "items": [{"id": "prog:05fd9554", "text": "OOP four pillars + SOLID: Single responsibility, Open/closed, Liskov, Interface segregation, Dependency inversion", "sub": "", "kind": "skill"}, {"id": "prog:b0c4aa78", "text": "Design patterns: Singleton, Factory, Builder, Strategy, Observer, Decorator, Adapter, Repository, Dependency Injection", "sub": "", "kind": "skill"}, {"id": "prog:dc2fcf32", "text": "Clean code: naming, small functions, DRY, comments vs self-documenting code, refactoring", "sub": "", "kind": "skill"}, {"id": "prog:07ded7b7", "text": "Testing pyramid: unit, integration, end-to-end; mocks/fakes; test data", "sub": "", "kind": "skill"}, {"id": "prog:e5dcdbc6", "text": "CI/CD basics: GitHub Actions/Jenkins, build → test → lint → deploy", "sub": "", "kind": "skill"}, {"id": "prog:366280c4", "text": "APIs: REST, status codes, pagination, idempotency, versioning, OpenAPI, GraphQL awareness", "sub": "", "kind": "skill"}, {"id": "prog:33c5bac4", "text": "Architecture: monolith vs microservices, layered architecture, event-driven, message queues", "sub": "", "kind": "skill"}, {"id": "prog:25551c93", "text": "Software lifecycle: Agile/Scrum, estimation, documentation, code review culture, technical debt", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "E. DATA STRUCTURES & ALGORITHMS", "items": [{"id": "prog:97ef7a95", "text": "Complexity analysis: Big-O (time/space), amortized analysis", "sub": "Topics (with Python implementations)", "kind": "skill"}, {"id": "prog:c5bffed5", "text": "Arrays/strings: two pointers, sliding window, prefix sums, Kadane's algorithm", "sub": "Topics (with Python implementations)", "kind": "skill"}, {"id": "prog:bb897388", "text": "Hashing: hash maps/sets, counting, grouping, anagram/duplicates patterns", "sub": "Topics (with Python implementations)", "kind": "skill"}, {"id": "prog:d40ff17b", "text": "Sorting: merge, quick, heap, counting; custom comparators; binary search and search-on-answer", "sub": "Topics (with Python implementations)", "kind": "skill"}, {"id": "prog:9f1ab5ab", "text": "Linked lists, stacks, queues, deques, monotonic stack/queue", "sub": "Topics (with Python implementations)", "kind": "skill"}, {"id": "prog:5242cbf6", "text": "Heaps/priority queues, top-K problems", "sub": "Topics (with Python implementations)", "kind": "skill"}, {"id": "prog:30267f73", "text": "Trees: binary trees, BST, traversals (in/pre/post/level), LCA, tries", "sub": "Topics (with Python implementations)", "kind": "skill"}, {"id": "prog:c61d21c7", "text": "Graphs: BFS, DFS, connected components, topological sort, Dijkstra, union-find, minimum spanning tree (Kruskal/Prim)", "sub": "Topics (with Python implementations)", "kind": "skill"}, {"id": "prog:43668cf4", "text": "Recursion and backtracking: subsets, permutations, N-Queens", "sub": "Topics (with Python implementations)", "kind": "skill"}, {"id": "prog:d7a654ad", "text": "Dynamic programming: 1D/2D DP, knapsack, LIS, LCS, edit distance, DP on trees/grids", "sub": "Topics (with Python implementations)", "kind": "skill"}, {"id": "prog:b9120a5d", "text": "Greedy; intervals; bit manipulation; math/number theory basics", "sub": "Topics (with Python implementations)", "kind": "skill"}], "extras": [{"sub": "Targets", "after": 11, "html": "<div class=\"tablewrap\"><table class=\"data\"><thead><tr><th>Level<\/th><th>Problems<\/th><th>When<\/th><\/tr><\/thead><tbody><tr><td>Starter<\/td><td>80 easy/medium (arrays, hashing, strings, binary search)<\/td><td>Months 7-8<\/td><\/tr><tr><td>Solid<\/td><td>200 (add trees, graphs, heaps, DP intro)<\/td><td>Months 9-14<\/td><\/tr><tr><td>Interview-ready<\/td><td>300+ including 60+ hard<\/td><td>Ongoing, 2-3/week<\/td><\/tr><\/tbody><\/table><\/div>"}], "notes": {}}, {"title": "F. JAVA (optional — learn only if a job needs it)", "items": [{"id": "prog:19a93171", "text": "Syntax, OOP, collections, generics, streams, exceptions, concurrency, JVM basics, Maven/Gradle", "sub": "", "kind": "skill"}, {"id": "prog:0de0f103", "text": "Why it matters for data: Spark/Kafka/Hadoop are JVM-based; JMeter is Java (I already touch it)", "sub": "", "kind": "skill"}], "notes": {}}], "intro": "<p>Everything else stands on this. Languages: <strong>Python (primary)<\/strong>, SQL (primary), Bash. Java is optional. Level to target: <strong>Expert<\/strong> in Python + SQL, <strong>Strong<\/strong> in DSA/OOP/Git/Linux.<\/p>\n<hr/>"}, {"key": "analyst", "file": "02_Data_Analyst.md", "title": "Data Analyst", "icon": "📊", "sections": [{"title": "A. MICROSOFT EXCEL (Advanced)", "items": [{"id": "analyst:13717e7c", "text": "Navigation, tables (Ctrl+T), named ranges, structured references, absolute/relative references, shortcuts", "sub": "A1. Core and formulas", "kind": "skill"}, {"id": "analyst:6f16f6c1", "text": "Logical: `IF`, `IFS`, `AND`, `OR`, `NOT`, `IFERROR`, `SWITCH`", "sub": "A1. Core and formulas", "kind": "skill"}, {"id": "analyst:ebb94fca", "text": "Lookup: `XLOOKUP`, `VLOOKUP`, `HLOOKUP`, `INDEX+MATCH`, `XMATCH`", "sub": "A1. Core and formulas", "kind": "skill"}, {"id": "analyst:6815fea9", "text": "Math/stat: `SUM/SUMIFS`, `COUNT/COUNTIFS`, `AVERAGEIFS`, `MAX/MIN`, `LARGE/SMALL`, `RANK`, `ROUND`, `SUMPRODUCT`, `MEDIAN`, `STDEV`, `PERCENTILE`, `CORREL`, `FORECAST`", "sub": "A1. Core and formulas", "kind": "skill"}, {"id": "analyst:478334f2", "text": "Text: `LEFT/RIGHT/MID`, `LEN`, `FIND/SEARCH`, `SUBSTITUTE`, `TEXTJOIN`, `TEXTSPLIT`, `TRIM`, `UPPER/LOWER/PROPER`", "sub": "A1. Core and formulas", "kind": "skill"}, {"id": "analyst:cc0a413d", "text": "Date: `TODAY`, `EDATE`, `EOMONTH`, `DATEDIF`, `NETWORKDAYS`, `WEEKDAY`, `TEXT`", "sub": "A1. Core and formulas", "kind": "skill"}, {"id": "analyst:6acf8730", "text": "Dynamic arrays: `FILTER`, `SORT`, `SORTBY`, `UNIQUE`, `SEQUENCE`, `LET`, `LAMBDA`, `VSTACK/HSTACK`, `TAKE/DROP`", "sub": "A1. Core and formulas", "kind": "skill"}, {"id": "analyst:e649f436", "text": "Error handling and auditing: trace precedents, Evaluate Formula, `ISERROR`, `ISBLANK`", "sub": "A1. Core and formulas", "kind": "skill"}, {"id": "analyst:0b4ced0f", "text": "**PivotTables/PivotCharts**: grouping, calculated fields, slicers, timelines, show values as (% of total, running total, difference)", "sub": "A2. Analysis tools", "kind": "skill"}, {"id": "analyst:c67128a2", "text": "Conditional formatting, data bars, icon sets, sparklines", "sub": "A2. Analysis tools", "kind": "skill"}, {"id": "analyst:08a64a80", "text": "Data validation, dropdowns, protecting sheets", "sub": "A2. Analysis tools", "kind": "skill"}, {"id": "analyst:424ed9f6", "text": "What-if: Goal Seek, Scenario Manager, Data Tables, **Solver**", "sub": "A2. Analysis tools", "kind": "skill"}, {"id": "analyst:b3db5fe0", "text": "Statistics: Analysis ToolPak (regression, t-test, ANOVA, histogram)", "sub": "A2. Analysis tools", "kind": "skill"}, {"id": "analyst:a2b696f4", "text": "Charts: combo, waterfall, histogram, box plot, scatter with trendline; dashboard design", "sub": "A2. Analysis tools", "kind": "skill"}, {"id": "analyst:ded123d5", "text": "**Power Query**: import (CSV, Excel, web, SQL), clean, split/merge columns, pivot/unpivot, merge/append queries, custom columns (M language), parameters, folder import", "sub": "A3. Power Query and Power Pivot (the real power)", "kind": "skill"}, {"id": "analyst:899ef7b0", "text": "**Power Pivot/Data Model**: relationships, DAX measures (same DAX as Power BI)", "sub": "A3. Power Query and Power Pivot (the real power)", "kind": "skill"}, {"id": "analyst:95f8e2f6", "text": "Refresh and automation", "sub": "A3. Power Query and Power Pivot (the real power)", "kind": "skill"}, {"id": "analyst:489c7161", "text": "Macros recorder → **VBA** (loops, ranges, functions, user forms), Office Scripts, Python in Excel, `openpyxl`/`xlsxwriter` from Python", "sub": "A4. Automation (optional but valued)", "kind": "skill"}], "extras": [{"sub": "A4. Automation (optional but valued)", "after": 18, "html": "<p><strong>Excel mastery test:<\/strong> build a full dashboard from raw CSVs using Power Query + Pivot + slicers, no manual copy/paste, refreshable in one click.<\/p>"}], "notes": {}}, {"title": "B. SQL FOR ANALYTICS", "items": [{"id": "analyst:473ee797", "text": "Funnel analysis (step conversion), cohort retention tables, churn calculation", "sub": "", "kind": "skill"}, {"id": "analyst:8d185836", "text": "RFM segmentation (recency, frequency, monetary), customer lifetime value", "sub": "", "kind": "skill"}, {"id": "analyst:2493c939", "text": "Running totals, moving averages, YoY/MoM/WoW growth, period-over-period comparisons", "sub": "", "kind": "skill"}, {"id": "analyst:560d8786", "text": "Sessionization, gaps and islands, top-N per group, percentile calculations, median in SQL", "sub": "", "kind": "skill"}, {"id": "analyst:071fad3f", "text": "Pivot/unpivot, date spines (calendar tables), handling duplicates and late data", "sub": "", "kind": "skill"}, {"id": "analyst:4dc3363e", "text": "Data quality checks as queries (nulls, duplicates, referential integrity, outliers)", "sub": "", "kind": "skill"}, {"id": "analyst:906218fc", "text": "Writing readable, reusable SQL: CTE style, naming, comments, views", "sub": "", "kind": "skill"}], "extras": [{"sub": "", "after": 0, "html": "<p>(Fundamentals in <code>01_Programming_and_CS.md<\/code> section B.) Analytics patterns to master:<\/p>"}], "notes": {}}, {"title": "C. PYTHON FOR ANALYSIS — LIBRARIES AND WHAT TO KNOW IN EACH", "items": [{"id": "analyst:fed61b35", "text": "Data structures: `Series`, `DataFrame`, `Index`, `MultiIndex`, dtypes (`category`, `datetime64`, nullable types, `string[pyarrow]`)", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:d811fbaf", "text": "I/O: `read_csv` (dtype, parse_dates, usecols, chunksize), `read_excel`, `read_json`, `read_sql`, `read_parquet`, `to_*` equivalents", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:ea75cc04", "text": "Selecting: `loc`, `iloc`, boolean masks, `query`, `isin`, `between`, `filter`", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:f618eaf8", "text": "Cleaning: `isna/fillna/dropna`, `duplicated/drop_duplicates`, `astype`, `replace`, `str.*` methods, `to_datetime`, `to_numeric`, outlier detection (IQR, z-score), `clip`", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:079670f0", "text": "Transforming: `assign`, `apply/map/applymap`, vectorized ops, `where/mask`, `cut/qcut`, `pd.get_dummies`", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:a5a9eb59", "text": "Aggregating: `groupby` (agg with named aggregation, `transform`, `filter`, `apply`), `pivot_table`, `crosstab`, `value_counts`, `describe`, `rolling`, `expanding`, `ewm`, `cumsum`, `pct_change`, `shift`, `rank`", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:746c8acb", "text": "Combining: `merge` (all join types, `indicator`, validate), `concat`, `join`, `merge_asof`, `combine_first`", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:4f92d306", "text": "Reshaping: `melt`, `pivot`, `stack/unstack`, `explode`, `json_normalize`", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:3ffa8bbf", "text": "Time series: `resample`, `asfreq`, `dt.*` accessor, time zones, business calendars, rolling windows", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:7bf9dd21", "text": "Performance: avoid loops, vectorize, `category` dtype, `chunksize`, `pyarrow` backend, **Polars** and **DuckDB** as faster alternatives", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:ad59148a", "text": "Pitfalls: `SettingWithCopyWarning`, chained indexing, implicit type casting, memory use", "sub": "C1. pandas (the main tool; learn it deeply)", "kind": "skill"}, {"id": "analyst:a4b2c0ba", "text": "ndarray, dtypes, broadcasting, indexing/slicing, boolean masks, `where`, `argsort`, `unique`, aggregation with `axis`, random (`Generator`), linear algebra (`np.linalg`), vectorization", "sub": "C2. NumPy", "kind": "skill"}, {"id": "analyst:0d194e8d", "text": "**matplotlib**: figure/axes model, subplots, styling, annotations, saving high-res", "sub": "C3. Visualization libraries", "kind": "skill"}, {"id": "analyst:67423e29", "text": "**seaborn**: `histplot`, `kdeplot`, `boxplot`, `violinplot`, `scatterplot`, `heatmap`, `pairplot`, `catplot`, `lmplot`, FacetGrid", "sub": "C3. Visualization libraries", "kind": "skill"}, {"id": "analyst:17c29087", "text": "**plotly / plotly express**: interactive charts, dashboards; **Altair**; **Dash** or **Streamlit** for apps", "sub": "C3. Visualization libraries", "kind": "skill"}, {"id": "analyst:1a944470", "text": "Specialized: geospatial (`geopandas`, `folium`), network graphs (`networkx`), word clouds (awareness)", "sub": "C3. Visualization libraries", "kind": "skill"}, {"id": "analyst:80b29103", "text": "`scipy.stats` (t-tests, chi-square, normality tests, Mann-Whitney, ANOVA, correlation), `statsmodels` (OLS, logistic, ANOVA, time series, power analysis)", "sub": "C4. Statistics and analysis helpers", "kind": "skill"}, {"id": "analyst:16ebfe99", "text": "Profiling/EDA: `ydata-profiling`, `sweetviz`, `missingno`, `pandera`/`great_expectations` for validation", "sub": "C4. Statistics and analysis helpers", "kind": "skill"}, {"id": "analyst:d0ebf9e8", "text": "`SQLAlchemy`, `psycopg2`/`pyodbc`, `requests` (APIs), `BeautifulSoup`, `openpyxl`, `xlsxwriter`, `pyjanitor`, `schedule`/cron for scripts, email/Slack reporting from Python", "sub": "C5. Connectivity and automation", "kind": "skill"}], "extras": [{"sub": "C5. Connectivity and automation", "after": 19, "html": "<p><strong>Python-for-analysis mastery test:<\/strong> given an unknown messy dataset, produce a clean notebook with profiling, cleaning, 10 insights, charts, and a 1-page summary, in under 4 hours.<\/p>"}], "notes": {}}, {"title": "D. POWER BI (and BI tools)", "items": [{"id": "analyst:076ab9e3", "text": "Connectors (Excel, CSV, SQL, SharePoint, web, APIs), query folding, parameters, functions", "sub": "D1. Data preparation (Power Query / M)", "kind": "skill"}, {"id": "analyst:fac108f6", "text": "Transformations: types, split/merge, pivot/unpivot, group by, merge/append, conditional/custom columns, error handling", "sub": "D1. Data preparation (Power Query / M)", "kind": "skill"}, {"id": "analyst:a3033a11", "text": "Incremental refresh, dataflows", "sub": "D1. Data preparation (Power Query / M)", "kind": "skill"}, {"id": "analyst:ffab0589", "text": "Star schema: fact vs dimension tables; avoid one big flat table", "sub": "D2. Data modeling (most important BI skill)", "kind": "skill"}, {"id": "analyst:c7249346", "text": "Relationships: cardinality (1:*, *:*), cross-filter direction, active/inactive, role-playing dimensions", "sub": "D2. Data modeling (most important BI skill)", "kind": "skill"}, {"id": "analyst:a68cdd03", "text": "Date table, hierarchies, calculated columns vs measures, performance impact, aggregations", "sub": "D2. Data modeling (most important BI skill)", "kind": "skill"}, {"id": "analyst:98099f99", "text": "Basics: measures vs columns, row context vs filter context, context transition", "sub": "D3. DAX (learn thoroughly)", "kind": "skill"}, {"id": "analyst:f85ca96a", "text": "Core: `CALCULATE`, `FILTER`, `ALL/ALLEXCEPT/ALLSELECTED`, `VALUES`, `DISTINCT`, `SELECTEDVALUE`, `RELATED/RELATEDTABLE`, `USERELATIONSHIP`, variables (`VAR/RETURN`)", "sub": "D3. DAX (learn thoroughly)", "kind": "skill"}, {"id": "analyst:8ae4e36f", "text": "Iterators: `SUMX`, `AVERAGEX`, `COUNTX`, `RANKX`, `TOPN`", "sub": "D3. DAX (learn thoroughly)", "kind": "skill"}, {"id": "analyst:8bb87d1d", "text": "Time intelligence: `DATESYTD`, `SAMEPERIODLASTYEAR`, `DATEADD`, `TOTALYTD`, `PARALLELPERIOD`, rolling averages, YoY/MoM", "sub": "D3. DAX (learn thoroughly)", "kind": "skill"}, {"id": "analyst:f2993b81", "text": "Patterns: percent of total, running total, ranking, dynamic segmentation, what-if parameters, calculation groups", "sub": "D3. DAX (learn thoroughly)", "kind": "skill"}, {"id": "analyst:eb35653a", "text": "Tools: DAX Studio, Tabular Editor, Performance Analyzer", "sub": "D3. DAX (learn thoroughly)", "kind": "skill"}, {"id": "analyst:4e3c12a1", "text": "Visuals: bar/column/line/area, scatter, matrix, tables, cards, KPI, gauge, map, decomposition tree, key influencers; custom visuals", "sub": "D4. Reports and delivery", "kind": "skill"}, {"id": "analyst:9270f037", "text": "Interactivity: slicers, drill-through, bookmarks, tooltips, field parameters, buttons, sync slicers", "sub": "D4. Reports and delivery", "kind": "skill"}, {"id": "analyst:ca7abec0", "text": "Design: layout grids, color theory, accessibility, consistent themes, storytelling", "sub": "D4. Reports and delivery", "kind": "skill"}, {"id": "analyst:d52c5df4", "text": "Service: workspaces, apps, row-level security (RLS), gateways, scheduled refresh, sharing, deployment pipelines, Copilot/Q&A", "sub": "D4. Reports and delivery", "kind": "skill"}, {"id": "analyst:b1dc9301", "text": "Governance: naming, documentation, certified datasets", "sub": "D4. Reports and delivery", "kind": "skill"}, {"id": "analyst:ecef0308", "text": "**Tableau** (calculated fields, LOD expressions, parameters, dashboards) — second BI tool", "sub": "D5. Other tools to know", "kind": "skill"}, {"id": "analyst:c8d8cc4f", "text": "Looker Studio (free, Google), Metabase/Superset (open-source), Qlik (awareness)", "sub": "D5. Other tools to know", "kind": "skill"}, {"id": "analyst:cb14af5c", "text": "Semantic layers/metrics stores (dbt metrics, LookML) — awareness", "sub": "D5. Other tools to know", "kind": "skill"}], "extras": [{"sub": "D5. Other tools to know", "after": 20, "html": "<p><strong>Certification:<\/strong> Microsoft <strong>PL-300<\/strong> (Power BI Data Analyst); optionally Tableau Desktop Specialist.<\/p>"}], "notes": {}}, {"title": "E. ANALYTICS CONCEPTS (the thinking part)", "items": [{"id": "analyst:7e970291", "text": "Descriptive (what happened), diagnostic (why), predictive (what will), prescriptive (what to do)", "sub": "E1. Types of analytics", "kind": "skill"}, {"id": "analyst:0f18f7df", "text": "Understand context/source/grain; shape, dtypes, memory", "sub": "E2. EDA (Exploratory Data Analysis) — step by step", "kind": "skill"}, {"id": "analyst:3f3ded31", "text": "Missing data: pattern, mechanism (MCAR/MAR/MNAR), treatment", "sub": "E2. EDA (Exploratory Data Analysis) — step by step", "kind": "skill"}, {"id": "analyst:ee2aa604", "text": "Univariate: distributions, skew, kurtosis, outliers", "sub": "E2. EDA (Exploratory Data Analysis) — step by step", "kind": "skill"}, {"id": "analyst:9433a460", "text": "Bivariate/multivariate: correlations, cross-tabs, grouped summaries, interactions", "sub": "E2. EDA (Exploratory Data Analysis) — step by step", "kind": "skill"}, {"id": "analyst:82c9e35d", "text": "Data quality: duplicates, inconsistent categories, impossible values, unit mismatches", "sub": "E2. EDA (Exploratory Data Analysis) — step by step", "kind": "skill"}, {"id": "analyst:ce3e5e6f", "text": "Hypotheses → checks → documented insights", "sub": "E2. EDA (Exploratory Data Analysis) — step by step", "kind": "skill"}, {"id": "analyst:ee34fb8f", "text": "KPI/metric design (north-star, input vs output metrics, guardrail metrics), SMART goals", "sub": "E3. Business analytics", "kind": "skill"}, {"id": "analyst:c430a821", "text": "Funnels, cohorts, retention, churn, LTV, CAC, ARPU, conversion, NPS, MRR/ARR", "sub": "E3. Business analytics", "kind": "skill"}, {"id": "analyst:afdebda7", "text": "Segmentation (RFM, behavioral, demographic), clustering for segmentation", "sub": "E3. Business analytics", "kind": "skill"}, {"id": "analyst:0a857267", "text": "Domain analytics: **product** (engagement, DAU/MAU, feature adoption), **marketing** (attribution, ROAS, campaign analysis), **sales** (pipeline, win rate, forecasting), **finance** (P&L, variance, budgeting), **operations/supply chain** (inventory, SLA), **HR** (attrition), **e-commerce**, **healthcare**, **banking/risk**", "sub": "E3. Business analytics", "kind": "skill"}, {"id": "analyst:d1047ae9", "text": "Pricing, forecasting basics, scenario analysis, unit economics", "sub": "E3. Business analytics", "kind": "skill"}, {"id": "analyst:53e8874d", "text": "Hypothesis, metrics, randomization unit, sample size/power calculation, duration", "sub": "E4. Experimentation (A/B testing)", "kind": "skill"}, {"id": "analyst:781e7f7c", "text": "Analysis: z-test/t-test, confidence intervals, p-values vs practical significance, multiple testing correction, CUPED variance reduction (awareness)", "sub": "E4. Experimentation (A/B testing)", "kind": "skill"}, {"id": "analyst:34f630f4", "text": "Pitfalls: peeking, novelty effect, Simpson's paradox, SRM (sample ratio mismatch), network effects", "sub": "E4. Experimentation (A/B testing)", "kind": "skill"}, {"id": "analyst:39671020", "text": "Quasi-experiments when randomization is impossible (difference-in-differences)", "sub": "E4. Experimentation (A/B testing)", "kind": "skill"}], "extras": [{"sub": "E5. Statistics for analysts", "after": 16, "html": "<ul><li>Full list in <code>03_Math_and_Statistics.md<\/code>; the analyst-critical subset is descriptive stats, distributions, sampling, confidence intervals, hypothesis tests, correlation vs causation, regression basics.<\/li><\/ul>"}], "notes": {}}, {"title": "F. COMMUNICATION AND DELIVERY (what makes a *top* analyst)", "items": [{"id": "analyst:c60de6f1", "text": "Ask the right questions: clarify the business problem before opening data", "sub": "", "kind": "skill"}, {"id": "analyst:281a7cc0", "text": "Data storytelling: headline → evidence → recommendation; one message per chart", "sub": "", "kind": "skill"}, {"id": "analyst:83bd41ca", "text": "Chart choice rules; removing clutter; color with purpose", "sub": "", "kind": "skill"}, {"id": "analyst:0e3f3fe1", "text": "Writing: concise reports, executive summaries, emails; documentation of definitions and assumptions", "sub": "", "kind": "skill"}, {"id": "analyst:942817e1", "text": "Presenting: structure, handling questions, admitting uncertainty honestly", "sub": "", "kind": "skill"}, {"id": "analyst:b0f60381", "text": "Stakeholder management: expectations, deadlines, saying \"it depends, here's why\"", "sub": "", "kind": "skill"}, {"id": "analyst:ad86dcbf", "text": "Reproducibility: version-controlled SQL/notebooks, data dictionaries", "sub": "", "kind": "skill"}], "notes": {}}, {"title": "G. PROJECT LIST (Data Analyst portfolio)", "items": [{"id": "analyst:d88d2553", "text": "JMeter results analysis (SQL + pandas + charts)", "sub": "", "kind": "project"}, {"id": "analyst:69dba943", "text": "Excel dashboard with Power Query + PivotTables", "sub": "", "kind": "project"}, {"id": "analyst:64fed3c9", "text": "Power BI sales dashboard (star schema, DAX time intelligence, RLS)", "sub": "", "kind": "project"}, {"id": "analyst:0877dfce", "text": "SQL case study: funnel + cohort retention on an e-commerce dataset", "sub": "", "kind": "project"}, {"id": "analyst:a5b1e53d", "text": "A/B test analysis with proper statistical reporting", "sub": "", "kind": "project"}, {"id": "analyst:50b9630a", "text": "RFM customer segmentation", "sub": "", "kind": "project"}, {"id": "analyst:ed38f319", "text": "Marketing or finance analytics case with business recommendations", "sub": "", "kind": "project"}, {"id": "analyst:bee58188", "text": "A written case study for each, published on GitHub/LinkedIn", "sub": "", "kind": "project"}], "notes": {}}, {"title": "H. INTERVIEW CHECKLIST (Analyst)", "items": [], "extras": [{"sub": "", "after": 0, "html": "<p>SQL (joins, window functions, retention), Excel scenarios, Power BI/DAX, statistics, metrics case questions (\"DAU dropped 10%—why?\"), A/B testing, data cleaning case, behavioral stories.<\/p>"}], "notes": {}}, {"title": "I. HOW I WILL BE \"THE BEST\" ANALYST", "items": [], "extras": [{"sub": "", "after": 0, "html": "<ul><li>Strong SQL (top skill), deep pandas, Power BI modeling + DAX, real statistics, business domain knowledge in one industry, and clear communication. Most analysts are weak at statistics and storytelling; being strong in both is the edge.<\/li><\/ul>"}], "notes": {}}], "intro": "<p>Role: turn raw data into decisions. Tools: <strong>SQL, Excel, Power BI, Python (pandas), statistics, storytelling<\/strong>. Level to target: <strong>Expert<\/strong>. This is also the fastest entry into data work (6-8 months to first job).<\/p>\n<hr/>"}, {"key": "math", "file": "03_Math_and_Statistics.md", "title": "Math & Statistics", "icon": "📐", "sections": [{"title": "A. LINEAR ALGEBRA", "items": [{"id": "math:424b2a29", "text": "Vectors: operations, dot product, norms (L1, L2, L∞), cosine similarity, projections, linear independence, basis", "sub": "", "kind": "skill"}, {"id": "math:51c4f203", "text": "Matrices: multiplication, transpose, inverse, determinant, trace, rank, identity/diagonal/symmetric/orthogonal matrices", "sub": "", "kind": "skill"}, {"id": "math:e21d572c", "text": "Systems of linear equations, Gaussian elimination, solution existence/uniqueness", "sub": "", "kind": "skill"}, {"id": "math:b8276f57", "text": "Vector spaces, subspaces, column space, null space", "sub": "", "kind": "skill"}, {"id": "math:4fc61690", "text": "Eigenvalues and eigenvectors, diagonalization, spectral theorem", "sub": "", "kind": "skill"}, {"id": "math:3ebfd5e3", "text": "**SVD** (singular value decomposition) and low-rank approximation", "sub": "", "kind": "skill"}, {"id": "math:025037e2", "text": "**PCA** derived from covariance matrix and SVD", "sub": "", "kind": "skill"}, {"id": "math:23424997", "text": "Matrix calculus basics (gradients of vector/matrix functions)", "sub": "", "kind": "skill"}, {"id": "math:f555aff1", "text": "Other decompositions: LU, QR, Cholesky", "sub": "", "kind": "skill"}, {"id": "math:5f1aa05a", "text": "Applications: linear regression (normal equation), embeddings, recommender systems (matrix factorization), attention in transformers (matrix products)", "sub": "", "kind": "skill"}], "extras": [{"sub": "", "after": 10, "html": "<ul><li>Resources: 3Blue1Brown <em>Essence of Linear Algebra<\/em>, Gilbert Strang MIT 18.06, <em>Mathematics for Machine Learning<\/em> (free book)<\/li><li>Mastery test: derive PCA by hand; implement SVD-based image compression and PCA in NumPy<\/li><\/ul>"}], "notes": {}}, {"title": "B. CALCULUS", "items": [{"id": "math:261c06a3", "text": "Limits, continuity, derivatives, rules (product, quotient, chain)", "sub": "", "kind": "skill"}, {"id": "math:5d59c2a7", "text": "Partial derivatives, gradients, Jacobian, Hessian", "sub": "", "kind": "skill"}, {"id": "math:5d61bd16", "text": "Integrals (definite/indefinite), integration by parts, multiple integrals (awareness)", "sub": "", "kind": "skill"}, {"id": "math:6d328979", "text": "Taylor series, approximation", "sub": "", "kind": "skill"}, {"id": "math:5a55d3ad", "text": "Chain rule in depth → **backpropagation**", "sub": "", "kind": "skill"}, {"id": "math:ef64d2d2", "text": "Optimization via derivatives: critical points, convexity, saddle points", "sub": "", "kind": "skill"}, {"id": "math:c3075e5a", "text": "Multivariate calculus, Lagrange multipliers", "sub": "", "kind": "skill"}], "extras": [{"sub": "", "after": 7, "html": "<ul><li>Mastery test: derive gradients of MSE, logistic loss, and softmax cross-entropy by hand; implement backprop for a 2-layer net in NumPy<\/li><\/ul>"}], "notes": {}}, {"title": "C. PROBABILITY THEORY", "items": [{"id": "math:f7591932", "text": "Sample spaces, events, axioms; counting (permutations, combinations)", "sub": "", "kind": "skill"}, {"id": "math:525c3de3", "text": "Conditional probability, independence, **Bayes' theorem**, law of total probability", "sub": "", "kind": "skill"}, {"id": "math:98b9adad", "text": "Random variables: discrete/continuous, PMF/PDF/CDF, expectation, variance, covariance, correlation", "sub": "", "kind": "skill"}, {"id": "math:92584f4d", "text": "Distributions: Bernoulli, Binomial, Geometric, Poisson, Uniform, Exponential, Normal, Gamma, Beta, Chi-square, Student's t, F, Multinomial, Dirichlet, Log-normal, Weibull", "sub": "", "kind": "skill"}, {"id": "math:a3931ddf", "text": "Joint, marginal, conditional distributions; multivariate normal", "sub": "", "kind": "skill"}, {"id": "math:9ec01406", "text": "Law of large numbers, **Central Limit Theorem**", "sub": "", "kind": "skill"}, {"id": "math:dcea82a9", "text": "Moment generating functions, transformations of variables", "sub": "", "kind": "skill"}, {"id": "math:85be75d9", "text": "Markov chains, Markov property, stationary distribution; Poisson processes (awareness); Markov chain Monte Carlo", "sub": "", "kind": "skill"}, {"id": "math:f6e66cd6", "text": "Information theory: entropy, cross-entropy, KL divergence, mutual information", "sub": "", "kind": "skill"}], "extras": [{"sub": "", "after": 9, "html": "<ul><li>Resources: Harvard Stat 110 (Joe Blitzstein, free), StatQuest<\/li><li>Mastery test: solve 100 probability problems; simulate CLT in code<\/li><\/ul>"}], "notes": {}}, {"title": "D. DESCRIPTIVE AND INFERENTIAL STATISTICS", "items": [{"id": "math:dbd5f3a8", "text": "Central tendency, spread (variance, std, IQR, MAD), skewness, kurtosis, percentiles", "sub": "D1. Descriptive", "kind": "skill"}, {"id": "math:8f735f09", "text": "Data types (nominal, ordinal, interval, ratio); visualization of distributions", "sub": "D1. Descriptive", "kind": "skill"}, {"id": "math:51368378", "text": "Correlation: Pearson, Spearman, Kendall; correlation ≠ causation; Simpson's paradox", "sub": "D1. Descriptive", "kind": "skill"}, {"id": "math:dccce90a", "text": "Sampling methods (random, stratified, cluster), sampling bias, standard error", "sub": "D2. Inferential", "kind": "skill"}, {"id": "math:b9c75df9", "text": "Estimation: point estimates, **confidence intervals**, bootstrap, maximum likelihood (MLE), method of moments", "sub": "D2. Inferential", "kind": "skill"}, {"id": "math:04c5668f", "text": "**Hypothesis testing**: null/alternative, test statistic, p-value, Type I/II errors, power, effect size (Cohen's d), one/two-tailed", "sub": "D2. Inferential", "kind": "skill"}, {"id": "math:91bace9c", "text": "Tests: z-test, one/two-sample t-test, paired t-test, chi-square (independence/goodness-of-fit), ANOVA (one/two-way, post-hoc Tukey), F-test, Shapiro-Wilk, Kolmogorov-Smirnov", "sub": "D2. Inferential", "kind": "skill"}, {"id": "math:91826ca9", "text": "Non-parametric: Mann-Whitney U, Wilcoxon signed-rank, Kruskal-Wallis, permutation tests", "sub": "D2. Inferential", "kind": "skill"}, {"id": "math:c97435ab", "text": "**Multiple testing**: Bonferroni, Holm, Benjamini-Hochberg (FDR)", "sub": "D2. Inferential", "kind": "skill"}, {"id": "math:e7cae1d9", "text": "Power analysis and sample size calculation", "sub": "D2. Inferential", "kind": "skill"}, {"id": "math:5634b59b", "text": "Bayesian inference: priors, likelihood, posterior, conjugate priors, credible intervals, Bayesian A/B testing; PyMC / Stan", "sub": "D2. Inferential", "kind": "skill"}, {"id": "math:3956e0da", "text": "Frequentist vs Bayesian thinking", "sub": "D2. Inferential", "kind": "skill"}], "notes": {}}, {"title": "E. STATISTICAL MODELLING", "items": [{"id": "math:7baf778c", "text": "**Linear regression**: assumptions (linearity, independence, homoscedasticity, normality of residuals), OLS derivation, R², adjusted R², F-test, t-tests on coefficients, multicollinearity (VIF), residual diagnostics, influential points (Cook's distance, leverage)", "sub": "", "kind": "skill"}, {"id": "math:7dda70a4", "text": "Regularization: Ridge, Lasso, Elastic Net (bias-variance)", "sub": "", "kind": "skill"}, {"id": "math:f3f0c9b6", "text": "**Generalized linear models**: logistic, Poisson, negative binomial, link functions, deviance", "sub": "", "kind": "skill"}, {"id": "math:9e4e5c87", "text": "Interpretation: odds ratios, marginal effects", "sub": "", "kind": "skill"}, {"id": "math:68cf29ab", "text": "Mixed-effects/hierarchical models (awareness → working)", "sub": "", "kind": "skill"}, {"id": "math:d12eddce", "text": "**Time series statistics**: stationarity, ACF/PACF, ARIMA/SARIMA, exponential smoothing, ADF test, decomposition", "sub": "", "kind": "skill"}, {"id": "math:551f6bef", "text": "**Survival analysis**: Kaplan-Meier, Cox proportional hazards (`lifelines`)", "sub": "", "kind": "skill"}, {"id": "math:bca074c1", "text": "Multivariate: PCA, factor analysis, discriminant analysis, MANOVA (awareness)", "sub": "", "kind": "skill"}, {"id": "math:9c34ffe6", "text": "Nonparametric/kernel methods: KDE, LOESS", "sub": "", "kind": "skill"}, {"id": "math:b537462a", "text": "Model selection: AIC, BIC, cross-validation", "sub": "", "kind": "skill"}], "extras": [{"sub": "", "after": 10, "html": "<ul><li>Libraries: <code>statsmodels<\/code>, <code>scipy.stats<\/code>, <code>pingouin<\/code>, <code>lifelines<\/code>, <code>PyMC<\/code>, <code>R<\/code> (optional, useful for stats-heavy roles)<\/li><\/ul>"}], "notes": {}}, {"title": "F. OPTIMIZATION TECHNIQUES", "items": [{"id": "math:a35a2b2e", "text": "Convex sets/functions, convex vs non-convex optimization", "sub": "", "kind": "skill"}, {"id": "math:3e163dc4", "text": "Gradient descent: batch, stochastic, mini-batch; learning rate; convergence", "sub": "", "kind": "skill"}, {"id": "math:091a6156", "text": "Variants: momentum, Nesterov, AdaGrad, RMSProp, **Adam/AdamW**, learning-rate schedules", "sub": "", "kind": "skill"}, {"id": "math:bb7e56b9", "text": "Second-order: Newton's method, quasi-Newton (L-BFGS)", "sub": "", "kind": "skill"}, {"id": "math:411e664a", "text": "Constrained optimization: Lagrange multipliers, KKT conditions, duality", "sub": "", "kind": "skill"}, {"id": "math:c6faafdd", "text": "Linear programming, integer programming, simplex, network flow (operations research; `PuLP`, `OR-Tools`, `scipy.optimize`, `cvxpy`)", "sub": "", "kind": "skill"}, {"id": "math:65240020", "text": "Hyperparameter optimization: grid, random, Bayesian (`Optuna`)", "sub": "", "kind": "skill"}, {"id": "math:94062379", "text": "Heuristics: genetic algorithms, simulated annealing (awareness)", "sub": "", "kind": "skill"}], "extras": [{"sub": "", "after": 8, "html": "<ul><li>Mastery test: implement GD, SGD, Adam from scratch; solve a resource allocation problem with LP<\/li><\/ul>"}], "notes": {}}, {"title": "G. WHEN TO LEARN EACH TOPIC (just in time, never in isolation)", "items": [], "extras": [{"sub": "", "after": 0, "html": "<p>Rule: learn the math <strong>when the practical work first needs it<\/strong>, then implement it in code the same week. Don't study this file top to bottom.<\/p>\n<div class=\"tablewrap\"><table class=\"data\"><thead><tr><th>Topic<\/th><th>Trigger (the practical work that needs it)<\/th><th>Approx. time<\/th><\/tr><\/thead><tbody><tr><td>Descriptive stats, distributions, probability basics<\/td><td>EDA on real data (Project 1/3)<\/td><td>Months 4-6<\/td><\/tr><tr><td>Hypothesis testing, confidence intervals<\/td><td>A/B test analysis (Project 3)<\/td><td>Month 6<\/td><\/tr><tr><td>Calculus: derivatives, gradients, gradient descent<\/td><td>First linear regression<\/td><td>Month 13<\/td><\/tr><tr><td>Probability, log-loss, Bayes<\/td><td>Logistic regression / classification<\/td><td>Month 13-14<\/td><\/tr><tr><td>Linear algebra: vectors, matrices, eigen, SVD<\/td><td>PCA, embeddings, recommenders<\/td><td>Month 14-15<\/td><\/tr><tr><td>Regularization, bias-variance, norms<\/td><td>Overfitting experiments<\/td><td>Month 14<\/td><\/tr><tr><td>Deeper probability, MLE, Bayesian<\/td><td>Model fitting questions, Bayesian A/B<\/td><td>Months 16-18<\/td><\/tr><tr><td>Statistical modelling (GLM, time series)<\/td><td>Forecasting / regression diagnostics<\/td><td>Months 16-18<\/td><\/tr><tr><td>Chain rule and backpropagation<\/td><td>First neural network<\/td><td>Month 19-20<\/td><\/tr><tr><td>Optimization (Adam, schedules), information theory<\/td><td>Deep learning training, cross-entropy/KL<\/td><td>Months 19-22<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Each topic gets the loop: BUILD something → ASK what confused me → learn that theory → REBUILD from scratch in NumPy → TEACH it in 3 lines.<\/p>"}], "notes": {}}, {"title": "H. RESOURCES (free)", "items": [], "extras": [{"sub": "", "after": 0, "html": "<p>Khan Academy (Statistics, Linear Algebra, Calculus), 3Blue1Brown, StatQuest, MIT OCW (18.06, 18.05, 6.041), Harvard Stat 110, <em>Think Stats<\/em>, <em>Think Bayes<\/em>, <em>Mathematics for Machine Learning<\/em>, <em>An Introduction to Statistical Learning (ISLP)<\/em> — free PDF, <em>Statistical Rethinking<\/em> (Bayesian)<\/p>"}], "notes": {}}], "intro": "<p>Needed for: Data Science, ML, DL, research. Level to target: <strong>Advanced<\/strong> (strong working knowledge, not a pure-math degree). Rule: learn math <em>with<\/em> code. For every concept, implement it in NumPy and plot it.<\/p>\n<hr/>"}, {"key": "ds", "file": "04_Data_Science.md", "title": "Data Science", "icon": "🔬", "sections": [{"title": "A. WHAT A DATA SCIENTIST ACTUALLY DOES", "items": [{"id": "ds:ab7ac9aa", "text": "Know the role types: Data Analyst, Data Scientist (product/decision), Applied Scientist, ML Engineer, Research Scientist, Analytics Engineer, Decision Scientist, Quant. Know which I'm aiming for", "sub": "A1. The real job", "kind": "skill"}, {"id": "ds:6955cf0e", "text": "Understand how a data science team works with product, engineering, data engineering, and business owners", "sub": "A1. The real job", "kind": "skill"}, {"id": "ds:3085723a", "text": "Understand where DS creates value: decisions (analytics), automation (ML), personalization, forecasting, optimization, risk reduction", "sub": "A1. The real job", "kind": "skill"}, {"id": "ds:1769b1c7", "text": "Business understanding: who is the stakeholder, what decision will change, what does success look like in money/time/risk, what is the current baseline (often a simple rule or human process)", "sub": "A2. Project lifecycle (CRISP-DM and modern variants)", "kind": "skill"}, {"id": "ds:e0932d63", "text": "Translate a vague ask (\"reduce churn\") into a precise ML/analytics problem (predict 30-day churn of active users using data available at prediction time; act via retention offer)", "sub": "A2. Project lifecycle (CRISP-DM and modern variants)", "kind": "skill"}, {"id": "ds:6b6706c2", "text": "Define success metrics at three levels: business metric, model metric, and guardrail metrics (what must NOT get worse)", "sub": "A2. Project lifecycle (CRISP-DM and modern variants)", "kind": "skill"}, {"id": "ds:d4cbbe75", "text": "Always build the simplest baseline first (average, last value, rule of thumb, logistic regression) and measure the improvement over it", "sub": "A2. Project lifecycle (CRISP-DM and modern variants)", "kind": "skill"}, {"id": "ds:b77ed498", "text": "Feasibility check before building: is there enough data, signal, and an action that can be taken on the prediction?", "sub": "A2. Project lifecycle (CRISP-DM and modern variants)", "kind": "skill"}, {"id": "ds:4d5270f9", "text": "Write a one-page project brief: problem, users, data, metric, baseline, risks, timeline, how the result will be used", "sub": "A2. Project lifecycle (CRISP-DM and modern variants)", "kind": "skill"}, {"id": "ds:2997163c", "text": "Plan for deployment and monitoring from day one (see `07`)", "sub": "A2. Project lifecycle (CRISP-DM and modern variants)", "kind": "skill"}, {"id": "ds:e793cecb", "text": "Classification vs regression vs ranking vs clustering vs forecasting vs anomaly detection vs causal question vs optimization", "sub": "A3. Problem framing patterns", "kind": "skill"}, {"id": "ds:e6c0c9a8", "text": "Prediction vs explanation vs causation: do I need an accurate forecast, a reason, or the effect of an action?", "sub": "A3. Problem framing patterns", "kind": "skill"}, {"id": "ds:9001fd43", "text": "Define the **prediction time** and **label window** precisely (what do I know at prediction time? what outcome in the next N days?). This prevents leakage", "sub": "A3. Problem framing patterns", "kind": "skill"}, {"id": "ds:bd226289", "text": "Define the unit of analysis (user, session, order, device) and the **grain** of the dataset", "sub": "A3. Problem framing patterns", "kind": "skill"}], "notes": {"A1. The real job": ["**Why it matters:** Most of the job is not modeling. A typical project is about 60% understanding the problem and getting/cleaning data, 20% modeling, 20% communicating and getting the result used. Beginners over-invest in algorithms and under-invest in framing and communication.", "**Common mistake:** Building a clever model nobody asked for, or one that answers a question the business doesn't have. A model that isn't used creates zero value."], "A2. Project lifecycle (CRISP-DM and modern variants)": ["**Why it matters:** A repeatable process stops you from skipping steps. CRISP-DM is the classic: business understanding → data understanding → data preparation → modeling → evaluation → deployment, looping back often. Real projects loop many times."], "A3. Problem framing patterns": ["**Insight:** The same business question can be framed several ways. \"Which customers will leave?\" can be classification (will churn in 30 days?), survival analysis (time until churn), or uplift modeling (who will respond to an offer?). The framing decides the data, model, and value."]}}, {"title": "B. DATA COLLECTION, QUALITY, AND LABELING", "items": [{"id": "ds:fa28aff7", "text": "Identify data sources: operational databases, event logs/clickstream, data warehouse, third-party/APIs, surveys, sensors, public datasets, manual lab

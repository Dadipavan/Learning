<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="sans-serif" font-size="13">
<rect width="640" height="220" fill="#ffffff"/>
<text x="20" y="24" font-weight="bold">Fine-tuning a pretrained CNN: what is frozen, what learns</text>
<g stroke="#334" stroke-width="1.5">
<rect x="20" y="60" width="90" height="60" fill="#cfd8dc"/>
<rect x="130" y="60" width="90" height="60" fill="#cfd8dc"/>
<rect x="240" y="60" width="90" height="60" fill="#b0bec5"/>
<rect x="350" y="60" width="90" height="60" fill="#90a4ae"/>
<rect x="470" y="60" width="150" height="60" fill="#ffcc80"/>
</g>
<g text-anchor="middle">
<text x="65" y="86">stem</text><text x="65" y="104">edges</text>
<text x="175" y="86">stage 1-2</text><text x="175" y="104">textures</text>
<text x="285" y="86">stage 3</text><text x="285" y="104">parts</text>
<text x="395" y="86">stage 4</text><text x="395" y="104">objects</text>
<text x="545" y="86">new head</text><text x="545" y="104">Linear(512, 5)</text>
</g>
<g stroke="#334" stroke-width="1.5"><path d="M110 90H130M220 90H240M330 90H350M440 90H470"/></g>
<text x="20" y="150" fill="#1a5276">Step A (small data): freeze the grey blocks, train only the orange head. LR 1e-3.</text>
<text x="20" y="172" fill="#1a5276">Step B (more data): unfreeze later blocks too, lower LR for earlier ones (8e-6 to 3e-4).</text>
<text x="20" y="194" fill="#1a5276">Left = general features (reuse them). Right = task-specific (change them).</text>
</svg>

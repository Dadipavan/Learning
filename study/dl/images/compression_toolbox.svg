<text x="310.0" y="106.0" text-anchor="middle" font-size="12" fill="#0f172a">Pruning</text>
<text x="310.0" y="122.0" text-anchor="middle" font-size="12" fill="#0f172a">remove weak weights,</text>
<text x="310.0" y="138.0" text-anchor="middle" font-size="12" fill="#0f172a">channels or heads</text>
<line x1="140" y1="117" x2="208" y2="118" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="410" y1="118" x2="500" y2="117" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="210" y="160" width="200" height="56" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="310.0" y="176.0" text-anchor="middle" font-size="12" fill="#0f172a">Distillation</text>
<text x="310.0" y="192.0" text-anchor="middle" font-size="12" fill="#0f172a">small student copies</text>
<text x="310.0" y="208.0" text-anchor="middle" font-size="12" fill="#0f172a">big teacher</text>
<line x1="140" y1="117" x2="208" y2="188" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="90" width="120" height="54" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="80.0" y="113.0" text-anchor="middle" font-size="13" fill="#0f172a">trained model</text>
<text x="80.0" y="129.0" text-anchor="middle" font-size="13" fill="#0f172a">(big, fp32)</text>
<rect x="210" y="20" width="200" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="310.0" y="36.0" text-anchor="middle" font-size="12" fill="#0f172a">Quantization</text>
<text x="310.0" y="52.0" text-anchor="middle" font-size="12" fill="#0f172a">smaller numbers</text>
<text x="310.0" y="68.0" text-anchor="middle" font-size="12" fill="#0f172a">fp32 → int8 / int4</text>
<line x1="140" y1="117" x2="208" y2="48" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="410" y1="48" x2="500" y2="117" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

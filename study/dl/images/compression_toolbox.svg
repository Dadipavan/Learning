<rect x="500" y="90" width="200" height="54" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="600.0" y="113.0" text-anchor="middle" font-size="13" fill="#0f172a">cheaper model:</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="sans-serif" font-size="13">
<rect width="640" height="260" fill="#ffffff"/>
<text x="20" y="24" font-weight="bold">An RNN unrolled over 3 time steps (the same weights W are used at every step)</text>
<g stroke="#37474f" stroke-width="1.5" fill="#e3f2fd">
<rect x="70" y="100" width="90" height="50" rx="6"/><rect x="270" y="100" width="90" height="50" rx="6"/><rect x="470" y="100" width="90" height="50" rx="6"/>
</g>
<g text-anchor="middle">
<text x="115" y="130">cell (tanh)</text><text x="315" y="130">cell (tanh)</text><text x="515" y="130">cell (tanh)</text>
<text x="115" y="215">x1 = 1.0</text><text x="315" y="215">x2 = 2.0</text><text x="515" y="215">x3 = -1.0</text>
<text x="115" y="62">h1</text><text x="315" y="62">h2</text><text x="515" y="62">h3</text>
<text x="215" y="92" fill="#1565c0">h1 passed on</text><text x="415" y="92" fill="#1565c0">h2 passed on</text>
<text x="30" y="92" fill="#1565c0">h0 = 0</text>
</g>
<g stroke="#37474f" stroke-width="1.5" fill="none">
<path d="M115 200V150M315 200V150M515 200V150"/>
<path d="M115 100V72M315 100V72M515 100V72"/>
<path d="M160 125H270M360 125H470M20 125H70"/>
</g>
<text x="20" y="245" fill="#37474f">Arrows going right carry the memory h. Backpropagation through time sends gradients along the same arrows, right to left.</text>
</svg>

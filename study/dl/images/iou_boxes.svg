<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="sans-serif" font-size="13">
<rect width="560" height="400" fill="#ffffff"/>
<text x="20" y="24" font-weight="bold">IoU of two boxes: overlap divided by union</text>
<!-- scale 5, offset (30,40): gt (10,10)-(50,50); pred (30,20)-(70,60) -->
<rect x="80" y="90" width="200" height="200" fill="#bbdefb" fill-opacity="0.7" stroke="#1565c0" stroke-width="2"/>
<rect x="180" y="140" width="200" height="200" fill="#ffe0b2" fill-opacity="0.7" stroke="#e65100" stroke-width="2"/>
<rect x="180" y="140" width="100" height="150" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
<text x="84" y="108" fill="#1565c0">ground truth (10,10,50,50)</text>
<text x="184" y="332" fill="#e65100">prediction (30,20,70,60)</text>
<text x="190" y="220" fill="#1b5e20">overlap</text>
<text x="190" y="238" fill="#1b5e20">20 x 30 = 600</text>
<text x="400" y="120">areas: 1600 and 1600</text>
<text x="400" y="145">union = 1600 + 1600 - 600</text>
<text x="400" y="165">      = 2600</text>
<text x="400" y="195" font-weight="bold">IoU = 600 / 2600 = 0.2308</text>
<text x="400" y="230">0 = no overlap</text>
<text x="400" y="250">1 = identical boxes</text>
<text x="400" y="270">0.5 = usual "correct" bar</text>
</svg>

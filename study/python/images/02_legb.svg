<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="14">
  <rect width="640" height="330" fill="#ffffff"/>
  <rect x="20" y="20" width="600" height="290" rx="10" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="34" y="44" fill="#222" font-weight="bold">B  Built-in: len, print, max ...</text>
  <rect x="50" y="60" width="540" height="235" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="64" y="84" fill="#222" font-weight="bold">G  Global (the file): x, counter, make_counter ...</text>
  <rect x="80" y="100" width="480" height="180" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="94" y="124" fill="#222" font-weight="bold">E  Enclosing (outer function): count</text>
  <rect x="110" y="140" width="420" height="120" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="124" y="164" fill="#222" font-weight="bold">L  Local (inner function): its own names</text>
  <text x="124" y="200" fill="#222">Python looks for a name here first,</text>
  <text x="124" y="222" fill="#222">then moves outward: L, E, G, B.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="sans-serif" font-size="14">
  <rect width="700" height="260" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Names are sticky notes, objects live elsewhere</text>
  <rect x="30" y="60" width="70" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/><text x="55" y="82" fill="#222">a</text>
  <rect x="30" y="110" width="70" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/><text x="55" y="132" fill="#222">b</text>
  <rect x="30" y="180" width="70" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/><text x="55" y="202" fill="#222">c</text>
  <rect x="300" y="82" width="190" height="40" rx="6" fill="#fef3c7" stroke="#b45309"/><text x="318" y="107" fill="#222">list [1, 2, 3, 4]</text>
  <rect x="300" y="176" width="190" height="40" rx="6" fill="#dcfce7" stroke="#15803d"/><text x="318" y="201" fill="#222">list [1, 2, 3]</text>
  <line x1="100" y1="77" x2="298" y2="97" stroke="#444" stroke-width="2"/>
  <line x1="100" y1="127" x2="298" y2="107" stroke="#444" stroke-width="2"/>
  <line x1="100" y1="197" x2="298" y2="197" stroke="#444" stroke-width="2"/>
  <text x="510" y="100" fill="#222">a and b: same object</text>
  <text x="510" y="200" fill="#222">c: a separate copy</text>
</svg>

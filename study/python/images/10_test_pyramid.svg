<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="Testing pyramid">
  <polygon points="240,20 330,100 150,100" fill="#f4c7a1" stroke="#444"/>
  <polygon points="150,100 330,100 390,180 90,180" fill="#a8d5ba" stroke="#444"/>
  <polygon points="90,180 390,180 450,260 30,260" fill="#a9c8ee" stroke="#444"/>
  <text x="240" y="75" text-anchor="middle" font-size="14" font-family="sans-serif">End-to-end</text>
  <text x="240" y="145" text-anchor="middle" font-size="14" font-family="sans-serif">Integration</text>
  <text x="240" y="225" text-anchor="middle" font-size="14" font-family="sans-serif">Unit tests</text>
  <text x="470" y="60" text-anchor="end" font-size="12" font-family="sans-serif">few, slow, costly</text>
  <text x="470" y="275" text-anchor="end" font-size="12" font-family="sans-serif">many, fast, cheap</text>
</svg>

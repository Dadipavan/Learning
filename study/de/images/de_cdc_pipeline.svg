ly="Helvetica, Arial, sans-serif">apply MERGE</text><line x1="680" y1="90" x2="720" y2="90" stroke="#444" stroke-width="1.8" marker-end="url(#a)" /><rect x="720" y="60" width="135" height="60" rx="6" fill="#e8f0fe" stroke="#1a56a0" stroke-width="1.5"/><text x="787.5" y="86.0" text-anchor="middle" font-size="13" fill="#111" font-family="Helvetica, Arial, sans-serif">BI / ML</text><text x="787.5" y="102.0" text-anchor="middle" font-size="11" fill="#555" font-family="Helvetica, Arial, sans-serif">fresh tables</text><text x="20" y="160" text-anchor="start" font-size="12" fill="#222" font-family="Helvetica, Arial, sans-serif" >The database log (WAL / binlog) is the source of truth. CDC turns it into an ordered stream of inserts, updates, deletes.</text></svg>
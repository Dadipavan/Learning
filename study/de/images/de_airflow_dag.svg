<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="80" width="130" height="50" rx="6" fill="#e8f0fe" stroke="#1a56a0" stroke-width="1.5"/><text x="85.0" y="109.0" text-anchor="middle" font-size="13" fill="#111" font-family="Helvetica, Arial, sans-serif">extract</text><line x1="150" y1="105" x2="195" y2="105" stroke="#444" stroke-width="1.8" marker-end="url(#a)" /><rect x="195" y="80" width="130" height="50" rx="6" fill="#e8f0fe" stroke="#1a56a0" stroke-width="1.5"/><text x="260.0" y="109.0" text-anchor="middle" font-size="13" fill="#111" font-family="Helvetica, Arial, sans-serif">validate</text><line x1="325" y1="105" x2="370" y2="105" stroke="#444" stroke-width="1.8" marker-end="url(#a)" /><rect x="370" y="80" width="130" height="50" rx="6" fill="#e8f0fe" stroke="#1a56a0" stroke-width="1.5"/><text x="435.0" y="109.0" text-anchor="middle" font-size="13" fill="#111" font-family="Helvetica, Arial, sans-serif">transform</text><line x1="500" y1="105" x2="545" y2="105" stroke="#444" stroke-width="1.8" marker-end="url(#a)" /><rect x="545" y="80" width="130" height="50" rx="6" fill="#e8f0fe" stroke="#1a56a0" stroke-width="1.5"/><text x="610.0" y="109.0" text-anchor="middle" font-size="13" fill="#111" font-family="Helvetica, Arial, sans-serif">load</text><line x1="675" y1="105" x2="720" y2="105" stroke="#444" stroke-width="1.8" marker-end="url(#a)" /><rect x="720" y="80" width="130" height="50" rx="6" fill="#e8f0fe" stroke="#1a56a0" stroke-width="1.5"/><text x="785.0" y="109.0" text-anchor="middle" font-size="13" fill="#111" font-family="Helvetica, Arial, sans-serif">notify</text><text x="20" y="40" text-anchor="start" font-size="12" fill="#222" font-family="Helvetica, Arial, sans-serif" >DAG = tasks (boxes) + dependencies (arrows). One DAG run per schedule interval (data interval).</text><text x="20" y="170" text-anchor="start" font-size="12" fill="#222" font-family="Helvetica, Arial, sans-serif" >If transform fails: retry it; if still failing, load and notify are NOT run; fix and clear only transform.</text></svg>
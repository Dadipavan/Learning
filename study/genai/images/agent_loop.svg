<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"><title>The agent loop</title><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs><rect x="20" y="130" width="140" height="60" rx="8" fill="#fff4e0" stroke="#e8590c" stroke-width="1.5"/><text x="90.0" y="165.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">User task</text><rect x="250" y="40" width="200" height="60" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/><text x="350.0" y="67.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Model decides</text><text x="350.0" y="83.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">(reason)</text><rect x="250" y="230" width="200" height="60" rx="8" fill="#fff4e0" stroke="#e8590c" stroke-width="1.5"/><text x="350.0" y="257.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Run tool</text><text x="350.0" y="273.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">(your code)</text><rect x="530" y="130" width="150" height="60" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/><text x="605.0" y="165.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Final answer</text><line x1="160" y1="150" x2="250" y2="80" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><line x1="350" y1="100" x2="350" y2="230" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><text x="395" y="170" text-anchor="start" font-family="Arial" font-size="11" fill="#333">1. ask for a tool</text><line x1="300" y1="230" x2="300" y2="100" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><text x="285" y="170" text-anchor="end" font-family="Arial" font-size="11" fill="#333">2. result back</text><line x1="450" y1="70" x2="540" y2="130" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><text x="520" y="80" text-anchor="start" font-family="Arial" font-size="11" fill="#333">3. done?</text><text x="350" y="315" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Always: max steps, timeout, budget, and human approval for risky tools</text></svg>
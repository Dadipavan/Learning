<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><title>RAG pipeline: offline indexing and online answering</title><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs><text x="450" y="22" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Offline: build the index (once, then on updates)</text><rect x="20" y="35" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/><text x="90.0" y="62.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Documents</text><text x="90.0" y="78.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">PDF, HTML, DB</text><rect x="200" y="35" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/><text x="270.0" y="70.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Parse + clean</text><rect x="380" y="35" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/><text x="450.0" y="62.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Chunk</text><text x="450.0" y="78.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">(split)</text><rect x="560" y="35" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/><text x="630.0" y="62.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Embed</text><text x="630.0" y="78.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">(vectors)</text><rect x="740" y="35" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/><text x="810.0" y="62.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Vector index</text><text x="810.0" y="78.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">+ 
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240"><title>LoRA adds two thin matrices next to a frozen matrix</title><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs><rect x="20" y="40" width="200" height="160" rx="8" fill="#fff4e0" stroke="#e8590c" stroke-width="1.5"/><text x="120.0" y="109.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">W (frozen)</text><text x="120.0" y="125.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">4096 x 4096</text><text x="120.0" y="141.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">16.8 M numbers</text><text x="250" y="125" text-anchor="middle" font-family="Arial" font-size="30" fill="#333">+</text><rect x="280" y="40" width="50" height="160" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/><text x="305.0" y="109.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">B</text><text x="305.0" y="125.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">4096</text><text x="305.0" y="141.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">x r</text><text x="345" y="125" text-anchor="middle" font-family="Arial" font-size="20" fill="#333">x</text><rect x="360" y="95" width="160" height="50" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/><text x="440.0" y="125.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">A   r x 4096</text><text x="610" y="110" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">r = 16:</text><text x="610" y="130" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">131,072 trainable</text><text x="610" y="150" text-anchor="middle" font-family="Arial" font-size="13" fill="#333">= 0.78% of W</text><text x="350" y="225" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">Output = W x  +  (alpha / r) * B A x   (only A and B are trained)</text></svg>
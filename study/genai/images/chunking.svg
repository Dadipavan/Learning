<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250"><title>Fixed-size chunks versus structure-aware chunks</title><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs><text x="430" y="20" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">Same text, two ways to cut it</text><text x="20" y="50" text-anchor="start" font-family="Arial" font-size="12" fill="#333">Fixed size + overlap</text><rect x="20" y="60" width="190" height="40" rx="8" fill="#fff4e0" stroke="#e8590c" stroke-width="1.5"/><text x="115.0" y="85.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">chunk 1</text><rect x="170" y="60" width="190" height="40" rx="8" fill="#fff4e0" stroke="#e8590c" stroke-width="1.5"/><text x="265.0" y="85.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">chunk 2</text><rect x="320" y="60" width="190" height="40" rx="8" fill="#fff4e0" stroke="#e8590c" stroke-width="1.5"/><text x="415.0" y="85.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">chunk 3</text><rect x="470" y="60" width="190" height="40" rx="8" fill="#fff4e0" stroke="#e8590c" stroke-width="1.5"/><text x="565.0" y="85.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">chunk 4</text><text x="20" y="125" text-anchor="start" font-family="Arial" font-size="11" fill="#333">(boxes overlap 3 words; a cut can fall in the middle of a fact)</text><text x="20" y="160" text-anchor="start" font-family="Arial" font-size="12" fill="#333">Structure-aware (by heading)</text><rect x="20" y="170" width="380" height="50" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/><text x="210.0" y="200.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a"># Refund policy  (whole section)</text><rect x="420" y="170" width="420" height="50" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/><text x="630.0" y="200.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a"># Exceptions  (whole section)</text></svg>
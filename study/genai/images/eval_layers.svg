<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220"><title>Evaluate a RAG system layer by layer</title><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs><rect x="30.0" y="15" width="700" height="40" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/><text x="380.0" y="40.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Did retrieval find the right chunk?  recall@k, MRR</text><rect x="100.0" y="65" width="560" height="40" rx="8" fill="#fff4e0" stroke="#e8590c" stroke-width="1.5"/><text x="380.0" y="90.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Is the answer supported by the chunks?  faithfulness</text><rect x="170.0" y="115" width="420" height="40" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/><text x="380.0" y="140.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Does it answer the question?  correctness / relevance</text><rect x="240.0" y="165" width="280" height="40" rx="8" fill="#fff4e0" stroke="#e8590c" stroke-width="1.5"/><text x="380.0" y="190.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Is it fast and cheap enough?  latency, cost</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200"><title>A production LLM request path</title><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs><rect x="10" y="70" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/><text x="80.0" y="105.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Request</text><rect x="185" y="70" width="140" height="60" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/><text x="255.0" y="97.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Guardrails in</text><text x="255.0" y="113.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">(PII, injection)</text><rect x="360" y="70" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/><text x="430.0" y="105.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Router + cache</text><rect x="535" y="70" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#3b5bdb" stroke-width="1.5"/><text x="605.0" y="97.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Model / RAG /</text><text x="605.0" y="113.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">tools</text><rect x="710" y="70" width="140" height="60" rx="8" fill="#e6f4ea" stroke="#2b8a3e" stroke-width="1.5"/><text x="780.0" y="97.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Guardrails out</text><text x="780.0" y="113.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">+ log trace</text><line x1="150" y1="100" x2="185" y2="100" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><line x1="325" y1="100" x2="360" y2="100" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/><line x1="500" y1="100" x2="535" y2="100" st
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<clipPath id="cl0"><circle cx="85" cy="150" r="70"/></clipPath>
<clipPath id="cr0"><circle cx="155" cy="150" r="70"/></clipPath>
<clipPath id="cl1"><circle cx="330" cy="150" r="70"/></clipPath>
<clipPath id="cr1"><circle cx="400" cy="150" r="70"/></clipPath>
<clipPath id="cl2"><circle cx="575" cy="150" r="70"/></clipPath>
<clipPath id="cr2"><circle cx="645" cy="150" r="70"/></clipPath>
<clipPath id="cl3"><circle cx="820" cy="150" r="70"/></clipPath>
<clipPath id="cr3"><circle cx="890" cy="150" r="70"/></clipPath>
</defs>
<text x="120" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">INNER JOIN</text>
<circle cx="155" cy="150" r="70" fill="#2a7de1" fill-opacity="0.55" clip-path="url(#cl0)"/>
<circle cx="85" cy="150" r="70" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="155" cy="150" r="70" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<text x="55" y="154" text-anchor="middle" font-size="16" fill="#1a1a1a">A</text>
<text x="185" y="154" text-anchor="middle" font-size="16" fill="#1a1a1a">B</text>
<text x="120" y="255" text-anchor="middle" font-size="13" fill="#333333">Only rows that match on both</text>
<text x="120" y="273" text-anchor="middle" font-size="13" fill="#333333">sides</text>
<text x="365" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">LEFT JOIN</text>
<circle cx="330" cy="150" r="70" fill="#2a7de1" fill-opacity="0.55"/>
<circle cx="330" cy="150" r="70" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="400" cy="150" r="70" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<text x="300" y="154" text-anchor="middle" font-size="16" fill="#1a1a1a">A</text>
<text x="430" y="154" text-anchor="middle" font-size="16" fill="#1a1a1a">B</text>
<text x="365" y="255" text-anchor="middle" font-size="13" fill="#333333">All left rows, matches from</text>
<text x="365" y="273" text-anchor="middle" font-size="13" fill="#333333">the right (NULL if none)</text>
<text x="610" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">FULL JOIN</text>
<circle cx="575" cy="150" r="70" fill="#2a7de1" fill-opacity="0.55"/>
<circle cx="645" cy="150" r="70" fill="#2a7de1" fill-opacity="0.55"/>
<circle cx="575" cy="150" r="70" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="645" cy="150" r="70" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<text x="545" y="154" text-anchor="middle" font-size="16" fill="#1a1a1a">A</text>
<text x="675" y="154" text-anchor="middle" font-size="16" fill="#1a1a1a">B</text>
<text x="610" y="255" text-anchor="middle" font-size="13" fill="#333333">All rows from both sides</text>
<text x="855" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">LEFT ANTI-JOIN</text>
<circle cx="820" cy="150" r="70" fill="#2a7de1" fill-opacity="0.55"/>
<circle cx="890" cy="150" r="70" fill="#ffffff" clip-path="url(#cl3)"/>
<circle cx="820" cy="150" r="70" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="890" cy="150" r="70" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<text x="790" y="154" text-anchor="middle" font-size="16" fill="#1a1a1a">A</text>
<text x="920" y="154" text-anchor="middle" font-size="16" fill="#1a1a1a">B</text>
<text x="855" y="255" text-anchor="middle" font-size="13" fill="#333333">Left rows that have NO match</text>
<text x="855" y="273" text-anchor="middle" font-size="13" fill="#333333">on the right</text>
</svg>
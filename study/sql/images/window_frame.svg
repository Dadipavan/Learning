<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">Window frame: ROWS BETWEEN 1 PRECEDING AND CURRENT ROW</text>
<rect x="60" y="80" width="140" height="70" rx="6" fill="#f2f2f2" stroke="#999999" stroke-width="2"/>
<text x="130.0" y="108" text-anchor="middle" font-size="16" fill="#1a1a1a">Jan</text>
<text x="130.0" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">2260</text>
<rect x="220" y="80" width="140" height="70" rx="6" fill="#cfe3fb" stroke="#2a7de1" stroke-width="2"/>
<text x="290.0" y="108" text-anchor="middle" font-size="16" fill="#1a1a1a">Feb</text>
<text x="290.0" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">2520</text>
<rect x="380" y="80" width="140" height="70" rx="6" fill="#cfe3fb" stroke="#2a7de1" stroke-width="2"/>
<text x="450.0" y="108" text-anchor="middle" font-size="16" fill="#1a1a1a">Mar</text>
<text x="450.0" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">2980</text>
<rect x="540" y="80" width="140" height="70" rx="6" fill="#f2f2f2" stroke="#999999" stroke-width="2"/>
<text x="610.0" y="108" text-anchor="middle" font-size="16" fill="#1a1a1a">Apr</text>
<text x="610.0" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">4900</text>
<text x="450.0" y="68" text-anchor="middle" font-size="14" fill="#c0392b">current row</text>
<polygon points="444.0,74 456.0,74 450.0,80" fill="#c0392b"/>
<path d="M220 165 L220 175 L520 175 L520 165" fill="none" stroke="#2a7de1" stroke-width="2"/>
<text x="370.0" y="198" text-anchor="middle" font-size="14" fill="#1a1a1a">frame for the Mar row = Feb and Mar</text>
<text x="370.0" y="220" text-anchor="middle" font-size="14" fill="#1a1a1a">AVG = (2520 + 2980) / 2 = 2750</text>
<text x="380" y="270" text-anchor="middle" font-size="13" fill="#555555">Rows outside the frame (Jan, Apr) are ignored for this row. The frame slides one row at a time.</text>
</svg>
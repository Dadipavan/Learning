<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="sans-serif" font-size="14">
<rect width="640" height="200" fill="#fff"/>
<text x="20" y="28" font-weight="bold">Ready queue</text>
<rect x="20" y="40" width="50" height="40" fill="#dbeafe" stroke="#1d4ed8"/><text x="36" y="65">T3</text>
<rect x="75" y="40" width="50" height="40" fill="#dbeafe" stroke="#1d4ed8"/><text x="91" y="65">T4</text>
<rect x="130" y="40" width="50" height="40" fill="#dbeafe" stroke="#1d4ed8"/><text x="146" y="65">T5</text>
<line x1="185" y1="60" x2="275" y2="60" stroke="#111" stroke-width="2"/><polygon points="275,54 287,60 275,66" fill="#111"/>
<text x="285" y="28" font-weight="bold">CPU core</text>
<rect x="285" y="40" width="110" height="40" fill="#dcfce7" stroke="#15803d"/><text x="298" y="65">T1 running</text>
<line x1="395" y1="60" x2="465" y2="60" stroke="#111" stroke-width="2"/><polygon points="465,54 477,60 465,66" fill="#111"/>
<text x="475" y="28" font-weight="bold">Blocked</text>
<rect x="475" y="40" width="140" height="40" fill="#fee2e2" stroke="#b91c1c"/><text x="487" y="65">T2 waits for I/O</text>
<path d="M340 85 Q340 150 110 150 Q60 150 60 90" fill="none" stroke="#111" stroke-width="2"/><polygon points="54,92 60,80 66,92" fill="#111"/>
<text x="130" y="170">time slice ends: T1 goes to the back of the queue</text>
<path d="M545 85 Q545 185 100 185" fill="none" stroke="#999" stroke-dasharray="4"/>
<text x="330" y="196" fill="#555">I/O done: T2 returns to the ready queue</text>
</svg>

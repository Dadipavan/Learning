<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="14">
<rect width="640" height="330" fill="#ffffff"/>
<polygon points="320,15 250,70 390,70" fill="#fde2e2" stroke="#b02a2a" stroke-width="2"/>
<text x="320" y="58" text-anchor="middle" font-size="12">Registers</text>
<polygon points="250,70 390,70 430,125 210,125" fill="#fff3cd" stroke="#b58100" stroke-width="2"/>
<text x="320" y="102" text-anchor="middle">L1 / L2 / L3 cache</text>
<polygon points="210,125 430,125 470,180 170,180" fill="#e6f4ea" stroke="#1e7e34" stroke-width="2"/>
<text x="320" y="157" text-anchor="middle">RAM (main memory)</text>
<polygon points="170,180 470,180 510,235 130,235" fill="#e8f0fe" stroke="#1a56c4" stroke-width="2"/>
<text x="320" y="212" text-anchor="middle">SSD</text>
<polygon points="130,235 510,235 550,290 90,290" fill="#ece4f7" stroke="#6b3fa0" stroke-width="2"/>
<text x="320" y="267" text-anchor="middle">Network / object storage</text>
<text x="320" y="320" text-anchor="middle" font-size="12">Top: fastest and smallest. Going down: more space, lower cost per byte, much more waiting time</text>
</svg>

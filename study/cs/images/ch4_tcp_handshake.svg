<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="13">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="640" height="330" fill="#ffffff"/>
<text x="10" y="20" font-weight="bold">TCP connection and one HTTPS request (time flows downward)</text>
<text x="90" y="48" text-anchor="middle" font-weight="bold">Client (your browser)</text>
<text x="550" y="48" text-anchor="middle" font-weight="bold">Server</text>
<line x1="90" y1="58" x2="90" y2="320" stroke="#999" stroke-width="2"/>
<line x1="550" y1="58" x2="550" y2="320" stroke="#999" stroke-width="2"/>
<line x1="90" y1="85" x2="548" y2="105" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="320" y="86" text-anchor="middle">1. SYN  (can we talk?)</text>
<line x1="550" y1="130" x2="92" y2="150" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="320" y="127" text-anchor="middle">2. SYN-ACK  (yes, I hear you)</text>
<line x1="90" y1="175" x2="548" y2="195" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="320" y="173" text-anchor="middle">3. ACK  (connection is open)  = 1 round trip</text>
<line x1="90" y1="220" x2="548" y2="240" stroke="#2b6cb0" stroke-width="2" marker-end="url(#a)"/>
<text x="320" y="218" text-anchor="middle" fill="#2b6cb0">4. TLS hello and keys (about 1 more round trip with TLS 1.3)</text>
<line x1="90" y1="265" x2="548" y2="285" stroke="#2f855a" stroke-width="2" marker-end="url(#a)"/>
<text x="320" y="263" text-anchor="middle" fill="#2f855a">5. GET /login  (encrypted request)</text>
<text x="320" y="312" text-anchor="middle" fill="#333">Before the first byte of data, you already paid 2 round trips of latency.</text>
</svg>

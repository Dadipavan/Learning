<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="sans-serif" font-size="14">
  <rect width="640" height="260" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">Steps for n = 1,000 (bar length uses a log scale)</text>
  <text x="20" y="75">O(log n)</text>
  <rect x="130" y="58" width="60" height="24" fill="#4c9be8"/>
  <text x="200" y="76">about 10 steps</text>
  <text x="20" y="125">O(n)</text>
  <rect x="130" y="108" width="190" height="24" fill="#3fae6a"/>
  <text x="330" y="126">1,000 steps</text>
  <text x="20" y="175">O(n log n)</text>
  <rect x="130" y="158" width="253" height="24" fill="#e0a030"/>
  <text x="393" y="176">about 10,000 steps</text>
  <text x="20" y="225">O(n²)</text>
  <rect x="130" y="208" width="380" height="24" fill="#d9534f"/>
  <text x="520" y="226">1,000,000</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="sans-serif" font-size="14">
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="bold">Fixed window, k = 3, over [2, 1, 5, 1, 3, 2]</text>
  <g stroke="#333" fill="#f4f4f4">
    <rect x="40" y="50" width="50" height="40"/><rect x="90" y="50" width="50" height="40"/><rect x="140" y="50" width="50" height="40"/>
    <rect x="190" y="50" width="50" height="40"/><rect x="240" y="50" width="50" height="40"/><rect x="290" y="50" width="50" height="40"/>
  </g>
  <g text-anchor="middle"><text x="65" y="76">2</text><text x="115" y="76">1</text><text x="165" y="76">5</text><text x="215" y="76">1</text><text x="265" y="76">3</text><text x="315" y="76">2</text></g>
  <rect x="38" y="46" width="154" height="48" fill="none" stroke="#d9534f" stroke-width="3"/>
  <text x="360" y="76">window 1: sum 8</text>
  <g stroke="#333" fill="#f4f4f4">
    <rect x="40" y="120" width="50" height="40"/><rect x="90" y="120" width="50" height="40"/><rect x="140" y="120" width="50" height="40"/>
    <rect x="190" y="120" width="50" height="40"/><rect x="240" y="120" width="50" height="40"/><rect x="290" y="120" width="50" height="40"/>
  </g>
  <g text-anchor="middle"><text x="65" y="146">2</text><text x="115" y="146">1</text><text x="165" y="146">5</text><text x="215" y="146">1</text><text x="265" y="146">3</text><text x="315" y="146">2</text></g>
  <rect x="88" y="116" width="154" height="48" fill="none" stroke="#d9534f" stroke-width="3"/>
  <text x="360" y="146">window 2: 8 - 2 + 1 = 7</text>
  <g stroke="#333" fill="#f4f4f4">
    <rect x="40" y="190" width="50" height="40"/><rect x="90" y="190" width="50" height="40"/><rect x="140" y="190" width="50" height="40"/>
    <rect x="190" y="190" width="50" height="40"/><rect x="240" y="190" width="50" height="40"/><rect x="290" y="190" width="50" height="40"/>
  </g>
  <g text-anchor="middle"><text x="65" y="216">2</text><text x="115" y="216">1</text><text x="165" y="216">5</text><text x="215" y="216">1</text><text x="265" y="216">3</text><text x="315" y="216">2</text></g>
  <rect x="138" y="186" width="154" height="48" fill="none" stroke="#3fae6a" stroke-width="3"/>
  <text x="360" y="216">window 3: 7 - 1 + 3 = 9 (best)</text>
  <text x="20" y="262" font-size="12">The red/green box is the window. Each slide adds one number on the right and drops one on the left.</text>
</svg>

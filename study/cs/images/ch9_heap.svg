<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="sans-serif" font-size="16">
  <rect width="520" height="300" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="bold">Min-heap stored as list [1, 3, 2, 5, 9, 8]</text>
  <g stroke="#555" stroke-width="2">
    <line x1="260" y1="75" x2="160" y2="140"/><line x1="260" y1="75" x2="360" y2="140"/>
    <line x1="160" y1="150" x2="100" y2="215"/><line x1="160" y1="150" x2="220" y2="215"/>
    <line x1="360" y1="150" x2="320" y2="215"/>
  </g>
  <g fill="#e8f1fc" stroke="#336">
    <circle cx="260" cy="65" r="22"/><circle cx="160" cy="150" r="22"/><circle cx="360" cy="150" r="22"/>
    <circle cx="100" cy="225" r="22"/><circle cx="220" cy="225" r="22"/><circle cx="320" cy="225" r="22"/>
  </g>
  <g text-anchor="middle">
    <text x="260" y="71">1</text><text x="160" y="156">3</text><text x="360" y="156">2</text>
    <text x="100" y="231">5</text><text x="220" y="231">9</text><text x="320" y="231">8</text>
  </g>
  <text x="290" y="60" font-size="12" fill="#900">index 0: the minimum</text>
  <text x="20" y="280" font-size="12">Children of index i sit at 2i+1 and 2i+2. Every parent is at most its children.</text>
</svg>

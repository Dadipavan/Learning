<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="sans-serif" font-size="14">
<rect width="640" height="230" fill="#fff"/>
<rect x="30" y="20" width="120" height="40" fill="#dbeafe" stroke="#1d4ed8"/><text x="62" y="45">Client</text>
<rect x="260" y="20" width="130" height="40" fill="#fef9c3" stroke="#a16207"/><text x="278" y="45">Auth server</text>
<rect x="490" y="20" width="120" height="40" fill="#dcfce7" stroke="#15803d"/><text x="530" y="45">API</text>
<line x1="150" y1="30" x2="260" y2="30" stroke="#111" stroke-width="2"/><text x="160" y="22" font-size="12">1 user+password+MFA</text>
<line x1="260" y1="52" x2="150" y2="52" stroke="#111" stroke-width="2"/><text x="165" y="72" font-size="12">2 signed token (JWT)</text>
<line x1="150" y1="130" x2="490" y2="130" stroke="#111" stroke-width="2"/><text x="215" y="122" font-size="12">3 request + token in header</text>
<text x="420" y="160" font-size="12">4 API checks signature,</text><text x="420" y="176" font-size="12">expiry and role</text>
<line x1="490" y1="190" x2="150" y2="190" stroke="#111" stroke-width="2"/><text x="215" y="210" font-size="12">5 data (200) or refused (401 / 403)</text>
<line x1="90" y1="60" x2="90" y2="190" stroke="#999" stroke-dasharray="4"/>
</svg>

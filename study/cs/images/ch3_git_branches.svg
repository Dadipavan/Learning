<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="sans-serif" font-size="13">
<rect width="640" height="220" fill="#ffffff"/>
<text x="10" y="22" font-weight="bold">Branch and merge: each circle is a commit, arrows point to the parent</text>
<line x1="90" y1="70" x2="530" y2="70" stroke="#555" stroke-width="2"/>
<line x1="170" y1="70" x2="250" y2="150" stroke="#555" stroke-width="2"/>
<line x1="250" y1="150" x2="410" y2="150" stroke="#555" stroke-width="2"/>
<line x1="410" y1="150" x2="490" y2="70" stroke="#555" stroke-width="2"/>
<circle cx="90" cy="70" r="14" fill="#2b6cb0"/><text x="90" y="75" fill="#fff" text-anchor="middle">C1</text>
<circle cx="170" cy="70" r="14" fill="#2b6cb0"/><text x="170" y="75" fill="#fff" text-anchor="middle">C2</text>
<circle cx="330" cy="70" r="14" fill="#2b6cb0"/><text x="330" y="75" fill="#fff" text-anchor="middle">C4</text>
<circle cx="490" cy="70" r="14" fill="#c05621"/><text x="490" y="75" fill="#fff" text-anchor="middle">M</text>
<circle cx="250" cy="150" r="14" fill="#2f855a"/><text x="250" y="155" fill="#fff" text-anchor="middle">C3</text>
<circle cx="410" cy="150" r="14" fill="#2f855a"/><text x="410" y="155" fill="#fff" text-anchor="middle">C5</text>
<text x="530" y="75" fill="#2b6cb0" font-weight="bold">main</text>
<text x="430" y="185" fill="#2f855a" font-weight="bold">feature/discount</text>
<text x="10" y="205" fill="#333">M is the merge commit: it has two parents (C4 from main and C5 from the feature branch).</text>
</svg>

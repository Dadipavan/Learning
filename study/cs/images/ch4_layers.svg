<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="sans-serif" font-size="13">
<rect width="640" height="260" fill="#ffffff"/>
<text x="10" y="20" font-weight="bold">The 4 layers of the internet (TCP/IP model), top to bottom</text>
<rect x="20" y="35" width="360" height="45" fill="#bee3f8" stroke="#2b6cb0"/><text x="30" y="55" font-weight="bold">Application</text><text x="30" y="72">HTTP, DNS, TLS, gRPC</text>
<rect x="20" y="85" width="360" height="45" fill="#c6f6d5" stroke="#2f855a"/><text x="30" y="105" font-weight="bold">Transport</text><text x="30" y="122">TCP or UDP, ports (443)</text>
<rect x="20" y="135" width="360" height="45" fill="#fefcbf" stroke="#b7791f"/><text x="30" y="155" font-weight="bold">Internet</text><text x="30" y="172">IP addresses, routing</text>
<rect x="20" y="185" width="360" height="45" fill="#fed7d7" stroke="#c53030"/><text x="30" y="205" font-weight="bold">Link</text><text x="30" y="222">Wi-Fi, Ethernet, MAC address</text>
<text x="400" y="62">What a web developer sees:</text><text x="400" y="80">status codes, page load time</text>
<text x="400" y="112">lost packets, retransmits,</text><text x="400" y="130">connection resets</text>
<text x="400" y="162">hops, route, latency</text>
<text x="400" y="212">cable, Wi-Fi quality</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="white"/><title>News feed fan-out</title><rect x="10" y="120" width="110" height="50" rx="8" fill="#fff4d6" stroke="#3b5ba5" stroke-width="1.5"/><text x="65.0" y="150.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">User posts</text><rect x="170" y="120" width="130" height="50" rx="8" fill="#e6f4ea" stroke="#3b5ba5" stroke-width="1.5"/><text x="235.0" y="142.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Post service</text><text x="235.0" y="158.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">+ queue</text><rect x="350" y="50" width="150" height="50" rx="8" fill="#f3e8fd" stroke="#3b5ba5" stroke-width="1.5"/><text x="425.0" y="72.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Fan-out workers</text><text x="425.0" y="88.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">(normal users)</text><rect x="350" y="180" width="150" height="50" rx="8" fill="#f3e8fd" stroke="#3b5ba5" stroke-width="1.5"/><text x="425.0" y="202.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Skip fan-out</text><text x="425.0" y="218.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">(celebrities)</text><rect x="560" y="50" width="180" height="50" rx="8" fill="#f3e8fd" stroke="#3b5ba5" stroke-width="1.5"/><text x="650.0" y="72.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Feed cache per follower</text><text x="650.0" y="88.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">(list of post ids)</text><rect x="560" y="180" width="180" height="50" rx="8" fill="#f3e8fd" stroke="#3b5ba5" stroke-width="1.5"/><text x="650.0" y="210.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Merge at read time</text><line x1="120" y1="145" x2="170" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="300" y1="135" x2="350" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="300" y1="155" x2="350" y2="205" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="500" y1="75" x2="560" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="500" y1="205" x2="560" y2="205" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="380" y="270" text-anchor="middle" font-family="Arial" font-size="12"  fill="#1a1a1a">Push for most users (fast reads). Pull for users with millions of followers (avoid 10 million writes).</text></svg>
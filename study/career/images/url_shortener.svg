<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="white"/><title>URL shortener</title><rect x="10" y="130" width="90" height="50" rx="8" fill="#fff4d6" stroke="#3b5ba5" stroke-width="1.5"/><text x="55.0" y="160.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Client</text><rect x="140" y="130" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#3b5ba5" stroke-width="1.5"/><text x="195.0" y="152.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Load</text><text x="195.0" y="168.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Balancer</text><rect x="290" y="130" width="110" height="50" rx="8" fill="#e6f4ea" stroke="#3b5ba5" stroke-width="1.5"/><text x="345.0" y="152.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">App servers</text><text x="345.0" y="168.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">(stateless)</text><rect x="450" y="40" width="110" height="50" rx="8" fill="#f3e8fd" stroke="#3b5ba5" stroke-width="1.5"/><text x="505.0" y="62.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Redis cache</text><text x="505.0" y="78.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">short->long</text><rect x="450" y="130" width="110" height="50" rx="8" fill="#f3e8fd" stroke="#3b5ba5" stroke-width="1.5"/><text x="505.0" y="152.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">ID generator</text><text x="505.0" y="168.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">(counter ranges)</text><rect x="620" y="130" width="120" height="50" rx="8" fill="#f3e8fd" stroke="#3b5ba5" stroke-width="1.5"/><text x="680.0" y="152.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Database</text><text x="680.0" y="168.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">short_code, long_url</text><line x1="100" y1="155" x2="140" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="250" y1="155" x2="290" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="400" y1="140" x2="450" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="429.0" y="101.0" font-family="Arial" font-size="11" fill="#444">read: 1st</text><line x1="400" y1="155" x2="450" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="429.0" y="151.0" font-family="Arial" font-size="11" fill="#444">write</text><line x1="560" y1="155" x2="620" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><line x1="505" y1="90" x2="620" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><text x="566.5" y="108.5" font-family="Arial" font-size="11" fill="#444">miss</text><text x="380" y="250" text-anchor="middle" font-family="Arial" font-size="12"  fill="#1a1a1a">Reads: about 3,900 per second average (about 11,600 at 3x peak). Writes: about 39 per second.</text><text x="380" y="275" text-anchor="middle" font-family="Arial" font-size="12"  fill="#1a1a1a">Storage: 6 billion records x 500 bytes = about 3 TB in 5 years.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="230" viewBox="0 0 780 230"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="white"/><title>Interview timeline</title><rect x="10" y="70" width="98" height="60" rx="8" fill="#e6f4ea" stroke="#3b5ba5" stroke-width="1.5"/><text x="59.0" y="97.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Apply /</text><text x="59.0" y="113.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">referral</text><text x="59" y="60" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1a1a1a">Week 0</text><line x1="108" y1="100" x2="118" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="118" y="70" width="98" height="60" rx="8" fill="#e6f4ea" stroke="#3b5ba5" stroke-width="1.5"/><text x="167.0" y="97.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Recruiter</text><text x="167.0" y="113.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">call</text><text x="167" y="60" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1a1a1a">Week 1-2</text><line x1="216" y1="100" x2="226" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="226" y="70" width="98" height="60" rx="8" fill="#e6f4ea" stroke="#3b5ba5" stroke-width="1.5"/><text x="275.0" y="97.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Online test</text><text x="275.0" y="113.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">SQL/Python</text><text x="275" y="60" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1a1a1a">Week 2-3</text><line x1="324" y1="100" x2="334" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="334" y="70" width="98" height="60" rx="8" fill="#e6f4ea" stroke="#3b5ba5" stroke-width="1.5"/><text x="383.0" y="97.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Technical</text><text x="383.0" y="113.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">rounds 1-2</text><text x="383" y="60" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1a1a1a">Week 3-5</text><line x1="432" y1="100" x2="442" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="442" y="70" width="98" height="60" rx="8" fill="#e6f4ea" stroke="#3b5ba5" stroke-width="1.5"/><text x="491.0" y="97.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">System design</text><text x="491.0" y="113.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">/ case</text><text x="491" y="60" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1a1a1a">Week 5-6</text><line x1="540" y1="100" x2="550" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="550" y="70" width="98" height="60" rx="8" fill="#e6f4ea" stroke="#3b5ba5" stroke-width="1.5"/><text x="599.0" y="97.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Manager +</text><text x="599.0" y="113.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">HR round</text><text x="599" y="60" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1a1a1a">Week 6-7</text><line x1="648" y1="100" x2="658" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/><rect x="658" y="70" width="98" height="60" rx="8" fill="#fff4d6" stroke="#3b5ba5" stroke-width="1.5"/><text x="707.0" y="97.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">Offer, then</text><text x="707.0" y="113.0" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a1a1a">negotiate</text><text x="707" y="60" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1a1a1a">Week 7-8</text><text x="390" y="180" text-anchor="middle" font-family="Arial" font-size="12"  fill="#1a1a1a">Typical loop of 5 to 8 weeks. It varies by company; ask the recruiter for the exact stages.</text><text x="390" y="205" text-anchor="middle" font-family="Arial" font-size="12"  fill="#1a1a1a">Then notice period (often 30 to 90 days) before the joining date.</text></svg>
<p><strong>(easy)</strong> A leaf holds [10, 0]. Gini? <strong>Answer:</strong> <code>1 − (1² + 0²) = 0</code>; pure.</p>
<p><strong>(medium)</strong> A node [30, 30] splits into [25, 5] and [5, 25]. Gini gain? <strong>Answer:</strong> parent 0.5; each child <code>1 − (0.8333² + 0.1667²) = 0.2778</code>; equal sizes so weighted 0.2778; gain 0.2222.</p>

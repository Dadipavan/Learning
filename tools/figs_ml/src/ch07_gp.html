<p><strong>(medium)</strong> A categorical column has 5,000 values and you embed to 16 dimensions. How many learned numbers, versus one-hot into a first layer of 64 units? <strong>Answer:</strong> embedding 5,000 × 16 = 80,000; one-hot into 64 units is 5,000 × 64 = 320,000 weights, four times more.</p>
